    const s = p.presence.fcl, d = clubDogDef(s.dog), nm = await nameOf(p);
    const incoming = s.st === 'challenging' && s.to === me;
    const accepted = s.st === 'accepted' && s.to === me && my.st === 'challenging' && my.room === s.room;
    if (accepted){ startClubMatch(s.room, p); return; }
    rows.push(`<div class="pk ${incoming?'mine':''}">
      <div class="pkh"><b>${esc(nm)}</b><span class="bdg">${s.st==='fighting'?'in a fight':(incoming?'challenges you':'ready')}</span></div>
      <div class="mini">${d ? esc(d.name) : 'a Scrappy'} · Bond ${+s.lvl||1}</div>
      ${incoming ? `<button class="sm" data-acc="${esc(p.peer)}">Accept</button> <button class="sm" data-dec="${esc(p.peer)}">Decline</button>`
        : (s.st === 'looking' && my.st === 'looking' ? `<button class="sm" data-chal="${esc(p.peer)}">Challenge</button>` : '')}
    </div>`);
  }
  const waiting = my.st === 'challenging' ? `<p class="mini" style="margin:0 0 10px"><b>Challenge sent.</b> Waiting for them to accept… <button class="sm" id="fcCancel">Cancel</button></p>` : '';
  box.innerHTML = (my.st ? waiting + (rows.length ? `<div class="pkg">${rows.join('')}</div>`
      : `<p class="mini" style="margin:0">Nobody else is in the Club right now. Send the page to a friend — as soon as they open the Club tab and step in, they show up here.</p>`)
    : `<p class="mini" style="margin:0">Pick your fighter, then step into the Club to see who's here.</p>`);
  box.querySelectorAll('[data-chal]').forEach(b => b.onclick = () => {
    S.click(); lobbySet({st:'challenging', to:b.dataset.chal, room:'fc-'+randSalt().slice(0,10), dog:my.dog, lvl:my.lvl});
  });
  box.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => {
    const p = ROOM.peers().find(x => x.peer === b.dataset.acc); if (!p) return;
    S.click(); lobbySet({st:'accepted', to:p.peer, room:p.presence.fcl.room, dog:my.dog, lvl:my.lvl});
    startClubMatch(p.presence.fcl.room, p);
  });
  box.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => { S.click(); lobbySet({st:'looking', dog:my.dog, lvl:my.lvl}); });
  const cc = document.getElementById('fcCancel'); if (cc) cc.onclick = () => { S.click(); lobbySet({st:'looking', dog:my.dog, lvl:my.lvl}); };
}

/* ---------------- match ---------------- */
async function startClubMatch(roomName, oppLobbyPeer){
  if (clubMode) return;
  clubMode = true; arenaRun = null;
  const my = ((ROOM.peers().find(p => p.sameTab) || {}).presence || {}).fcl || {};
  const myDog = my.dog || SAVE.data.club.dog;
  Object.assign(CLUB, {room:null, side:null, oppPeer:oppLobbyPeer.peer, myDog, myLvl:+my.lvl || SAVE.dog(myDog).lvl || 1,
    oppDog:null, move:null, salt:null, commit:null, revealed:false, resolved:0, started:false, ended:false, status:'Connecting…'});
  lobbySet({st:'fighting', dog:CLUB.myDog, lvl:CLUB.myLvl});
  app.innerHTML = `<div class="card"><p class="mini" style="margin:0">🥊 Connecting to the ring…</p></div>`;
  try { CLUB.room = await ROOM.join(roomName); }
  catch(e){ clubAbort('Could not open the ring (' + (e && e.code || 'error') + ').'); return; }
  await CLUB.room.presence({fc:{dog:CLUB.myDog, lvl:CLUB.myLvl, ready:true, t:0}});
  CLUB.unsub = CLUB.room.onPeers(ch => clubTick(ch), err => clubAbort('The ring closed (' + err.code + ').'));
  CLUB.waitSince = Date.now();
  clubTimer();
}

function clubOpp(){ return CLUB.room ? CLUB.room.peers().find(p => !p.sameTab && p.presence && p.presence.fc) : null; }
function clubMe(){ return CLUB.room ? CLUB.room.peers().find(p => p.sameTab) : null; }

async function clubTick(ch){
  if (!CLUB.room || CLUB.ended) return;
  if (ch && ch.left && CLUB.started && ch.left.some(p => !p.sameTab)){ clubEnd(true, 'Your opponent left the ring — you win by forfeit.'); return; }
  const op = clubOpp(), me = clubMe(); if (!op || !me) return;
  const o = op.presence.fc;

  // both in: build the fight in a fixed order so both pages match
  if (!CLUB.started && o.ready){
    CLUB.side = me.peer < op.peer ? 'A' : 'B';
    CLUB.oppDog = o.dog; CLUB.oppLvl = +o.lvl || 1;
    const a = CLUB.side==='A' ? [CLUB.myDog, CLUB.myLvl] : [CLUB.oppDog, CLUB.oppLvl];
    const b = CLUB.side==='A' ? [CLUB.oppDog, CLUB.oppLvl] : [CLUB.myDog, CLUB.myLvl];
    const da = clubDogDef(a[0]), db = clubDogDef(b[0]);
    if (!da || !db){ clubAbort('Unknown fighter on one side.'); return; }
    CLUB.started = true;
    P = build(da, a[1], null); E = build(db, b[1], null);
    turn = 1; log = []; ev = []; over = false;
    LBL.P = CLUB.side==='A' ? 'You' : 'Your opponent';
    LBL.E = CLUB.side==='A' ? 'Your opponent' : 'You';
    say(`<span class="turn">🥊 Fight Club — live. ${esc(da.name)} (Bond ${a[1]}) vs ${esc(db.name)} (Bond ${b[1]}).</span>`);
    shell(); clubNewTurn();
    return;
  }
  if (!CLUB.started || busy) return;

  // opponent committed this turn and so have we → reveal
  if (CLUB.commit && !CLUB.revealed && o.t === turn && o.commit){
    CLUB.revealed = true;
    await CLUB.room.presence({fc:{dog:CLUB.myDog, lvl:CLUB.myLvl, ready:true, t:turn, commit:CLUB.commit,
                                  rv:{t:turn, m:CLUB.move, s:CLUB.salt}, last:null}});
    CLUB.status = 'Both locked in — revealing…'; renderControls();
  }
  // both revealed → verify and resolve
  // Everything about this turn is captured BEFORE awaiting the hash, and the
  // turn is locked, so a second update arriving mid-check can't resolve it twice.
  const t = turn;
  const fromRv = !!(o.rv && o.rv.t === t);
  const orv = fromRv ? o.rv : (o.last && o.last.t === t ? o.last : null);
  if (CLUB.revealed && orv && CLUB.resolved < t && CLUB.checking !== t){
    CLUB.checking = t;
    const theirCommit = fromRv ? o.commit : o.last.commit;
    const check = await sha(orv.m + '|' + orv.s + '|' + t);
    if (CLUB.ended || turn !== t || CLUB.resolved >= t) return;
    if (check !== theirCommit){ clubEnd(true, "Your opponent's move didn't match what they locked in — you win by forfeit."); return; }
    CLUB.resolved = t;
    const sA = CLUB.side==='A' ? CLUB.salt : orv.s, sB = CLUB.side==='A' ? orv.s : CLUB.salt;
    const mA = CLUB.side==='A' ? CLUB.move : orv.m, mB = CLUB.side==='A' ? orv.m : CLUB.move;
    const pa = moveOf(P, mA), ea = moveOf(E, mB);
    resolveSeeded(pa, ea, seedOf(sA + ':' + sB + ':' + t));
    play();
  }
}

function clubNewTurn(){
  CLUB.move = null; CLUB.salt = null; CLUB.commit = null; CLUB.revealed = false;
  CLUB.deadline = Date.now() + CLUB_TURN_MS; CLUB.waitSince = Date.now();
  CLUB.status = 'Choose your move.';
  renderControls();
  clubTick();
}
async function clubChoose(m){
  if (CLUB.commit || CLUB.choosing || over || !CLUB.started) return;
  CLUB.choosing = true;
  S.unlock(); S.click();
  CLUB.move = m; CLUB.salt = randSalt();
  CLUB.commit = await sha(m + '|' + CLUB.salt + '|' + turn);
  CLUB.choosing = false;
  const prev = CLUB.resolved ? null : null;
  await CLUB.room.presence({fc:{dog:CLUB.myDog, lvl:CLUB.myLvl, ready:true, t:turn, commit:CLUB.commit, rv:null,
    last: CLUB.lastRv || null}});
  CLUB.status = 'Locked in. Waiting for your opponent…'; CLUB.waitSince = Date.now();
  renderControls(); clubTick();
}
function clubTimer(){
  clearInterval(CLUB.tick);
  CLUB.tick = setInterval(() => {
    if (!clubMode || CLUB.ended) { clearInterval(CLUB.tick); return; }
    if (!CLUB.started){
      if (Date.now() - CLUB.waitSince > CLUB_AFK_MS) clubAbort('Your opponent never showed up in the ring.');
      return;
    }
    if (busy || over) return;
    if (!CLUB.commit && Date.now() > CLUB.deadline) { clubChoose('guard'); return; }   // out of time: you guard
    if (CLUB.commit && Date.now() - CLUB.waitSince > CLUB_AFK_MS){ clubEnd(true, 'Your opponent stopped answering — you win by forfeit.'); return; }
    const t = document.getElementById('fcClock');
    if (t && !CLUB.commit) t.textContent = Math.max(0, Math.ceil((CLUB.deadline - Date.now())/1000)) + 's';
  }, 250);
}
/* called by play() when a turn's animation has finished */
function clubAfterTurn(){
  CLUB.lastRv = {t: turn - 1, m: CLUB.move, s: CLUB.salt, commit: CLUB.commit};
  if (over){
    const v = verdict();
    const won = CLUB.side === 'A' ? v === 'YOU WIN' : v === 'YOU LOSE';
    clubEnd(won, v === 'DRAW' ? 'A draw.' : null, v === 'DRAW');
    return;
  }
  CLUB.room && CLUB.room.presence({fc:{dog:CLUB.myDog, lvl:CLUB.myLvl, ready:true, t:turn, commit:null, rv:null, last:CLUB.lastRv}});
  clubNewTurn();
}
function clubEnd(won, why, draw){
  if (CLUB.ended) return;
  CLUB.ended = true; over = true; clearInterval(CLUB.tick);
  SAVE.clubResult(draw ? 'd' : (won ? 'w' : 'l'));
  CLUB.result = {won, why, draw};
  won && !draw ? S.win() : (draw ? S.heal() : S.lose());
  renderControls();
}
function clubAbort(why){
  CLUB.ended = true; clearInterval(CLUB.tick);
  clubLeave();
  tab = 'club'; menu();
  const b = document.getElementById('clubLobby'); if (b) b.insertAdjacentHTML('afterbegin', `<p class="mini" style="margin:0 0 10px"><b>${esc(why)}</b></p>`);
}
function clubLeave(){
  try { CLUB.unsub && CLUB.unsub(); } catch(e){}
  try { CLUB.room && CLUB.room.leave(); } catch(e){}
  CLUB.room = null; CLUB.unsub = null; clubMode = false;
  LBL.P = 'Your Scrappy'; LBL.E = 'The opponent';
  const d = SAVE.data.club || {};
  lobbySet(d.dog ? {st:'looking', dog:d.dog, lvl:SAVE.dog(d.dog).lvl} : null);
}

function renderClubControls(c){
  if (CLUB.ended || over){
    const r = CLUB.result || {};
    const rec = SAVE.data.club || {w:0,l:0,d:0};
    c.innerHTML = `<div class="card res">
      <div class="big">${r.draw ? 'DRAW' : (r.won ? 'YOU WIN' : 'YOU LOSE')}</div>
      ${r.why ? `<div class="mini">${esc(r.why)}</div>` : ''}
      <div class="mini" style="margin-top:6px">Club record: ${rec.w}W ${rec.l}L ${rec.d||0}D</div>
      <div class="row" style="margin-top:12px"><button id="fcBack">Back to the Club</button></div></div>`;
    document.getElementById('fcBack').onclick = () => { S.click(); clubLeave(); tab = 'club'; menu(); };
    return;
  }
  const f = myF(), locked = !!CLUB.commit;
  const ab = f.actives.map((a,i)=>`<button class="act" data-fc="ab${i}" ${(locked||a.cost>f.energy)?'disabled':''}>
      <b>${esc(a.value)} · ${a.cost}◆</b><small>${esc(a.text)}</small></button>`).join('');
  c.innerHTML = `<div class="card">
    <p class="mini" style="margin:0 0 8px;display:flex;justify-content:space-between;gap:8px">
      <span>🥊 <b>${esc(CLUB.status)}</b></span><span>${locked ? '🔒' : '⏱️ <b id="fcClock">10s</b>'}</span></p>
    <div class="acts">
      <button class="act" data-fc="bite"  ${locked?'disabled':''}><b>🦷 Bite</b><small>${C.bite.min}-${C.bite.max} dmg. Beats a taunt, stopped by a guard.</small></button>
      <button class="act" data-fc="guard" ${locked?'disabled':''}><b>🛡️ Guard</b><small>Blocks a bite and snaps back for 2, +1◆. Loses to a taunt.</small></button>
      <button class="act" data-fc="taunt" ${locked?'disabled':''}><b>🐶 Taunt</b><small>+2◆, 2 chip through a guard. Eats extra from a bite.</small></button>
    </div>
    ${ab ? `<div class="acts abil">${ab}</div>` : ''}
    <p class="mini" style="margin:9px 0 0">You're on the <b>${CLUB.side==='A'?'left':'right'}</b>. Moves are locked as a hash and only revealed once both are in — nobody can see yours first.</p>
  </div>`;
  c.querySelectorAll('[data-fc]').forEach(b => b.onclick = () => clubChoose(b.dataset.fc));
}

/* ============================ wallet (live site) ============================ */
/* With CONFIG.WORKER_URL set, players sign in with Xaman and only the Pixel
   Scrappys in their own wallet appear. Without it the page runs as the demo. */
const WALLET = {token:null, account:null, demo:false, loading:false, progress:'', error:'', login:null, owned:null};
let OWNED = null;
const ROSTER  = () => (OWNED && !WALLET.demo) ? OWNED : DATA.fighters;
const findDog = id => (OWNED || []).find(f => f.id === id) || DATA.fighters.find(f => f.id === id);
const LIVE = () => !!CONFIG.WORKER_URL;

function api(path, opt){
  opt = opt || {};
  const h = Object.assign({}, opt.headers || {});
  if (WALLET.token) h.authorization = 'Bearer ' + WALLET.token;
  if (opt.body) h['content-type'] = 'application/json';
  return fetch(CONFIG.WORKER_URL.replace(/\/$/, '') + path, {method: opt.method || 'GET', headers: h,
    body: opt.body ? JSON.stringify(opt.body) : undefined});
}
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

/* ---- sign-in ---- */
async function walletConnect(){
  WALLET.error = ''; WALLET.login = {state:'starting'}; menu();
  try {
    const r = await api('/auth/start', {method:'POST'});
    const j = await r.json();
    if (!r.ok || !j.uuid) throw new Error(j.error || 'start failed');
    WALLET.login = {state:'waiting', uuid:j.uuid, qr:j.qr, link:j.deeplink, since:Date.now()};
    lsSet('ba_pending', {uuid:j.uuid, at:Date.now()});
    menu(); walletPoll();
  } catch(e){ WALLET.login = null; WALLET.error = 'Xaman is not reachable right now. Try again in a minute.'; menu(); }
}
async function walletPoll(){
  const L = WALLET.login; if (!L || L.state !== 'waiting') return;
  if (Date.now() - L.since > 5*60*1000){ WALLET.login = null; lsSet('ba_pending', null); WALLET.error = 'The sign-in request expired.'; menu(); return; }
  try {
    const r = await api('/auth/status?uuid=' + encodeURIComponent(L.uuid));
    const j = await r.json();
    if (j.state === 'signed'){
      lsSet('ba_pending', null); lsSet('ba_session', {token:j.token, account:j.account});
      WALLET.login = null; walletSignedIn(j.token, j.account); return;
    }
    if (j.state === 'rejected' || j.state === 'expired'){
      lsSet('ba_pending', null); WALLET.login = null;
      WALLET.error = j.state === 'rejected' ? 'Sign-in was declined in Xaman.' : 'The sign-in request expired.'; menu(); return;
    }
  } catch(e){}
  setTimeout(walletPoll, 2000);
}
/* ---- Joey Wallet (browser extension) ----
   Joey injects an XLS-72d provider as window.joey (or window.xrpl.joey). We ask
   the server for a one-time nonce, let Joey sign a "Sign in with XRPL" message
   (or, for a Ledger account, an unsubmittable challenge payment) and hand that
   to the server, which checks it and returns the same session as Xaman. */
function joeyProvider(){ return window.joey || (window.xrpl && window.xrpl.joey) || null; }
async function waitForJoeyProvider(ms){
  const t0 = Date.now();
  while (!joeyProvider() && Date.now() - t0 < ms) await wait(150);
  return joeyProvider();
}
function joeyCall(p, method, params){
  return typeof p[method] === 'function' ? p[method](params) : p.request({method, params});
}
async function joeyConnect(){
  WALLET.error = ''; WALLET.login = {state:'joey', step:'Looking for the Joey extension…'}; menu();
  const step = t => { if (WALLET.login && WALLET.login.state === 'joey'){ WALLET.login.step = t; menu(); return true; } return false; };
  try {
    const p = await waitForJoeyProvider(2500);
    if (!p) throw Object.assign(new Error('Joey Wallet extension not found in this browser. Install it from joeywallet.xyz — or pick Xaman.'), {shown:true});
    if (!step('Approve the connection in Joey…')) return;
    await joeyCall(p, 'connect', {name:'Bark Arena', icon:'https://scrappyxrp.fun/favicon-192.png'});
    const r = await api('/auth/joey/start', {method:'POST'}); const st = await r.json();
    if (!r.ok || !st.nonce) throw Object.assign(new Error('The game server is not reachable right now.'), {shown:true});
    if (!step('Approve the sign-in in Joey…')) return;
    const res = await joeyCall(p, 'signIn', {statement: st.statement, nonce: st.nonce});
    if (!WALLET.login || WALLET.login.state !== 'joey') return;             // cancelled meanwhile
    const body = res && res.signedTx ? {address:res.address, signedTx:res.signedTx}   // Ledger account
      : {address:res.address, publicKey:res.publicKey, message:res.message, signature:res.signature};
    const v = await api('/auth/joey/verify', {method:'POST', body}); const j = await v.json();
    if (!v.ok || j.state !== 'signed') throw Object.assign(new Error('Joey sign-in could not be verified (' + (j.error || v.status) + ').'), {shown:true});
    lsSet('ba_session', {token:j.token, account:j.account});
    WALLET.login = null; walletSignedIn(j.token, j.account);
  } catch(e){
    if (!WALLET.login) return;
    const declined = e && (e.code === 4001 || /reject|denied|declin/i.test(e.message || ''));
    WALLET.login = {state:'choose'};
    WALLET.error = declined ? 'Sign-in was declined in Joey.' : (e && e.shown ? e.message : 'Joey sign-in failed (' + ((e && e.message) || 'unknown error') + ').');
    menu();
  }
}
/* ---- Joey app (mobile) over WalletConnect ----
   /wc.js bundles @walletconnect/sign-client and a QR generator and is only
   loaded here. The app has no sign-in method over WalletConnect, so it proves
   the wallet by signing a payment of 1 drop to itself — a transaction rippled
   refuses (temREDUNDANT), so the signature can never move funds — carrying the
   server's one-time nonce in a memo. The server checks it like a Ledger sign-in. */
let WC = null;
const isPhone = () => /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const toHexUtf8 = t => Array.from(new TextEncoder().encode(t), b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
async function wcClient(){
  if (WC) return WC;
  const mod = await import('/wc.js');
  const client = await mod.SignClient.init({
    projectId: CONFIG.WC_PROJECT_ID,
    metadata: {name: 'Bark Arena', description: 'The Pixel Scrappy game', url: location.origin,
               icons: ['https://scrappyxrp.fun/favicon-192.png']},
  });
  WC = {client, qrDataUrl: mod.qrDataUrl};
  return WC;
}
async function joeyMobileConnect(){
  WALLET.error = ''; WALLET.login = {state:'joeym', step:'Preparing the connection…'}; menu();
  const live = () => WALLET.login && WALLET.login.state === 'joeym';
  const set = o => { if (live()){ Object.assign(WALLET.login, o); menu(); } return live(); };
  let wc, session;
  try {
    wc = await wcClient();
    const {uri, approval} = await wc.client.connect({
      requiredNamespaces: {xrpl: {chains: ['xrpl:0'], methods: ['xrpl_signTransaction'], events: []}},
    });
    if (!set(isPhone() ? {step:'Tap “Open Joey” and approve the connection.', link: uri}
                       : {step:'Scan the code with the Joey app.', qr: await wc.qrDataUrl(uri)})) return;
    session = await approval();
    if (!live()) return;
    const acct = ((session.namespaces.xrpl || {}).accounts || [])[0] || '';
    const address = acct.split(':').pop();
    if (!/^r[1-9A-HJ-NP-Za-km-z]{24,34}$/.test(address)) throw Object.assign(new Error('Joey did not share an XRPL account.'), {shown:true});
    const r = await api('/auth/joey/start', {method:'POST'}); const st = await r.json();
    if (!r.ok || !st.nonce) throw Object.assign(new Error('The game server is not reachable right now.'), {shown:true});
    const back = (session.peer.metadata.redirect || {}).native || (session.peer.metadata.redirect || {}).universal || '';
    if (!set({connected:true, qr:null, link: isPhone() ? back : '', step:'Connected as ' + address.slice(0,6) + '…' + address.slice(-4) + '. Now approve the sign-in in the Joey app — it signs a 1-drop payment to yourself that can never be sent.'})) return;
    const tx = {TransactionType:'Payment', Account:address, Destination:address, Amount:'1', Fee:'12', Sequence:0,
      Memos:[{Memo:{MemoType: toHexUtf8('bark-arena/sign-in'), MemoData: toHexUtf8(JSON.stringify({wallet:'joey', challenge: st.nonce}))}}]};
    const res = await wc.client.request({topic: session.topic, chainId: 'xrpl:0',
      request: {method: 'xrpl_signTransaction', params: {tx_json: tx, autofill: false, submit: false}}});
    if (!live()) return;
    const blob = typeof res === 'string' ? res : (res && (res.tx_blob || res.signedTransaction || (res.result && res.result.tx_blob)));
    const signed = res && (res.tx_json || (res.result && res.result.tx_json));
    const body = blob ? {address, txBlob: blob} : signed ? {address, signedTx: JSON.stringify(signed)} : null;
    if (!body) throw Object.assign(new Error('Joey returned no signed transaction.'), {shown:true});
    const v = await api('/auth/joey/verify', {method:'POST', body}); const j = await v.json();
    if (!v.ok || j.state !== 'signed') throw Object.assign(new Error('Joey sign-in could not be verified (' + (j.error || v.status) + ').'), {shown:true});
    lsSet('ba_session', {token:j.token, account:j.account});
    WALLET.login = null; walletSignedIn(j.token, j.account);
  } catch(e){
    if (live()){
      const declined = e && (e.code === 4001 || e.code === 5000 || /reject|denied|declin/i.test(e.message || ''));
      const expired = /expired/i.test((e && e.message) || '');
      WALLET.login = {state:'choose'};
      WALLET.error = declined ? 'Sign-in was declined in the Joey app.' : expired ? 'The connection request expired — try again.'
        : (e && e.shown ? e.message : 'Joey app sign-in failed (' + ((e && e.message) || 'unknown error') + ').');
      menu();
    }
  } finally {
    // the session was only for signing in; the game uses its own session from here on
    if (wc && session) wc.client.disconnect({topic: session.topic, reason: {code: 6000, message: 'Signed in'}}).catch(() => {});
  }
}
async function walletSignedIn(token, account){
  WALLET.token = token; WALLET.account = account; WALLET.demo = false;
  SAVE.useAccount(account);
  await cloudPull();
  loadKennel();
}

/* ---- cloud save ----
   The whole save is mirrored to the server per wallet (a backup, and the same
   progress on every device). Pushes are bundled a few seconds after a change;
   on sign-in the newer of the local and the server save wins. */
let cloudTimer = null;
const cloudOn = () => LIVE() && !!WALLET.token && !WALLET.demo;
function cloudQueue(){
  try { if (!cloudOn()) return; } catch(e){ return; }   // saves during start-up run before WALLET exists
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(cloudPush, 3000);
}
function cloudPush(keepalive){
  clearTimeout(cloudTimer); cloudTimer = null;
  if (!cloudOn()) return Promise.resolve();
  const h = {'content-type':'application/json', authorization:'Bearer ' + WALLET.token};
  return fetch(CONFIG.WORKER_URL.replace(/\/$/, '') + '/save', {method:'POST', headers:h, keepalive: !!keepalive,
    body: JSON.stringify({data: SAVE.data})}).catch(() => {});
}
async function cloudPull(){
  if (!cloudOn()) return;
  try {
    const r = await api('/save'); if (!r.ok) return;
    const j = await r.json(), local = SAVE.data;
    if (j.data && j.data.v === 1 && (j.data.updatedAt || 0) > (local.updatedAt || 0)) SAVE.adopt(j.data);   // server is newer
    else if (local.updatedAt) cloudPush();                                                                   // this device is newer
  } catch(e){}
}
// leaving the page: send what's still waiting
window.addEventListener('pagehide', () => { if (cloudTimer) cloudPush(true); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && cloudTimer) cloudPush(true); });

}

/* ---- the player's own dogs ---- */
const PATTERNED = new Set(['bonepattern','pawprintpattern','xrplgrid','nightsky','moon','goldradial']);
const nrm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
const BYVAL = {};
DATA.traits.forEach(t => { (BYVAL[nrm(t.value)] = BYVAL[nrm(t.value)] || []).push(t); });
function traitFor(type, value){
  const c = BYVAL[nrm(value)]; if (!c) return null;
  if (c.length === 1) return c[0].id;
  const tt = nrm(type);
  return (c.find(t => tt.includes(nrm(t.layer).slice(0, 4)) || nrm(t.trait_type) === tt) || c[0]).id;
}
function defFromMeta(nft, m){
  const at = m.attributes || [], get = n => (at.find(a => nrm(a.t) === nrm(n)) || {}).v;
  const token = m.token || null;
  const legendary = token && token >= 1 && token <= 20 ? String(token) : null;
  const setName = (get('Set') || '').replace(/\s+II$/i, '').trim();
  const traits = [], unknown = [];
  if (!legendary) for (const a of at){
    if (['rarity','set','setmatch','type','legendary','paws'].includes(nrm(a.t))) continue;
    if (['', 'none', 'keins', 'kein', 'nothing', 'null'].includes(nrm(a.v))) continue;   // empty layers, e.g. "(keins)"
    const id = traitFor(a.t, a.v); id ? traits.push(id) : unknown.push(a.t + ': ' + a.v);
  }
  return {id: nft.nft_id, token, name: m.name || ('Pixel Scrappy' + (token ? ' #' + token : '')),
          rarity: legendary ? 'Legendary' : (get('Rarity') || 'Common'),
          set: setName || null, setMatch: +(get('Set Match') || 0), legendary, traits, unknown,
          bg: nrm(get('Background'))};
}

const SIL = (() => { const b = atob(SIL_B64), m = new Uint8Array(9216);
  for (let i = 0; i < 9216; i++) m[i] = (b.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1; return m; })();

/* Cut a 1152px collection image down to its 96px grid and lift the dog off its
   background: chained flood fill from the border, then (for patterned
   backgrounds) keep only what touches the body or sits on the ground. */
function cutout(bitmap, patterned){
  const N = 96, c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(bitmap, 0, 0, N, N);
  const im = x.getImageData(0, 0, N, N), p = im.data, bg = new Uint8Array(N*N);
  const Q = new Int32Array(N*N*12); let h = 0, t = 0;
  const push = (i, ref) => { Q[t++] = i; Q[t++] = ref; };
  for (let k = 0; k < N; k++){ push(k,k); push((N-1)*N+k,(N-1)*N+k); push(k*N,k*N); push(k*N+N-1,k*N+N-1); }
  while (h < t){
    const i = Q[h++], ref = Q[h++]; if (bg[i]) continue;
    const a = i*4, b = ref*4;
    if (Math.abs(p[a]-p[b]) + Math.abs(p[a+1]-p[b+1]) + Math.abs(p[a+2]-p[b+2]) > 26) continue;
    bg[i] = 1; const X = i % N, Y = (i / N) | 0;
    if (X > 0) push(i-1, i); if (X < N-1) push(i+1, i); if (Y > 0) push(i-N, i); if (Y < N-1) push(i+N, i);
  }
  // 8-connected components of what's left
  const comp = new Int32Array(N*N).fill(-1), sizes = [], touchS = [], low = [];
  for (let s = 0; s < N*N; s++){
    if (bg[s] || comp[s] >= 0) continue;
    const id = sizes.length; let n = 0, ts = false, lo = false; const st = [s]; comp[s] = id;
    while (st.length){
      const i = st.pop(); n++; if (SIL[i]) ts = true; if (((i / N) | 0) >= 72) lo = true;
      const X = i % N, Y = (i / N) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
        const nx = X+dx, ny = Y+dy; if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
        const j = ny*N + nx; if (!bg[j] && comp[j] < 0){ comp[j] = id; st.push(j); }
      }
    }
    sizes.push(n); touchS.push(ts); low.push(lo);
  }
  for (let i = 0; i < N*N; i++){
    let keep = !bg[i] || SIL[i];
    if (keep && !SIL[i] && comp[i] >= 0){
      const k = comp[i];
      keep = patterned ? (touchS[k] || (low[k] && sizes[k] >= 12)) : (touchS[k] || sizes[k] >= 5);
    }
    if (!keep) p[i*4+3] = 0;
  }
  x.putImageData(im, 0, 0);
  return c.toDataURL('image/png');
}
/* When the server is rate limited by IPFS, the browser fetches directly: the
   player's own IP is almost never throttled, and gateways allow CORS. */
const IPFS_GW = ['https://ipfs.io/ipfs/', 'https://gateway.pinata.cloud/ipfs/', 'https://dweb.link/ipfs/', 'https://w3s.link/ipfs/'];
function ipfsUrls(u){
  u = String(u || '').trim();
  let m = u.match(/^ipfs:\/\/(?:ipfs\/)?(.+)$/) || u.match(/^https:\/\/[^/]+\/ipfs\/(.+)$/) || u.match(/^((?:Qm[1-9A-HJ-NP-Za-km-z]{44}|b[a-z2-7]{50,})(?:\/.*)?)$/);
  return m ? IPFS_GW.map(g => g + m[1]) : (/^https:\/\//i.test(u) ? [u] : []);
}
async function directFetch(u){
  const urls = ipfsUrls(u); if (!urls.length) throw new Error('no url');
  const ctl = urls.map(() => new AbortController()), timer = setTimeout(() => ctl.forEach(c => c.abort()), 12000);
  try {
    const [r, win] = await Promise.any(urls.map((url, i) => fetch(url, {signal: ctl[i].signal})
      .then(r => { if (!r.ok) throw new Error('http ' + r.status); return [r, i]; })));
    ctl.forEach((c, i) => { if (i !== win) c.abort(); });
    return r;
  } catch(e){ throw new Error((e.errors && e.errors[0] && e.errors[0].message) || 'unreachable'); }
  finally { clearTimeout(timer); }
}
async function directMeta(uri){
  const r = await directFetch(uri), m = await r.json(), base = r.url;
  let image = m.image || m.image_url || '';
  if (image && !/^(ipfs:|https:)/i.test(image) && !ipfsUrls(image).length){
    image = new URL(image, base).toString();
    if (/\/metadata\//.test(base)) image = image.replace('/metadata/', '/images/');
  }
  return {name: m.name || '', token: +((m.name || '').match(/#\s*(\d+)/) || [])[1] || null, image,
          attributes: Array.isArray(m.attributes) ? m.attributes.map(a => ({t: String(a.trait_type || ''), v: String(a.value ?? '')})) : []};
}
async function imageFor(def, imageUrl){
  if (def.legendary){ const L = DATA.fighters.find(f => f.id === 'L' + def.legendary); if (L) return L.img; }
  let r = await api('/img?u=' + encodeURIComponent(imageUrl)).catch(() => null);
  if (!r || !r.ok) r = await directFetch(imageUrl).catch(e => { throw new Error('image ' + (r ? r.status : e.message)); });
  const bmp = await createImageBitmap(await r.blob());
  return cutout(bmp, PATTERNED.has(def.bg));
}

/* One NFT (nft_id + uri) → a playable fighter: metadata, then the cut-out image.
   The server is tried first; the browser fetches directly if the server can't. */
async function loadDef(n){
  let m;
  try {
    const mr = await api('/meta?uri=' + encodeURIComponent(n.uri));
    m = await mr.json(); if (!mr.ok) throw new Error(m.error || 'meta');
  } catch(se){ m = await directMeta(n.uri).catch(e => { throw new Error(se.message + ', direct: ' + e.message); }); }
  const def = defFromMeta(n, m);
  def.img = await imageFor(def, m.image);
  return def;
}

/* ---- opponents from the real collection ----
   Every Pixel Scrappy's metadata sits in one IPFS folder (…/<number>.json).
   Once the kennel knows that folder, rivals are drawn at random from all of
   them, fetched in the background and kept in a small rotating pool. */
const COLLECTION_SIZE = 5000;
const OPP = {base: lsGet('ba_opp_base'), pool: lsGet('ba_opps') || [], busy: false, taken: new Set(), takenAt: 0};
/* Token number of a fighter: real NFTs carry it, demo Legendaries are L1–L20, demo dogs use it as id. */
const tokenOf = f => f.token || (f.legendary ? +f.legendary : +f.id) || null;
/* Scrappys held by anyone who signed in to the game — never drawn as rivals. */
const isTaken = f => { const t = tokenOf(f); return !!t && OPP.taken.has(t); };
async function oppLoadTaken(){
  if (Date.now() - OPP.takenAt < 5 * 60 * 1000) return;
  try {
    const r = await api('/taken'); const j = await r.json();
    if (r.ok && Array.isArray(j.tokens)){
      OPP.taken = new Set(j.tokens); OPP.takenAt = Date.now();
      OPP.pool = OPP.pool.filter(f => !isTaken(f)); lsSet('ba_opps', OPP.pool);
    }
  } catch(e){}
}
function oppLearnBase(nfts){
  const count = {};
  for (const n of nfts){ const m = String(n.uri || '').match(/^(.*\/)\d+\.json$/); if (m) count[m[1]] = (count[m[1]] || 0) + 1; }
  const best = Object.keys(count).sort((a, b) => count[b] - count[a])[0];
  if (best && best !== OPP.base){ OPP.base = best; OPP.pool = []; lsSet('ba_opp_base', best); lsSet('ba_opps', []); }
}
async function oppTopUp(){
  if (OPP.busy || !OPP.base || !WALLET.token || WALLET.demo) return;
  OPP.busy = true;
  try {
    await oppLoadTaken();
    for (let tries = 0; OPP.pool.length < 24 && tries < 8; tries++){
      const num = rint(21, COLLECTION_SIZE);        // 1–20 are the Legendaries, drawn separately
      if (OPP.taken.has(num) || OPP.pool.some(f => f.token === num)) continue;
      try {
        const def = await loadDef({nft_id: 'opp' + num, uri: OPP.base + num + '.json'});
        OPP.pool.push(def); lsSet('ba_opps', OPP.pool);
      } catch(e){ console.warn('opponent', num, e); }
    }
  } finally { OPP.busy = false; }
}

async function loadKennel(fresh){
  WALLET.loading = true; WALLET.error = ''; WALLET.progress = 'Reading your wallet…'; tab = 'kennel'; menu();
  try {
    const r = await api('/me/kennel' + (fresh ? '?fresh=1' : ''));
    if (r.status === 401){ walletSignOut(); WALLET.error = 'Your session ended — sign in again.'; menu(); return; }
    const j = await r.json(); if (!r.ok) throw new Error(j.error || 'kennel');
    WALLET.name = j.name || null;
    const cacheKey = 'ba_dogs:' + WALLET.account, cache = lsGet(cacheKey) || {};
    const out = [], failed = [];
    let next = 0, done = 0;
    // a few at a time: fast, without tripping the gateways' rate limits
    const worker = async () => { while (next < j.nfts.length){
      const n = j.nfts[next++];
      try {
        let c = cache[n.nft_id];
        if (!c){ c = cache[n.nft_id] = await loadDef(n); lsSet(cacheKey, cache); }
        out.push(c);
      } catch(e){ console.warn('skipped', n.nft_id, e); failed.push(e.message); }
      done++; WALLET.progress = `Fetching your Scrappys… ${done} of ${j.nfts.length}`; menu();
    } };
    await Promise.all([0,1,2,3].map(worker));
    // Never a silent 0: say what the wallet holds and why nothing could be shown.
    if (!j.nfts.length && j.hint) WALLET.error = j.hint;
    else if (failed.length) WALLET.error = `${failed.length} of ${j.nfts.length} Scrappy${j.nfts.length===1?'':'s'} could not be loaded (${failed[0]}). Hit ↻ Refresh to retry.`;
    out.sort((a,b) => (b.legendary?1:0) - (a.legendary?1:0) || (a.token||1e9) - (b.token||1e9));
    OWNED = out; WALLET.owned = out.length;
    oppLearnBase(j.nfts);
  } catch(e){ WALLET.error = 'Could not load your kennel (' + e.message + ').'; }
  WALLET.loading = false; menu();
  oppTopUp(); loadPacks();
}

function walletWire(){
  const q = id => document.getElementById(id);
  if (q('connectLive')) q('connectLive').onclick = () => { S.unlock(); S.click(); WALLET.error = ''; WALLET.login = {state:'choose'}; menu(); };
  if (q('pickXaman'))  q('pickXaman').onclick = () => { S.click(); walletConnect(); };
  if (q('pickJoey'))   q('pickJoey').onclick = () => { S.click(); joeyConnect(); };
  if (q('pickJoeyM'))  q('pickJoeyM').onclick = () => { S.click(); joeyMobileConnect(); };
  if (q('joeyMCancel')) q('joeyMCancel').onclick = () => { S.click(); WALLET.login = null; menu(); };
  if (q('pickCancel')) q('pickCancel').onclick = () => { S.click(); WALLET.login = null; WALLET.error = ''; menu(); };
  if (q('joeyCancel')) q('joeyCancel').onclick = () => { S.click(); WALLET.login = null; menu(); };
  if (q('xamCancel')) q('xamCancel').onclick = () => { WALLET.login = null; lsSet('ba_pending', null); menu(); };
  if (q('demo'))      q('demo').onclick = () => { S.unlock(); S.click(); WALLET.demo = true; menu(); };
  if (q('signout'))   q('signout').onclick = () => { S.click(); walletSignOut(); };
  if (q('nameEdit'))  q('nameEdit').onclick = () => { S.click(); WALLET.editName = true; WALLET.nameError = ''; menu(); const i = q('nameIn'); if (i) i.focus(); };
  if (q('nameCancel')) q('nameCancel').onclick = () => { S.click(); WALLET.editName = false; menu(); };
  if (q('nameIn'))    q('nameIn').onkeydown = e => { if (e.key === 'Enter') q('nameSave').click(); };
  if (q('nameSave'))  q('nameSave').onclick = async () => {
    S.click();
    const name = q('nameIn').value.replace(/\s+/g, ' ').trim();
    try {
      const r = await api('/profile', {method:'POST', body:{name}}); const j = await r.json();
      if (!r.ok) throw new Error(j.error === 'name_taken' ? 'That name is already taken.' : 'Use 3–16 letters, numbers, space, _ . or - (and nothing that looks like a wallet).');
      WALLET.name = j.name; WALLET.editName = false; WALLET.nameError = '';
    } catch(e){ WALLET.nameError = e.message; }
    menu();
  };
  if (q('reload'))    q('reload').onclick = () => { S.click(); lsSet('ba_dogs:' + WALLET.account, null); loadKennel(true); };
}
function walletBoot(){
  if (!LIVE()) return;
  const s = lsGet('ba_session');

/* ============================ fx ============================ */
let cv, ctx, parts = [], beams = [], raf = 0;
function fxInit(c){
  cv = c; ctx = c.getContext('2d');
  const r = () => { const b = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio||1);
    cv.width = b.width*d; cv.height = b.height*d; ctx.setTransform(d,0,0,d,0,0); };
  r(); addEventListener('resize', r);
  cancelAnimationFrame(raf); loop();
}
function loop(){
  if (!ctx) return;
  const w = cv.clientWidth, h = cv.clientHeight;
  ctx.clearRect(0,0,w,h);
  for (const b of beams){
    b.life--;
    ctx.globalAlpha = Math.max(0, b.life/b.max);
    ctx.lineCap = 'round';
    ctx.strokeStyle = b.glow; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
    ctx.strokeStyle = b.core; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  beams = beams.filter(b => b.life > 0);
  for (const p of parts){
    p.vy += .42; p.x += p.vx; p.y += p.vy; p.life--;
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = p.c; ctx.fillRect(p.x|0, p.y|0, p.s, p.s);
    ctx.globalAlpha = 1;
  }
  parts = parts.filter(p => p.life > 0);
  raf = requestAnimationFrame(loop);
}
function burst(x, y, n, cols, spd){
  for (let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*spd,vy:(Math.random()-.9)*spd,
    s:rint(3,5),c:cols[rint(0,cols.length-1)],life:rint(24,42),max:42});
}
function anchor(side){
  const st = document.querySelector('.stage'), el = document.querySelector('.fighter.'+(side==='l'?'left':'right'));
  if (!st || !el) return {x:0,y:0};
  const a = st.getBoundingClientRect(), b = el.getBoundingClientRect();
  return {x: b.left-a.left + b.width/2, y: b.top-a.top + b.height*0.42};
}
function floatTxt(side, cls, txt){
  const st = document.querySelector('.stage'); if (!st) return;
  const p = anchor(side), d = document.createElement('div');
  d.className = 'float '+cls; d.textContent = txt;
  d.style.left = (p.x-24)+'px'; d.style.top = (p.y-30)+'px';
  st.appendChild(d); setTimeout(()=>d.remove(), 1100);
}
function anim(side, cls, ms){
  const el = document.querySelector('.fighter.'+(side==='l'?'left':'right'));
  if (!el) return; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls), ms);
}
function setBars(){
  const st = document.querySelector('.stage'); if (!st) return;
  [['l',P],['r',E]].forEach(([s,f])=>{
    const bar = st.querySelector('.hud.'+s+' .bar'); if(!bar) return;
    const pct = 100*f.hp/f.maxHp;
    bar.classList.toggle('low', pct<=30); bar.classList.toggle('mid', pct>30 && pct<=60);
    bar.querySelector('i').style.width = pct+'%';
    bar.querySelector('u').style.width = pct+'%';
    st.querySelector('.hud.'+s+' .hpn').textContent = f.hp+'/'+f.maxHp;
    st.querySelector('.hud.'+s+' .pips').textContent = '◆'.repeat(Math.min(f.energy,9));
  });
}

async function play(){
  busy = true; document.getElementById('ctrl')?.classList.add('busy');
  for (const e of ev){
    if (e.t==='banner'){ const b=document.querySelector('.banner'); if(b){b.textContent=e.txt;b.classList.remove('on');void b.offsetWidth;b.classList.add('on');} S.round(); await wait(320); }
    else if (e.t==='moves'){
      if (e.l==='bite'||e.l==='ability') anim('l','lunge',430); else anim('l', e.l==='guard'?'guard':'taunt', 560);
      if (e.r==='bite'||e.r==='ability') anim('r','lunge',430); else anim('r', e.r==='guard'?'guard':'taunt', 560);
      if (e.l==='bite'||e.r==='bite'||e.l==='ability'||e.r==='ability') S.whoosh();
      if (e.l==='taunt'||e.r==='taunt') S.bark();
      await wait(260);
    }
    else if (e.t==='shield'){
      const sh=document.querySelector('.shield.'+(e.who==='l'?'left':'right'));
      if(sh){sh.classList.remove('on');void sh.offsetWidth;sh.classList.add('on');}
      S.guardUp();
      await wait(120);
    }
    else if (e.t==='laser' || e.t==='bolt'){
      const a=anchor(e.from), b=anchor(e.to);
      const laser = e.t==='laser';
      beams.push({x1:a.x,y1:a.y,x2:b.x,y2:b.y,life:16,max:16,
        glow: laser?'rgba(255,60,60,.55)':'rgba(255,225,120,.55)', core: laser?'#fff0f0':'#fffbe6'});
      burst(b.x,b.y,16, laser?['#ff4d4d','#ffb3b3','#fff']:['#ffe066','#fff6c2','#fff'], 7);
      laser ? S.laser() : S.bolt();
      await wait(260);
    }
    else if (e.t==='burn'){ const p=anchor(e.who); burst(p.x,p.y+14,10,['#ff8a3d','#ffc14d','#ff5a2b'],4); S.burn(); await wait(140); }
    else if (e.t==='hit'){
      anim(e.who,'hurt',320);
      const p = anchor(e.who);
      const big = e.kind==='big'||e.n>=7;
      e.kind==='counter' ? S.counter() : S.hit(big);
      burst(p.x,p.y,big?22:12, e.kind==='counter'?['#bfe86a','#eaffb0','#fff']:['#ffd9d9','#ff6b6b','#fff'], big?8:5.5);
      floatTxt(e.who,'dmgN','-'+e.n);
      if (big){ const st=document.querySelector('.stage'); st?.classList.add('shake'); setTimeout(()=>st?.classList.remove('shake'),300); }
      setBars();
      await wait(430);
    }
    else if (e.t==='float'){
      floatTxt(e.who,e.cls,e.txt); setBars();
      if (e.cls==='healN') S.heal(); else if (e.cls==='enN') S.energy(); else S.miss();
      await wait(300);
    }
  }
  setBars();
  const lg = document.getElementById('log'); if (lg){ lg.innerHTML = log.join('<br>'); lg.scrollTop = lg.scrollHeight; }
  if (clubMode){
    if (P.hp<=0) document.querySelector('.fighter.left')?.classList.add('faint');
    if (E.hp<=0) document.querySelector('.fighter.right')?.classList.add('faint');
    busy = false; document.getElementById('ctrl')?.classList.remove('busy');
    clubAfterTurn();
    return;
  }
  if (over){
    const v = verdict();
    if (P.hp<=0) document.querySelector('.fighter.left')?.classList.add('faint');
    if (E.hp<=0) document.querySelector('.fighter.right')?.classList.add('faint');
    if (v==='YOU WIN'){ document.querySelector('.fighter.left')?.classList.add('cheer');
      const p=anchor('l'); S.win(); for(let i=0;i<3;i++){ burst(p.x,p.y-20,18,['#ffd54a','#7be08a','#6fc3ff','#ff8ad1'],9); await wait(160); } }
    else S.lose();
    const b=document.querySelector('.banner'); if(b){b.textContent=v;b.classList.remove('on');void b.offsetWidth;b.classList.add('on');}
    const win = v==='YOU WIN';
    let xp = win ? 30 : 12;
    const rk = ['Common','Uncommon','Rare','Epic','Mythic','Legendary'];
    if (rk.indexOf(E.def.rarity) > rk.indexOf(P.def.rarity)) xp += 10;
    if (arenaRun){ arenaAfterFight(win); lastGain = {xp:0, levels:[]}; }
    else {
      if (isRanked){ SAVE.bump('f3'); if (win) SAVE.bump('w2'); }
      lastGain = SAVE.award(P.def.id, win, xp, isRanked);
    }
    await wait(700);
  }
  busy = false;
  document.getElementById('ctrl')?.classList.remove('busy');
  renderControls();
}

/* The full numbers of one pack: totals and per member, wins and losses apart. */
function packStats(p){
  const n = p.members || 0, per = v => n ? (v / n).toFixed(1) : '0.0';
  const fights = p.wins + p.losses, rate = fights ? Math.round(100 * p.wins / fights) + '%' : '—';
  return `<table class="pst">
    <tr><th></th><th>Wins</th><th>Losses</th><th>Fights</th><th>XP</th></tr>
    <tr><td>Pack total</td><td>${p.wins}</td><td>${p.losses}</td><td>${fights}</td><td>${p.xp}</td></tr>
    <tr class="avg"><td>Ø per member</td><td><b>${per(p.wins)}</b></td><td>${per(p.losses)}</td><td>${per(fights)}</td><td>${n ? Math.round(p.xp / n) : 0}</td></tr>
    <tr><td>Win rate</td><td colspan="4">${rate}</td></tr>
  </table>`;
}

/* ============================ daily recap ============================ */
/* Pops up once, the moment the last ranked fight and today's arena are both
   done. It can be reopened from the TODAY panel until midnight UTC. */
function recapHtml(){
  const D = SAVE.data, T = D.today, runs = T.arenas || [];
  const best = Math.max(0, ...runs.map(r => r.won)), arenaXp = runs.reduce((n, r) => n + r.xp, 0);
  const res = w => w === 3 ? '🏆 Champion' : w ? `out after ${w} win${w===1?'':'s'}` : 'out in the quarter-final';
  const missing = Math.max(0, ARENA_RUNS - runs.length);
  const arenaTxt = (runs.map((r, i) => `#${i+1} ${res(r.won)}`).join(' · ') || 'no finished tournament')
    + (missing ? ` · ${missing} not finished (left early or played before today's update)` : '');
  const lv = T.levels.map(l => { const f = findDog(l.id); return `<p class="q">⬆️ <span><b>${esc(f ? f.name : 'A Scrappy')}</b> reached Bond ${l.lvl}</span></p>`; }).join('');
  const qDone = (D.quests||[]).filter(q => q.got).length, qAll = (D.quests||[]).length;
  let pack = '';
  if (D.pack){
    const rows = standings(SAVE.weekOf()).slice().sort((x,y) => y.avgW - x.avgW);
    const i = rows.findIndex(p => p.id === D.pack);
    if (i >= 0) pack = `<p class="q">${rows[i].emoji} <span><b>${esc(rows[i].name)}</b> — #${i+1} of ${rows.length} this week (${rows[i].avgW.toFixed(1)} wins per member)</span></p>`;
  }
  return `<div class="card" role="dialog" aria-label="Daily recap">
    <h2>DAY COMPLETE</h2>
    <p class="mini" style="text-align:center;margin:0">Every ranked fight used and all three tournaments fought. Nice work.</p>
    <div class="grid">
      <div class="stat"><b>${T.wins}–${T.losses}</b><span class="mini">ranked fights W–L</span></div>
      <div class="stat"><b>+${T.xp + T.questXp}</b><span class="mini">XP today${T.questXp ? ' (' + T.questXp + ' from quests)' : ''}</span></div>
      <div class="stat"><b>${runs.filter(r => r.won === 3).length}× 🏆</b><span class="mini">champion · ${runs.length} tournament${runs.length===1?'':'s'} finished · best ${best}/3</span></div>
      <div class="stat"><b>🔥 ${D.streak}</b><span class="mini">streak now · week's best ${D.wk.streak}</span></div>
    </div>
    <p class="q">🏟️ <span><b>Arena:</b> ${arenaTxt} · +${arenaXp} XP</span></p>
    <p class="q">📋 <span><b>Quests:</b> ${qDone} of ${qAll} done</span></p>
    <p class="q">🎓 <span><b>Trainer level ${SAVE.trainerLvl()}</b> · ${SAVE.trainerInto()} / 250 XP</span></p>

    <div class="row" style="margin-top:12px"><button id="recapClose">Close</button></div>
  </div>`;
}
function showRecap(){
  if (document.querySelector('.recap')) return;

/* On the first visit of a new week: how last week ended for the packs
   (final order and the bonuses they earned) and for the players' ladder. */
const lastWeekKey = () => SAVE.weekOf(Date.now() - 7*864e5);
let weekRecapBusy = false;
async function weekLadder(wk){
  if (LIVE() && !WALLET.demo){
    const r = await api('/ladder?week=' + wk); const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'ladder');
    return j;
  }
  // demo: the same simulated rivals the ladder tab shows, plus your real last week
  const r = seeded('ladder' + wk), L = SAVE.data.lastWk || {xp:0, wins:0, streak:0};
  const names = Array.from({length:10}, (_, i) => 'Demo player ' + (i + 1));
  const rows = names.map(n => ({who:n, xp:Math.round(300+r()*2200), wins:Math.round(8+r()*70), streak:2+Math.floor(r()*11)}));
  rows.push({who:'YOU', xp:L.xp, wins:L.wins, streak:L.streak, you:true});
  const board = k => rows.slice().sort((a,b) => b[k]-a[k]);
  const out = {week:wk, players:rows.length, mine:{}};
  for (const k of ['xp','wins','streak']){
    const b = board(k); out[k] = b.slice(0,10).map(x => ({who:x.who, v:x[k], you:!!x.you}));
    const i = b.findIndex(x => x.you); out.mine[k] = L[k] > 0 ? {rank:i+1, v:L[k]} : null;
  }
  return out;
}

    if (tab === 'arena') ensureRivals().then(() => { if (tab === 'arena' && !arenaRun) menu(); }); });
  const rc = document.getElementById('recapOpen'); if (rc) rc.onclick = () => { S.click(); showRecap(); };
  app.querySelectorAll('[data-weekrecap]').forEach(b => b.onclick = () => { S.click(); showWeekRecap(); });
  if (weekRecapDue()) showWeekRecap();            // a new week: last week's results come first
  else if (SAVE.dayComplete() && !SAVE.data.today.shown && !WALLET.loading && !needLogin()) showRecap();
  app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    S.unlock(); S.click();
    const me = findDog(b.dataset.f); if (!me) return;
    arenaRun = null;
    const ranked = SAVE.data.tickets > 0 && SAVE.spend();
    startFight(me, pickOpponent(me.id), ranked);
  });
  app.querySelectorAll('[data-fcdog]').forEach(b => b.onclick = () => {
    S.unlock(); S.click(); SAVE.clubDog(b.dataset.fcdog);
    const st = ROOM && (((ROOM.peers().find(p => p.sameTab)||{}).presence||{}).fcl||{}).st;
    if (st === 'looking') lobbySet({st:'looking', dog:b.dataset.fcdog, lvl:SAVE.dog(b.dataset.fcdog).lvl});
    menu();
  });
  const fe = document.getElementById('fcEnter');
  if (fe) fe.onclick = () => {
    S.unlock(); S.click();
    const d = SAVE.data.club.dog; if (!d) return;
    const st = ROOM && (((ROOM.peers().find(p => p.sameTab)||{}).presence||{}).fcl||{}).st;
    lobbySet(st ? null : {st:'looking', dog:d, lvl:SAVE.dog(d).lvl});
    setTimeout(menu, 60);
  };
  if (tab === 'club') renderLobby();
  if (tab === 'ladder' && LIVE()) fillLadder();
  walletWire();
  app.querySelectorAll('[data-sq]').forEach(b => b.onclick = () => { S.unlock(); S.click(); SAVE.toggleSquad(b.dataset.sq); menu(); });
  const sg = document.getElementById('sign');
  if (sg) sg.onclick = () => { S.unlock(); S.click(); SAVE.signUp(!SAVE.signedToday()); menu(); };
  const ra = document.getElementById('runArena');
  if (ra) ra.onclick = async () => {
    S.unlock(); S.click();
    if (!SAVE.data.arena.squad.length || arenaLocked()) return;
    ra.disabled = true; ra.textContent = 'Finding rivals…';
    await ensureRivals();                                   // real players' Scrappys, ready before the bell
    if (arenaLimited()) SAVE.arenaUse();
    if (SAVE.signedToday()) { startLiveArena(); return; }
    const r = runGhostArena();
    r.won === 3 ? S.win() : (r.won ? S.heal() : S.lose());
    menu();
  };
  app.querySelectorAll('[data-join]').forEach(b => b.onclick = () => { S.click(); packAction('join', b.dataset.join); });
  app.querySelectorAll('[data-leave]').forEach(b => b.onclick = () => { S.click(); packAction('leave'); });
  app.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => { S.click(); packAction('cancel'); });
  const xa = document.getElementById('xaman');
  if (xa) xa.onclick = () => { S.unlock(); S.click();
    alert("Xaman sign-in needs the backend, which isn't part of this prototype.\n\n1. You scan a Xaman QR and sign a one-off payload — no transaction, no fee.\n2. The server checks the signature and reads which Pixel Scrappys that wallet holds on the ledger.\n3. Only those appear in your kennel. Sell one and it leaves, with its bond level attached."); };
  document.getElementById('wipe').onclick = () => {
    if (confirm('Wipe all progress?')){ SAVE.reset(); menu(); }
  };
}
walletBoot();
menu();
</script>
</body>
</html>
