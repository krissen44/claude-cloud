<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bark Arena — Pixel Scrappy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sky1:#96d8f8; --sky2:#d6f0fb; --hill:#9cd28c; --grass:#7cc56c; --grassD:#68b25a;
  --ink:#1b2030; --ink2:#4d5a72; --panel:#fff; --panelB:#cfe0ea; --accent:#3a5c8e;
  --hp:#4fbe62; --hpMid:#f0b93e; --hpLow:#e2574f; --en:#f7ce54; --shadow:rgba(20,35,55,.16);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky1:#1d2c44; --sky2:#31506e; --hill:#2f6b3d; --grass:#3d7a45; --grassD:#2f6337;
  --ink:#eaf1f8; --ink2:#a8bbd0; --panel:#1b2535; --panelB:#31435c; --accent:#8fb8ea;
  --shadow:rgba(0,0,0,.45);}}
:root[data-theme="dark"]{--sky1:#1d2c44;--sky2:#31506e;--hill:#2f6b3d;--grass:#3d7a45;--grassD:#2f6337;
  --ink:#eaf1f8;--ink2:#a8bbd0;--panel:#1b2535;--panelB:#31435c;--accent:#8fb8ea;--shadow:rgba(0,0,0,.45);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--panel);color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:hidden}
img{image-rendering:pixelated;-ms-interpolation-mode:nearest-neighbor}
.wrap{max-width:900px;margin:0 auto;padding:14px 12px 36px}
h1{font-family:'Press Start 2P',monospace;font-size:clamp(12px,3.2vw,18px);text-align:center;margin:4px 0 12px;letter-spacing:1px}
.card{background:var(--panel);border:2px solid var(--panelB);border-radius:10px;box-shadow:0 3px 0 var(--shadow);padding:13px;margin-bottom:12px}

/* ---------- stage ---------- */
.stage{position:relative;height:340px;border:2px solid var(--panelB);border-radius:10px;overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 58%);margin-bottom:12px;box-shadow:0 3px 0 var(--shadow)}
.stage.shake{animation:stageShake .28s}
@keyframes stageShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}45%{transform:translate(5px,-3px)}70%{transform:translate(-3px,-2px)}}
.sun{position:absolute;left:22px;top:18px;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle,#fff6cc 38%,#ffe082 60%,#ffd54a 100%);box-shadow:0 0 22px 6px rgba(255,214,90,.45)}
.hills{position:absolute;left:-5%;right:-5%;bottom:88px;height:70px;
  background:radial-gradient(60px 46px at 18% 100%,var(--hill) 99%,transparent 100%),
             radial-gradient(90px 60px at 52% 100%,var(--hill) 99%,transparent 100%),
             radial-gradient(70px 50px at 84% 100%,var(--hill) 99%,transparent 100%)}
.cloud{position:absolute;height:14px;background:#fff;border-radius:9px;opacity:.9}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:22px;height:22px;left:12px;top:-10px}
.cloud::after{width:15px;height:15px;left:34px;top:-6px}
.c1{width:60px;top:26px;animation:drift 46s linear infinite}
.c2{width:44px;top:58px;animation:drift 66s linear infinite;animation-delay:-20s;opacity:.75}
.c3{width:52px;top:14px;animation:drift 82s linear infinite;animation-delay:-52s;opacity:.65}
@keyframes drift{from{left:-90px}to{left:102%}}
.ground{position:absolute;left:0;right:0;bottom:0;height:92px;
  background:linear-gradient(180deg,var(--grass) 0%,var(--grass) 34%,var(--grassD) 100%)}
.ground::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:rgba(255,255,255,.22)}
.fence{position:absolute;left:0;right:0;bottom:88px;height:22px;opacity:.85;
  background:repeating-linear-gradient(90deg,#efe8d8 0 5px,transparent 5px 26px)}
.fence::before,.fence::after{content:"";position:absolute;left:0;right:0;height:4px;background:#efe8d8}
.fence::before{top:5px}.fence::after{top:13px}
.flower{position:absolute;width:5px;height:5px;border-radius:50%;box-shadow:0 4px 0 -1px rgba(60,130,70,.9)}

.fighter{position:absolute;bottom:56px;width:192px;text-align:center;transition:filter .12s;line-height:0}
/* Every sprite is the full 96x96 frame with the paws on row 88, drawn at exactly 2x:
   same pixel size for every dog, same ground line, whatever it wears on its head. */
.fighter img{width:192px;height:192px;margin-bottom:-14px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.14));animation:idle 2.6s ease-in-out infinite}
.fighter.left{left:3%}
.fighter.right{right:3%}
.fighter.right img{transform:scaleX(-1)}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.fighter.right img{animation:idleR 2.6s ease-in-out infinite}
@keyframes idleR{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-5px)}}

.fighter.lunge.left img{animation:lungeL .42s ease-out}
@keyframes lungeL{0%{transform:translateX(0)}35%{transform:translateX(56px) translateY(-10px) rotate(-7deg)}100%{transform:translateX(0)}}
.fighter.lunge.right img{animation:lungeR .42s ease-out}
@keyframes lungeR{0%{transform:scaleX(-1)}35%{transform:scaleX(-1) translateX(56px) translateY(-10px) rotate(-7deg)}100%{transform:scaleX(-1)}}
.fighter.guard img{animation:guardA .5s ease-out}
@keyframes guardA{0%,100%{transform:var(--flip,none)}40%{transform:var(--flip,none) scale(.9) translateY(6px)}}
.fighter.right.guard img{--flip:scaleX(-1)}
.fighter.taunt img{animation:tauntA .55s ease-in-out}
@keyframes tauntA{0%,100%{transform:var(--flip,none) rotate(0)}25%{transform:var(--flip,none) rotate(-9deg)}60%{transform:var(--flip,none) rotate(9deg)}}
.fighter.right.taunt img{--flip:scaleX(-1)}
.fighter.hurt img{filter:brightness(4) saturate(0) drop-shadow(0 0 6px #fff)}
.fighter.hurt{animation:knock .3s}
@keyframes knock{0%,100%{transform:translateX(0)}30%{transform:translateX(-11px)}65%{transform:translateX(7px)}}
.fighter.faint img{filter:grayscale(1) brightness(.72);transform:rotate(-14deg) translateY(12px);animation:none;transition:all .6s}
.fighter.right.faint img{transform:scaleX(-1) rotate(14deg) translateY(12px)}
.fighter.cheer img{animation:cheer .6s ease-in-out infinite}
@keyframes cheer{0%,100%{transform:var(--flip,none) translateY(0)}50%{transform:var(--flip,none) translateY(-16px)}}
.fighter.right.cheer img{--flip:scaleX(-1)}
.shield{position:absolute;inset:auto 0 70px;height:150px;pointer-events:none;
  display:flex;align-items:center;justify-content:center;font-size:40px;opacity:0}
.shield.on{animation:pop .5s}
@keyframes pop{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1)}}

canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.float{position:absolute;font-family:'Press Start 2P',monospace;font-size:15px;pointer-events:none;
  text-shadow:2px 2px 0 rgba(0,0,0,.45);animation:rise 1.05s ease-out forwards;white-space:nowrap}
@keyframes rise{0%{opacity:0;transform:translateY(6px) scale(.7)}18%{opacity:1;transform:translateY(-6px) scale(1.15)}100%{opacity:0;transform:translateY(-52px) scale(1)}}
.dmgN{color:#ff5a4d}.healN{color:#54d06a}.missN{color:#e8eef6}.enN{color:#ffd95e}
.banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:'Press Start 2P',monospace;
  font-size:clamp(11px,2.8vw,16px);color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,.5);pointer-events:none;opacity:0}
.snd{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:9px;cursor:pointer;
  border:2px solid rgba(0,0,0,.25);background:rgba(255,255,255,.65);font-size:15px;line-height:1;padding:0}
.snd:hover{background:rgba(255,255,255,.9)}
.banner.on{animation:bann 1.1s ease-out}
@keyframes bann{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.1)}}

/* ---------- hud ---------- */
.hud{position:absolute;top:8px;width:42%;padding:0 8px}
.hud.l{left:8px}.hud.r{right:8px}
.nm{font-size:9.5px;line-height:1.35;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.5);
  display:flex;justify-content:space-between;gap:6px;margin-bottom:3px}
.hud.r .nm{flex-direction:row-reverse}
.rar{font-weight:700;letter-spacing:.5px;opacity:.85}
.bar{position:relative;height:13px;border:2px solid rgba(0,0,0,.35);border-radius:7px;background:rgba(0,0,0,.3);overflow:hidden}
.bar u{position:absolute;inset:0;background:#ff9a8f;width:100%;transition:width .7s .18s ease-out}
.bar i{position:absolute;inset:0;background:var(--hp);width:100%;transition:width .3s ease-out}
.bar.mid i{background:var(--hpMid)}.bar.low i{background:var(--hpLow)}
.pips{font-size:11px;letter-spacing:1px;color:var(--en);text-shadow:1px 1px 0 rgba(0,0,0,.5);margin-top:2px}
.hud.r .pips{text-align:right}

/* ---------- controls ---------- */
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts.abil{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:8px}
button.act{font:inherit;padding:11px 9px;border-radius:9px;border:2px solid var(--panelB);background:var(--panel);
  color:var(--ink);cursor:pointer;text-align:left;transition:transform .08s,border-color .12s}
button.act b{display:block;font-size:12px;margin-bottom:3px}
button.act small{color:var(--ink2);font-size:10px;line-height:1.4;display:block}
button.act:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
button.act:active:not(:disabled){transform:translateY(1px)}
button.act:disabled{opacity:.4;cursor:not-allowed}
.busy{opacity:.45;pointer-events:none}
.log{max-height:150px;overflow-y:auto;font-size:11.5px;line-height:1.65;color:var(--ink2)}
.log b{color:var(--ink)}
.log .turn{color:var(--accent);font-weight:700;display:block;margin-top:6px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.pick button{background:transparent;border:2px solid var(--panelB);border-radius:9px;padding:9px 4px;cursor:pointer;
  color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .1s,border-color .12s}
.pick button:hover{border-color:var(--accent);transform:translateY(-3px)}
.pick img{height:96px;width:96px}
.pick span{font-size:9.5px;line-height:1.35;text-align:center;color:var(--ink2)}
.tag{display:inline-block;font-size:9px;border:1px solid var(--panelB);border-radius:4px;padding:1px 5px;margin:3px 3px 0 0;color:var(--ink2)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.row button{font:inherit;font-size:12px;padding:11px 18px;border-radius:9px;border:2px solid var(--panelB);
  background:var(--panel);color:var(--ink);cursor:pointer}
.row button:hover{border-color:var(--accent)}
.mini{font-size:10.5px;color:var(--ink2);line-height:1.65}
.lvl{display:inline-block;font-family:'Press Start 2P',monospace;font-size:8px;padding:3px 5px;border-radius:5px;
  background:var(--accent);color:#fff;letter-spacing:.5px}
.xp{height:7px;border:1px solid var(--panelB);border-radius:5px;background:var(--panel);overflow:hidden;margin:5px 0 3px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#6fc3ff,#4f8ce0);transition:width .8s ease-out}
.pnl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pnl>div{border:2px solid var(--panelB);border-radius:9px;padding:10px}
.pnl h3{font-family:'Press Start 2P',monospace;font-size:9px;margin:0 0 8px;letter-spacing:.5px;color:var(--ink2)}
.q{font-size:10.5px;line-height:1.5;margin:0 0 6px;color:var(--ink2);display:flex;gap:6px;align-items:flex-start}
.q.done{color:var(--ink);opacity:.6;text-decoration:line-through}
.q b{color:var(--accent)}
.res{text-align:center}
.res .big{font-family:'Press Start 2P',monospace;font-size:15px;margin:2px 0 10px}
.up{font-family:'Press Start 2P',monospace;font-size:10px;color:#f0a81e;margin:8px 0 2px;animation:pop2 .6s}
@keyframes pop2{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.note{border:2px dashed var(--panelB);border-radius:9px;padding:10px;font-size:10.5px;color:var(--ink2);line-height:1.65}
.wal{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.wal button{font:inherit;font-size:11px;padding:9px 14px;border-radius:8px;border:2px solid var(--panelB);
  background:var(--panel);color:var(--ink);cursor:pointer}
.streak{font-size:10.5px;color:var(--ink2)}
.xam{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.xam img{border-radius:10px;border:2px solid var(--panelB);background:#fff;image-rendering:auto}
a.btn{font:inherit;font-size:11px;padding:9px 14px;border-radius:8px;border:2px solid var(--accent);color:var(--accent);text-decoration:none;font-weight:700}
.soon{position:relative;border-radius:14px;overflow:hidden;min-height:430px;display:flex;align-items:center;justify-content:center;
  margin-bottom:12px;border:2px solid var(--panelB);box-shadow:0 3px 0 var(--shadow)}
.soon-bg{position:absolute;inset:0;background:
  repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 14px,transparent 14px 28px),
  radial-gradient(circle at 50% 38%,#4a2a6e 0%,#1d1230 55%,#0e0918 100%)}
.soon-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(255,200,80,.18),transparent 55%);
  animation:soonPulse 3.2s ease-in-out infinite}
@keyframes soonPulse{0%,100%{opacity:.5}50%{opacity:1}}
.soon-in{position:relative;text-align:center;color:#fff;padding:34px 20px}
.soon-tag{font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:2px;color:#ffd95e;margin-bottom:18px}
.soon-big{font-family:'Press Start 2P',monospace;font-size:clamp(30px,8vw,58px);line-height:1.15;letter-spacing:3px;
  text-shadow:4px 4px 0 #e2574f,8px 8px 0 rgba(0,0,0,.45);animation:soonBob 2.4s ease-in-out infinite}
@keyframes soonBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.soon-in p{font-size:12px;line-height:1.75;color:#d9cdef;margin:22px auto 18px;max-width:440px}
.soon-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.soon-row span{font-size:10.5px;padding:6px 10px;border-radius:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#efe7ff}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;font:inherit;font-size:11px;padding:9px 6px;border-radius:7px;border:2px solid transparent;
  background:transparent;color:var(--ink2);cursor:pointer}
.tabs button.on{border-color:var(--panelB);background:var(--panel);color:var(--ink);font-weight:700}
.tix{margin-top:9px;padding:8px;border-radius:8px;border:1px solid var(--panelB);font-size:11px}
.bon{margin-top:8px;padding:8px;border-radius:8px;border:1px solid var(--accent);font-size:11px}
.pnl3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pnl3>div{border:2px solid var(--panelB);border-radius:9px;padding:10px}
.pnl3 h3{font-family:'Press Start 2P',monospace;font-size:8px;margin:0 0 8px;color:var(--ink2)}
.lb{display:flex;gap:7px;align-items:baseline;font-size:10.5px;margin:0 0 5px;color:var(--ink2)}
.lb span:nth-child(1){width:15px;opacity:.6}
.lb span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb b{color:var(--ink)}
.lb.you{color:var(--accent);font-weight:700}.lb.you b{color:var(--accent)}
.pkg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pk{border:2px solid var(--panelB);border-radius:9px;padding:10px}
.pk.mine{border-color:var(--accent)}
.pk.pend{border-style:dashed;border-color:var(--accent)}
.pick button.insq{border-color:var(--accent);background:rgba(58,92,142,.08)}
.wal button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.wal button:disabled,.row button:disabled{opacity:.45;cursor:not-allowed}
.h3{font-family:'Press Start 2P',monospace;font-size:9px;margin:0 0 9px;color:var(--ink2);letter-spacing:.5px}
.tabs button{font-size:10.5px;padding:9px 3px}
.pkh{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;margin-bottom:5px}
.bdg{font-size:9px;border:1px solid var(--accent);color:var(--accent);border-radius:5px;padding:2px 5px;white-space:nowrap}
button.sm{font:inherit;font-size:10px;padding:6px 10px;margin-top:7px;border-radius:6px;
  border:1px solid var(--panelB);background:transparent;color:var(--ink2);cursor:pointer}
button.sm:hover{border-color:var(--accent);color:var(--ink)}
@media(max-width:600px){.pnl3,.pkg{grid-template-columns:1fr}}
@media(max-width:560px){.pnl{grid-template-columns:1fr}}
@media(max-width:560px){.stage{height:270px}.fighter{width:144px}.fighter img{width:144px;height:144px;margin-bottom:-10px}
  .fighter.left{left:0}.fighter.right{right:0}.acts{grid-template-columns:1fr}.hud{width:46%}}
.pst{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0 4px}
.pst th,.pst td{padding:3px 4px;text-align:right;border-bottom:1px solid var(--panelB)}
.pst th:first-child,.pst td:first-child{text-align:left;color:var(--ink2)}
.pst th{font-weight:600;color:var(--ink2)}
.pst tr.avg td{color:var(--accent)}
.recap{position:fixed;inset:0;z-index:50;background:rgba(10,16,28,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.recap .card{max-width:440px;width:100%;max-height:calc(100vh - 32px);overflow:auto;margin:0}
.recap h2{font-family:'Press Start 2P',monospace;font-size:12px;margin:2px 0 4px;color:var(--accent);text-align:center}
.recap .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.recap .stat{border:2px solid var(--panelB);border-radius:8px;padding:8px;text-align:center}
.recap .stat b{display:block;font-size:18px}
.recap h3{font-family:'Press Start 2P',monospace;font-size:9px;margin:14px 0 8px;color:var(--ink2)}
.recap .pr{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:start;padding:7px 8px;border:2px solid var(--panelB);border-radius:8px;margin-bottom:6px}
.recap .pr.mine{border-color:var(--accent)}
.recap .pr .n{font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>BARK ARENA</h1>
  <div id="app"></div>
</div>
<script>

/* A piece carries eight traits, one per layer. If all eight fired, a fight would
   be a spreadsheet. Only the three rarest become the kit, and at most one of
   those may be an active ability — so rarity of the individual traits decides
   how a piece plays, not just its rarity tier. */
const KIT_SLOTS = 3, KIT_ACTIVES = 1;
function kitFrom(ids){
  const all = ids.map(i => T[i]).filter(Boolean)
                 .sort((a,b) => (a.pieces||9999) - (b.pieces||9999));
  const kit = [];
  let actives = 0;
  for (const t of all){
    if (kit.length >= KIT_SLOTS) break;
    if (t.kind === 'active'){
      if (actives >= KIT_ACTIVES) continue;     // rarer active already took the slot
      actives++;
    }
    kit.push(t);
  }
  return kit;
}
const perksAt = l => Object.entries(BOND.perks).filter(([k]) => +k <= l).map(([,v]) => v);
const hasPerk = (l, id) => perksAt(l).some(p => p.id === id);

    const t = new Date(d || Date.now());

    spend(){ if ((d.tickets||0) <= 0) return false; d.tickets--; save(); return true; },
    // First pack is immediate; after that a move is queued to the next Monday,
    // so nobody hops into whichever pack is about to collect a bonus.
    today,
    toggleSquad(id){
      const q = d.arena.squad, i = q.indexOf(id);
      if (i >= 0) q.splice(i,1); else if (q.length < 3) q.push(id);
      save();
    },
    signUp(on){ d.arena.signed = on ? today() : ''; save(); },
    signedToday(){ return d.arena.signed === today(); },
    // one arena per UTC day; it counts as used the moment it starts, so quitting mid-bracket can't reroll it
    // tournaments started today; one counts the moment it starts, so quitting mid-bracket can't reroll it
    arenaRunsToday(){ return d.arena.day === today() ? (d.arena.dayRuns ?? 1) : 0; },   // ?? 1: used under the old one-a-day rule
    arenaUse(){ const n = this.arenaRunsToday(); d.arena.day = today(); d.arena.dayRuns = n + 1; save(); },
    clubResult(r){ d.club[r] = (d.club[r]||0) + 1; save(); },
    clubDog(id){ d.club.dog = id; save(); },
    arenaDone(r){ d.arena.runs++; d.arena.best = Math.max(d.arena.best, r.won); d.arena.last = r;
      // each arena fight won counts once for the wins board; only fights you fought yourself touch the streak
      d.wk.wins += r.won; d.wk.losses = (d.wk.losses||0) + r.lines.filter(l => !l.w).length;
      if (r.live) r.lines.forEach(l => streakAfter(l.w));
      if (typeof postStats === 'function') postStats(d.wk);
      if (d.today) (d.today.arenas = d.today.arenas || []).push({won:r.won, xp:r.xp, live:r.live});
      save(); },
    // the day is done: every ranked fight used and today's arena fought
    // done for the day: no tickets left and all three tournaments used — counted when they start,
    // so one left mid-bracket (or played before this rule) still counts
    arenaDoneToday(){ return Math.max(this.arenaRunsToday(), (d.today && d.today.arenas || []).length); },
    dayComplete(){ return !!d.today && (d.tickets||0) <= 0 && this.arenaDoneToday() >= ARENA_RUNS && !(typeof arenaRun !== 'undefined' && arenaRun && !arenaRun.done); },
    recapShown(){ if (d.today){ d.today.shown = true; save(); } },
    weekRecapSeen(wk){ d.recapWeek = wk; save(); },
    // one pack a week: joining with no pack is instant and locks the week; after that
    // a switch or leaving is only queued for Monday ('-' = leave on Monday)
    packLocked(){ return !!d.pack || d.packLock === weekOf(); },
    joinPack(id){
      if (!this.packLocked()){ d.pack = id; d.pending = null; d.packLock = weekOf(); }
      else d.pending = d.pack === id ? null : id;
      save();
    },
    cancelMove(){ d.pending = null; save(); },
    leavePack(){ if (d.pack) d.pending = '-'; save(); },
    setPack(pack, pending, locked){ d.pack = pack || null; d.pending = pending || null; if (locked) d.packLock = weekOf(); save(); },
    trainerLvl(){ return 1 + Math.floor(d.trainerXp / 250); },
    trainerInto(){ return d.trainerXp % 250; },
    bump(qid, n){
      let paid = 0;
      (d.quests||[]).forEach(q => {
        if (q.id !== qid || q.got) return;
        q.n = Math.min(q.goal, q.n + (n||1));
        if (q.n >= q.goal){ q.got = true; d.trainerXp += q.xp; paid += q.xp; }
      });
      if (paid && d.today) d.today.questXp += paid;
      if (paid) save();
      return paid;
    },
    award(id, win, xp, ranked, fromArena){
      const g = dog(id), out = {xp, levels:[], before:g.lvl};
      const T = d.today;
      if (T && ranked){
        T.xp += xp;
        if (!fromArena){ T.ranked++; win ? T.wins++ : T.losses++; }
      }
      if (!ranked) { out.xp = 0; return out; }            // casual: no XP, and the streak is left alone
      g.xp += xp; d.trainerXp += Math.round(xp/2); d.wk.xp += xp;
      // Arena XP is shared across the squad; its wins and streak are booked per fight in arenaDone.
      if (!fromArena){ d.fights++; win ? d.wk.wins++ : (d.wk.losses = (d.wk.losses||0) + 1); win ? g.w++ : g.l++; }
      while (g.lvl < BOND.maxLevel && g.xp >= BOND.need(g.lvl)){
        g.xp -= BOND.need(g.lvl); g.lvl++;
        out.levels.push(g.lvl);
        if (T) T.levels.push({id, lvl:g.lvl});
      }
      if (!fromArena) streakAfter(win);
      save();
      if (typeof postStats === 'function') postStats(d.wk);
      return out;
    },
    reset(){ d = fresh(); rollQuests(); d.day = today(); save(); }
  };
})();


/* ============================ packs & ladder ============================ */
const PACKS = [
  {id:'ledger', name:'Ledger Hounds', emoji:'⛓️'},
  {id:'moon',   name:'Moon Diggers',  emoji:'🌙'},
  {id:'bone',   name:'Bone Collectors',emoji:'🦴'},
  {id:'static', name:'Static Pack',   emoji:'⚡'}
];
const PACK_MAX = 10;
const BONUS = {
  fang:  {name:'Fang',   emoji:'🦷', txt:'+1 bite damage',            board:'wins'},
  hide:  {name:'Hide',   emoji:'🛡️', txt:'bites against you hit 1 softer', board:'xp'},
  spirit:{name:'Spirit', emoji:'✨', txt:'+1 starting energy',        board:'streak'}
};

/* Deterministic demo rivals — the same all week, different next week.
   In the live version these rows come from the Worker, not from here. */
function seeded(str){ let h=2166136261; for(const c of str) h=Math.imul(h^c.charCodeAt(0),16777619); 
  return () => (h = Math.imul(h ^ (h>>>15), 2246822507) ^ Math.imul(h ^ (h>>>13), 3266489909), ((h>>>0)%1000)/1000); }

/* Signed in, the standings are real: the server sums every member's week.
   PACKDATA holds this week and the eight before it (the bonus history). */
let PACKDATA = null;
const packsLive = () => LIVE() && !!WALLET.token && !WALLET.demo;
function standings(weekKey){
  if (packsLive()){
    const src = (PACKDATA && PACKDATA.weeks[weekKey]) || [];
    const you = SAVE.data.pack;
    return PACKS.map(p => {
      const r = src.find(x => x.id === p.id) || {members:0, wins:0, losses:0, xp:0, streak:0};
      const n = r.members || 0;
      return {...p, members:n, wins:r.wins, losses:r.losses || 0, xp:r.xp, streak:r.streak, you: p.id === you,
              avgW: n ? r.wins/n : 0, avgX: n ? r.xp/n : 0};
    });
  }
  const r = seeded('bark'+weekKey);
  const rows = PACKS.map(p => {
    const members = 4 + Math.floor(r()*6);
    return {...p, members,
      wins:   Math.round(40 + r()*70),
      xp:     Math.round(1400 + r()*2600),
      streak: 3 + Math.floor(r()*9)};
  });
  const you = SAVE.data.pack;
  if (you){                                     // fold the player into their pack
    const w = SAVE.data.lastWk || {wins:0,xp:0,streak:0};
    const p = rows.find(x => x.id === you);
    if (p){ p.members = Math.min(PACK_MAX, p.members+1); p.wins += w.wins; p.xp += w.xp; p.streak = Math.max(p.streak, w.streak); p.you = true; }
  }
  rows.forEach(p => { p.avgW = p.wins/p.members; p.avgX = p.xp/p.members; if (p.losses == null) p.losses = Math.round(p.wins * .8); });
  return rows;
}

/* One bonus per pack: a pack topping two boards keeps the first and the
   runner-up inherits the second. Without this the leader snowballs.

   On top of that, holding a bonus gets harder every week: defending needs a
   margin over the runner-up (10%, then 20%), and after three weeks straight
   the holder is barred from that board entirely. A pack can dominate for two
   or three weeks if it is genuinely ahead — never forever. */
const DEFEND = [0, 0.10, 0.20];      // margin needed at hold 1, 2; index 3+ = barred
const MAX_HOLD = 3;
let _awCache = {};

function awardsAt(weekKey, back){
  if (_awCache[weekKey]) return _awCache[weekKey];
  back = back == null ? 8 : back;
  const prevKey = new Date(Date.parse(weekKey) - 7*864e5).toISOString().slice(0,10);
  const prev = back > 0 ? awardsAt(prevKey, back - 1) : {win:{}, hold:{}};

  const rows = standings(weekKey), taken = {}, win = {}, hold = {};
  const boards = [
    ['fang',   p => p.avgW],
    ['hide',   p => p.avgX],
    ['spirit', p => p.streak]
  ];
  for (const [key, val] of boards){
    const inc = prev.win[key], held = inc ? (prev.hold[key] || 1) : 0;
    let pool = rows.filter(p => !taken[p.id]);
    if (inc && held >= MAX_HOLD) pool = pool.filter(p => p.id !== inc);   // barred after 3
    pool = pool.sort((a,b) => val(b) - val(a));
    let w = pool[0];
    if (w && inc && w.id === inc && held >= 1 && held < MAX_HOLD){
      const need = DEFEND[Math.min(held, DEFEND.length - 1)];
      const second = pool[1];
      if (second && val(w) < val(second) * (1 + need)) w = second;        // not clear enough
    }
    if (w && !(val(w) > 0)) w = null;                   // an empty board crowns nobody
    if (w){ taken[w.id] = true; win[key] = w.id; hold[key] = (inc === w.id) ? held + 1 : 1; }
  }
  const out = {win, hold};
  _awCache[weekKey] = out;
  return out;
}
const awards = wk => awardsAt(wk).win;
const holdOf = (wk, key) => awardsAt(wk).hold[key] || 0;

async function loadPacks(){
  if (!packsLive()) return;
  try {
    const r = await api('/packs'); const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'packs');
    applyPacks(j);
  } catch(e){ console.warn('packs', e); }
}
let packMigrated = false;
function applyPacks(j){
  PACKDATA = j; _awCache = {};
  // A pack joined before packs went live exists only in this browser: hand it to the server once.
  if (j.me && !j.me.pack && !j.me.pending && SAVE.data.pack && !packMigrated){

  }
  if (j.me) SAVE.setPack(j.me.pack, j.me.pending, j.me.locked);     // the server's word on membership
  if (tab === 'packs') menu();
}
async function packAction(action, id){
  if (!packsLive()){
    action === 'join' ? SAVE.joinPack(id) : action === 'leave' ? SAVE.leavePack() : SAVE.cancelMove();
    menu(); return;
  }

    if (!r.ok) throw new Error(j.error === 'pack_full' ? 'That pack is full.' : (j.error || 'pack'));
    applyPacks(j);
  } catch(e){ alert(e.message); }
  menu();
}

function myBonus(){
  const me = SAVE.data.pack; if (!me) return null;
  const lastWeek = SAVE.weekOf(Date.now() - 7*864e5);
  const a = awards(lastWeek);
  const key = Object.keys(a).find(k => a[k] === me);
  return key ? {key, ...BONUS[key]} : null;
}

/* ============================ engine ============================ */
const LEG  = DATA.legendaries || {};
const SETS = DATA.sets || {};

/* The kit a piece fights with: a legendary's hand-built signature kit, or the
   three rarest of a generative piece's traits. */
function kitOf(def){
  if (def.legendary && LEG[def.legendary]) return LEG[def.legendary].kit.map(t => ({...t}));
  return kitFrom(def.traits || []);
}
/* Theme sets add a fourth slot on top of the kit. */
function setBonus(def){
  const s = def.set && SETS[def.set]; if (!s) return null;
  const tier = def.setMatch >= 8 && s['8'] ? '8' : (def.setMatch >= 4 && s['4'] ? '4' : (def.setMatch >= 3 && s['3'] ? '3' : null));
  if (!tier) return null;
  return { name: def.set, tier, text: s.text[tier],
           passives: s[tier].map(p => ({...p, kind:'passive', id:'set-'+p.effect, value:'Set: '+def.set})) };
}

function build(def, lvl, bonus){
  lvl = lvl || 1;
  let hp = C.base_hp + (C.rarity_hp_bonus[def.rarity]||0);
  if (hasPerk(lvl,'hp2')) hp += 2;
  if (hasPerk(lvl,'hp2b')) hp += 2;
  let en = C.start_energy;
  if (hasPerk(lvl,'energy')) en += 1;
  const cheap = hasPerk(lvl,'cheap');
  const ts = kitOf(def).map(t => cheap && t.kind==='active' ? {...t, cost: Math.max(1, t.cost-1)} : t);
  const sb = setBonus(def);
  const passives = ts.filter(t => t.kind==='passive').concat(sb ? sb.passives : []);
  for (const t of passives){
    if (t.effect === 'vitality')     hp += t.amount;
    if (t.effect === 'start_energy') en += t.amount;
  }
  if (bonus && bonus.key === 'spirit') en += 1;
  return {def, lvl, hp, maxHp:hp, energy:en, set: sb,
          fang: !!(bonus && bonus.key==='fang'), hide: !!(bonus && bonus.key==='hide'),
          actives: ts.filter(t => t.kind==='active'), passives,
          wind: hasPerk(lvl,'wind'), phoenix: passives.some(p => p.effect==='phoenix'),
          hexed:false, hexTurns:0, counter:false, shield:0, hold:false,
          run:0, extra:0, boon:0, seen:{bite:0, guard:0, taunt:0}, hist:[], idle:0};
}
const has = (f,e) => f.passives.find(p => p.effect === e);
const amt = (f,e) => f.passives.reduce((n,p) => n + (p.effect===e ? (p.amount||0) : 0), 0);
// two 10% dodges are 19%, not 20% — combine, don't add
const chc = (f,e) => 1 - f.passives.reduce((n,p) => n * (p.effect===e ? 1-(p.chance||0) : 1), 1);
const immuneHex   = f => !!(has(f,'pure'));
const immuneDrain = f => !!(has(f,'pure') || has(f,'unbreakable'));
const sideOf = f => f === P ? 'l' : 'r';
const frenzy = () => Math.max(0, turn - (C.frenzy_from || 99) + 1);
function say(h){ log.push(h); }
function push(o){ ev.push(o); }

/* Every point of damage in the game goes through here, so shields, dodges,
   absorb, phoenix and second wind all behave the same whatever caused the hit. */
function damage(f, n, txt, kind, opt){
  opt = opt || {};
  if (f.hold){ say(`${txt} <b>${n}</b> — he doesn't move. <b>Held.</b>`); push({t:'float',who:sideOf(f),cls:'missN',txt:'HELD'}); return 0; }
  if (!opt.sure){
    const dg = chc(f,'dodge');
    if (dg > 0 && Math.random() < dg){ say(`${txt} <b>${n}</b> — <b>dodged</b>.`); push({t:'float',who:sideOf(f),cls:'missN',txt:'DODGE'}); return 0; }
  }
  if (f.shield > 0){
    const soak = Math.min(f.shield, n); f.shield -= soak; n -= soak;
    push({t:'float',who:sideOf(f),cls:'missN',txt:'-'+soak+' SHIELD'});
    if (n <= 0){ say(`${txt} — the shield takes all of it.`); return 0; }
  }
  if (has(f,'absorb') && Math.random() < .20){
    f.hp = Math.min(f.maxHp, f.hp + n);
    say(`${txt} <b>${n}</b> — the void <b>swallows it</b> and he heals.`);
    push({t:'float',who:sideOf(f),cls:'healN',txt:'+'+n}); return 0;
  }
  f.hp = Math.max(0, f.hp - n);
  say(`${txt} <b>${n}</b>.`);
  push({t:'hit',who:sideOf(f),n,kind:kind||'', hp:{l:P.hp,r:E.hp}});
  if (f.hp <= 0 && f.phoenix){
    f.phoenix = false; f.hp = 1; f.extra += 2;
    say(`&nbsp;&nbsp;↳ <b>Phoenix</b> — burned down, back at 1, and hotter.`);
    push({t:'float',who:sideOf(f),cls:'healN',txt:'PHOENIX'});
  }
  if (f.wind && f.hp > 0 && f.hp < f.maxHp*0.25){
    f.wind = false; f.hp = Math.min(f.maxHp, f.hp + 3);
    say(`&nbsp;&nbsp;↳ <b>Second Wind</b> — back up, +3.`);
    push({t:'float',who:sideOf(f),cls:'healN',txt:'SECOND WIND'});
  }
  return n;
}
function heal(f,n,txt){ if(n<=0)return; f.hp=Math.min(f.maxHp,f.hp+n); say(txt); push({t:'float',who:sideOf(f),cls:'healN',txt:'+'+n,hp:{l:P.hp,r:E.hp}}); }
function steal(f, g, n, who){
  if (immuneDrain(g)){ say(`${who} reaches for energy — it won't budge.`); return 0; }
  n = Math.min(n, g.energy); g.energy -= n; f.energy = Math.min(9, f.energy + n);
  if (n) push({t:'float',who:sideOf(f),cls:'enN',txt:'+'+n+'◆'});
  return n;
}

/* One bite, start to finish. Used by the Bite move and by Double Team. */
function bite(f, g, ga, who, base){
  if (Math.random() < C.bite.miss_chance){ say(`${who} bites — and <b>misses</b>.`); push({t:'float',who:sideOf(g),cls:'missN',txt:'MISS'}); f.run = 0; return; }
  if (g.counter){ damage(f,6,`${who} bites into the counter and takes`,'counter'); g.counter=false; f.run=0; return; }
  if (has(g,'reflect') && Math.random() < chc(g,'reflect')){ damage(f, amt(g,'reflect'), `${who} bites — <b>caught</b>, and takes`, 'counter'); f.run=0; return; }
  if (ga.type==='guard' && !g.hexFail){
    // guard beats bite: the bite is blocked AND the guard snaps back, as a taunt chips through a guard
    say(`${who} bites — <b>blocked</b>.`); push({t:'float',who:sideOf(g),cls:'missN',txt:'BLOCK'}); f.run=0;
    damage(f, C.guard.snap_vs_bite ?? 2, `&nbsp;&nbsp;↳ the guard snaps back for`, 'counter');
    return;
  }

  let dmg = base != null ? base : rint(C.bite.min, C.bite.max);
  if (ga.type==='taunt') dmg += C.bite.bonus_vs_taunt;
  for (const p of f.passives)
    if (p.effect==='underdog' && f.hp < f.maxHp*(p.threshold||.5)) dmg += p.amount;
  dmg += amt(f,'power') + f.extra + frenzy();
  if (has(f,'rage'))     dmg += Math.floor((f.maxHp - f.hp) / 5);
  if (has(f,'momentum')) dmg += f.run;
  if (f.boon){ dmg += f.boon; f.boon = 0; }
  let crit = false;
  const cc = chc(f,'crit');
  if (cc > 0 && !has(g,'unbreakable') && Math.random() < cc){ dmg *= 2; crit = true; }
  if (f.fang) dmg += 1;
  if (g.hide) dmg -= 1;
  dmg = Math.max(1, dmg - amt(g,'armor'));

  const hits = has(f,'twin') ? [Math.max(1, Math.round(dmg*.55)), Math.max(1, Math.round(dmg*.55))] : [dmg];
  let landed = 0;
  hits.forEach((h,i) => {
    const t = hits.length > 1 ? `${who}${i ? ' — and the other one —' : ''} bites${crit?' — <b>CRIT</b>':''} for`
                              : `${who} bites${crit?' — <b>CRIT</b>':''} for`;
    landed += damage(g, h, t, crit ? 'big' : 'bite');
  });
  if (crit) push({t:'float',who:sideOf(g),cls:'dmgN',txt:'CRIT!'});
  if (!landed){ f.run = 0; return; }
  f.run++;
  if (f===P && landed>=8 && !simulating && !clubMode) SAVE.bump('big');
  const th = amt(g,'thorns');
  if (th && f.hp>0) damage(f, th, `&nbsp;&nbsp;↳ the spikes bite back for`, 'counter');
  const ls = amt(f,'lifesteal');
  if (ls && f.hp>0) heal(f, ls, `&nbsp;&nbsp;↳ drinks it in — heals ${ls}.`);
  if (has(f,'plunder') && g.energy > 0 && !immuneDrain(g)){ steal(f, g, 1, who); say(`&nbsp;&nbsp;↳ plunders 1 energy.`); }
}

/* Ability damage lands through here so Refract can bounce any of it. */
function blast(f, g, n, who, ab, opt){
  if (has(g,'refract') && Math.random() < .35){
    say(`${who} uses <b>${esc(ab.value)}</b> — <b>refracted</b> straight back!`);
    push({t:'float',who:sideOf(g),cls:'missN',txt:'REFRACT'});
    return damage(f, n, `&nbsp;&nbsp;↳ it hits its own caster for`, 'big', opt);
  }
  return damage(g, n + frenzy(), `${who} uses <b>${esc(ab.value)}</b> for`, 'big', opt);
}

/* The opponent. Reads your habits: not just which move you lean on, but
   which move tends to follow your last one or two — so a fixed rhythm
   (bite, guard, bite, guard…) gets read and countered. It only ever looks
   at moves already played, never at the one you're choosing now. */
function predictFoe(f){
  const h = f.hist || [], score = {bite:0, guard:0, taunt:0};
  if (h.length < 2) return null;
  const ctxMatch = k => {                      // what followed the same last-k moves before?
    if (h.length <= k) return;
    const ctx = h.slice(-k).join();
    for (let i = k; i < h.length; i++)
      if (h[i] in score && h.slice(i-k, i).join() === ctx) score[h[i]] += (k === 2 ? 3 : 2) * (1 + i / h.length);
  };
  ctxMatch(2); ctxMatch(1);
  for (const m of h) if (m in score) score[m] += .5;   // plain habit, weakly
  const tot = score.bite + score.guard + score.taunt; if (!tot) return null;
  const move = Object.keys(score).sort((a,b) => score[b] - score[a])[0];
  return {move, conf: score[move] / tot};
}
const COUNTER = {bite:'guard', guard:'taunt', taunt:'bite'};
let hist = {bite:0, guard:0, taunt:0}, plannedE = null, insightShown = false;
function ai(f, foe, seen){
  if (seen && has(f,'insight') && Math.random() < .30 && seen.type in COUNTER) return {type: COUNTER[seen.type]};
  // a readable pattern gets countered — the clearer the pattern, the more often
  const pr = predictFoe(f);
  if (pr && pr.conf > .45 && Math.random() < Math.min(.8, pr.conf)) return {type: COUNTER[pr.move]};
  const aff = f.actives.filter(a => a.cost <= f.energy);
  if (aff.length && Math.random() < .35) return {type:'ability', a:aff[rint(0,aff.length-1)]};
  // Two turns without landing anything and it stops being patient.
  if (f.idle >= 2 && Math.random() < .6) return {type:'bite'};
  // Otherwise a mix. Smelling blood it leans on bite, but never so hard that guarding is a sure thing.
  const r = Math.random(), biteP = foe.hp < 8 ? .6 : .45;
  if (r < biteP) return {type:'bite'};
  return {type: r < biteP + (1 - biteP) * .6 ? 'guard' : 'taunt'};
}

function resolve(pa, ea){
  ev = [];
  if (pa.type in E.seen) E.seen[pa.type]++;
  if (ea.type in P.seen) P.seen[ea.type]++;
  E.hist.push(pa.type); P.hist.push(ea.type);        // the order of moves, for reading patterns
  const hp0 = {P: P.hp, E: E.hp};
  const acts = [[P,E,pa,LBL.P],[E,P,ea,LBL.E]];
  say(`<span class="turn">— Turn ${turn}${frenzy() ? ' · FRENZY +'+frenzy() : ''} —</span>`);
  push({t:'banner',txt: frenzy() ? 'FRENZY +'+frenzy() : 'ROUND '+turn});

  for (const [f,g] of acts){
    f.hexFail = false; f.hold = false;
    if (immuneHex(f)){ f.hexed = false; f.hexTurns = 0; continue; }
    if (f.hexTurns > 0){ f.hexFail = true; f.hexTurns--; continue; }
    if (f.hexed){ f.hexFail = Math.random() < .65; f.hexed = false; }
    const hx = chc(g,'hexaura');
    if (!f.hexFail && hx > 0 && Math.random() < hx) f.hexFail = true;
  }

  push({t:'moves', l:pa.type==='ability'?'ability':pa.type, r:ea.type==='ability'?'ability':ea.type});

  // defensive abilities resolve before anything lands
  for (const [f,,a,who] of acts){
    if (f.hexFail || a.type!=='ability') continue;
    const ab = a.a;
    if (ab.effect==='counter'){ f.energy-=ab.cost; f.counter=true; say(`${who} sets a <b>Fetch Counter</b>.`); a.done = true; }
    else if (ab.effect==='shield'){ f.energy-=ab.cost; f.shield += ab.amount; say(`${who} raises <b>${esc(ab.value)}</b> — ${ab.amount} shield.`); push({t:'shield',who:sideOf(f)}); a.done = true; }
    else if (ab.effect==='hold'){ f.energy-=ab.cost; f.hold = true; say(`${who} <b>holds</b>. Nothing gets through this turn.`); push({t:'shield',who:sideOf(f)}); a.done = true; }
  }

  for (const [f,,a,who] of acts){
    if (f.hexFail){ say(`${who} is <b>hexed</b> — the move fizzles.`); push({t:'float',who:sideOf(f),cls:'missN',txt:'HEXED'}); continue; }
    if (a.type==='guard'){ f.energy+=C.guard.energy; say(`${who} guards.`); push({t:'shield',who:sideOf(f)}); }
    else if (a.type==='taunt'){ f.energy+=C.taunt.energy; say(`${who} taunts.`); push({t:'float',who:sideOf(f),cls:'enN',txt:'+'+C.taunt.energy+'◆'}); }
  }

  for (const [f,g,a,who] of acts){
    if (f.hexFail || f.hp<=0) continue;
    const ga = (f===P ? ea : pa);
    const guarded = ga.type==='guard' && !g.hexFail;
    if (a.type==='bite') bite(f, g, ga, who);
    else if (a.type==='taunt' && guarded)
      damage(g, C.taunt.chip_vs_guard, `${who}'s taunt slips past the guard for`,'bite');
    else if (a.type==='ability' && !a.done){
      const ab = a.a;
      if (f===P && !simulating && !clubMode) SAVE.bump('abil');
      f.energy -= ab.cost;
      const fx = t => push({t, from:sideOf(f), to:sideOf(g)});
      switch (ab.effect){
        case 'damage': {
          fx(/laser/.test(ab.id) ? 'laser' : 'bolt');
          if (guarded && ab.fails_on_guard){ say(`${who} draws for <b>${esc(ab.value)}</b> — the guard is up. Nothing.`); push({t:'float',who:sideOf(g),cls:'missN',txt:'PARRIED'}); break; }
          if (guarded && !ab.ignores_guard){ say(`${who} uses <b>${esc(ab.value)}</b> — blocked.`); push({t:'float',who:sideOf(g),cls:'missN',txt:'BLOCK'}); break; }
          const d = blast(f, g, rint(ab.min,ab.max), who, ab, {sure: ab.sure});
          if (f===P && d>=8 && !simulating && !clubMode) SAVE.bump('big');
          if (ab.heal && f.hp>0) heal(f, ab.heal, `&nbsp;&nbsp;↳ the beam feeds him ${ab.heal}.`);
          if (ab.refund){ f.energy = Math.min(9, f.energy + ab.refund); push({t:'float',who:sideOf(f),cls:'enN',txt:'+'+ab.refund+'◆'}); }
          break; }
        case 'dip':    fx('bolt'); blast(f, g, 2 + Math.floor((f.maxHp - f.hp)/3), who, ab); break;
        case 'splash': { const n = Math.floor(f.energy * 1.5); f.energy = 0; fx('bolt');
                         if (n > 0) blast(f, g, n, who, ab); else say(`${who} splashes with an empty wallet.`); break; }
        case 'crash':  fx('bolt'); blast(f, g, ab.amount, who, ab); steal(f, g, 3, who); break;
        case 'rays':   fx('laser'); for (let i=0;i<ab.amount;i++) damage(g, 1, i ? '&nbsp;&nbsp;↳ another ray for' : `${who} splits the light — ray for`, 'bite'); break;
        case 'double': { const hits = [rint(4,7), rint(4,7)]; say(`${who} goes in <b>twice</b>.`);
                         hits.forEach(h => bite(f, g, ga, who, h)); break; }
        case 'heal':     heal(f, ab.amount, `${who} uses <b>${esc(ab.value)}</b> and heals ${ab.amount}.`); break;
        case 'energize': f.energy = Math.min(9, f.energy + ab.amount); say(`${who} pulls an <b>${esc(ab.value)}</b>: +${ab.amount} energy.`); push({t:'float',who:sideOf(f),cls:'enN',txt:'+'+ab.amount+'◆'}); break;
        case 'transmute':{ const n = steal(f, g, ab.amount, who); heal(f, n*3, `${who} <b>transmutes</b> ${n} energy into ${n*3} health.`); break; }
        case 'hex':    if (immuneHex(g)) say(`${who} casts <b>Hex</b> — it slides right off.`);
                       else { g.hexed = true; say(`${who} casts <b>Hex</b>.`); push({t:'float',who:sideOf(g),cls:'missN',txt:'HEX'}); } break;
        case 'horizon':if (immuneHex(g)) say(`${who} opens an <b>Event Horizon</b> — nothing to pull in.`);
                       else { g.hexTurns = 2; say(`${who} opens an <b>Event Horizon</b>. The next two moves are gone.`); push({t:'float',who:sideOf(g),cls:'missN',txt:'VOID'}); } break;
        case 'drain':  { const n = steal(f, g, ab.amount, who); if (n) say(`${who} glitches <b>${n}</b> energy away.`); break; }
      }
    }
  }

  for (const [f,g,,who] of acts){
    const b = amt(f,'burn');
    if (b && g.hp>0 && f.hp>0){ push({t:'burn',who:sideOf(g)}); damage(g, b, `${who} burns for`, 'burn', {sure:true}); }
    const rg = amt(f,'regen');
    if (rg && f.hp>0 && f.hp<f.maxHp) heal(f, rg, `${who} recovers ${rg}.`);
    if (has(f,'unstable') && f.hp>0){
      const r = rint(0,2);
      if (r===0){ f.energy = Math.min(9, f.energy+1); push({t:'float',who:sideOf(f),cls:'enN',txt:'+1◆'}); }
      else if (r===1) heal(f, 2, `${who} glitches back 2.`);
      else { f.boon = 2; push({t:'float',who:sideOf(f),cls:'enN',txt:'NEXT +2'}); }
    }
    const down = has(g,'downturn') ? 1 : 0;
    f.energy = Math.max(0, Math.min(9, f.energy + C.energy_per_turn + amt(f,'energy') - down));
    f.counter = false;
  }

  // did anybody actually get hurt this turn?
  P.idle = E.hp < hp0.E ? 0 : P.idle + 1;
  E.idle = P.hp < hp0.P ? 0 : E.idle + 1;
  if (P.hp<=0 || E.hp<=0 || turn>=C.max_turns) over = true;
  turn++;
  plannedE = null; insightShown = false;
}
function verdict(){
  if (P.hp<=0 && E.hp<=0) return 'DRAW';
  if (E.hp<=0) return 'YOU WIN';
  if (P.hp<=0) return 'YOU LOSE';
  const a=P.hp/P.maxHp, b=E.hp/E.maxHp;
  return a===b ? 'DRAW' : (a>b ? 'YOU WIN' : 'YOU LOSE');

}


/* ============================ sound ============================ */
const S = (() => {
  let ac = null, master = null, on = true;
  try { const v = localStorage.getItem('ba_sound'); if (v === '0') on = false; } catch(e){}
  function ctx(){
    if (!ac){
      const A = window.AudioContext || window.webkitAudioContext;
      if (!A) return null;
      ac = new A();
      master = ac.createGain(); master.gain.value = .3; master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function env(g, t, a, d, peak){
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(f1, f2, dur, type, peak, delay){
    const c = ctx(); if (!c || !on) return;
    const t = c.currentTime + (delay||0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f1, t);
    if (f2 && f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(30,f2), t + dur);
    env(g, t, .006, dur, peak || .25);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .06);
  }
  function noise(dur, type, freq, peak, delay, q){
    const c = ctx(); if (!c || !on) return;
    const t = c.currentTime + (delay||0);
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = type || 'bandpass';
    f.frequency.setValueAtTime(freq || 1200, t); f.Q.value = q || 1;
    const g = c.createGain(); env(g, t, .004, dur, peak || .3);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + dur + .05);
  }
  return {
    get on(){ return on; },
    toggle(){ on = !on; try{ localStorage.setItem('ba_sound', on?'1':'0'); }catch(e){} if(on){ ctx(); this.click(); } return on; },
    unlock(){ ctx(); },
    click(){ tone(660, 660, .04, 'square', .12); },
    bark(){ tone(520, 380, .09, 'square', .22); tone(430, 300, .08, 'square', .18, .1); },
    whoosh(){ noise(.16, 'bandpass', 900, .2, 0, .8); },
    guardUp(){ tone(880, 1320, .07, 'triangle', .2); tone(1320, 900, .12, 'triangle', .14, .06); },
    hit(big){
      noise(big?.22:.13, 'lowpass', big?900:1400, big?.42:.3);
      tone(big?150:190, big?48:70, big?.26:.17, 'sine', big?.5:.34);
      if (big) tone(90, 40, .3, 'triangle', .3, .02);
    },
    counter(){ tone(300, 900, .12, 'square', .26); noise(.12,'bandpass',1800,.22); },
    laser(){
      tone(2200, 160, .34, 'sawtooth', .3);
      tone(1100, 90, .34, 'square', .16, .01);
      noise(.3, 'highpass', 1400, .18, .03);
    },
    bolt(){
      noise(.1,'highpass',2600,.32); noise(.09,'highpass',1800,.26,.07);
      tone(1500, 420, .16, 'sawtooth', .2, .02);
    },
    burn(){ noise(.16,'lowpass',700,.16); },
    heal(){ [523,659,784].forEach((f,i)=>tone(f,f,.13,'sine',.22,i*.07)); },
    energy(){ tone(880, 1180, .09, 'triangle', .18); },
    miss(){ noise(.12,'bandpass',2200,.16,0,2); },
    round(){ tone(760,760,.06,'square',.16); tone(1010,1010,.08,'square',.16,.08); },
    win(){ [523,659,784,1047].forEach((f,i)=>tone(f,f,.2,'square',.24,i*.11)); },
    lose(){ [392,330,262].forEach((f,i)=>tone(f,f,.24,'triangle',.22,i*.14)); }
  };
})();


/* Legendaries are 20 of 5,000. Drawing opponents evenly from the demo roster
   would make them most of what you meet, so they're weighted down. */
function pickOpponent(exceptId){
  const taken = typeof OPP !== 'undefined' && !WALLET.demo ? isTaken : () => false;
  const all = DATA.fighters.filter(f => f.id !== exceptId);
  const pool = all.filter(f => !taken(f)).length ? all.filter(f => !taken(f)) : all;   // never run dry
  const legs = pool.filter(f => f.legendary);
  // Real collection rivals when we have them; the five demo dogs only until the pool has loaded.
  // Each one met leaves the pool and a fresh one is fetched, so faces keep changing.
  const real = (typeof OPP !== 'undefined' && !WALLET.demo) ? OPP.pool.filter(f => f.id !== exceptId && !f.legendary && !taken(f)) : [];
  const legendary = legs.length && Math.random() < .12;       // Legendaries: about one fight in eight
  if (real.length && !legendary){
    const f = real[rint(0, real.length - 1)];
    OPP.pool = OPP.pool.filter(x => x !== f); lsSet('ba_opps', OPP.pool); oppTopUp();
    return f;
  }
  if (legendary) return legs[rint(0, legs.length - 1)];
  const rest = pool.filter(f => !f.legendary);
  const src = rest.length ? rest : legs;
  return src[rint(0, src.length - 1)];
}

/* ============================ arena ============================ */
/* The arena is a knockout tournament of three fights (quarter-final, semi,
   final): a loss ends that tournament. Everyone gets three tournaments a day.
   Sign up and you fight it yourself. Don't, and your squad still enters —
   as ghosts that play your dogs for you. Live pays full XP, ghosts half. */
const ARENA_HOUR = 19;                       // UTC
const ARENA_XP = [0, 35, 60, 100];           // by rounds won: out in round 1 … champion
const ARENA_RUNS = 3;                        // tournaments per day
/* Arena rivals are real: Scrappys other signed-in players hold, at the bond
   level their owner trained them to, shown as "#123 from <name or wallet>".
   Only when nobody else has played yet (or in the demo) does a wild,
   ownerless collection dog step in. */
const RIVALS = {list:null, ready:[], total:0, at:0, loading:null};
function ensureRivals(){
  if (!LIVE() || !WALLET.token || WALLET.demo) return Promise.resolve([]);
  if (RIVALS.loading) return RIVALS.loading;
  const fresh = RIVALS.list && Date.now() - RIVALS.at < 5 * 60 * 1000;
  RIVALS.loading = (async () => {
    try {
      if (!fresh){
        const r = await api('/arena/rivals'); const j = await r.json();
        if (r.ok){ RIVALS.list = j.rivals || []; RIVALS.total = j.total || 0; RIVALS.at = Date.now(); RIVALS.ready = []; }
      }
      for (const x of (RIVALS.list || []).slice(0, 9)){
        if (RIVALS.ready.some(y => y.token === x.token)) continue;
        try { const def = await loadDef({nft_id: 'riv' + x.token, uri: x.uri}); RIVALS.ready.push({...x, def}); } catch(e){}
      }
    } catch(e){}
    RIVALS.loading = null;
    return RIVALS.ready;
  })();
  return RIVALS.loading;
}

function nextArena(){
  const n = new Date(), t = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate(), ARENA_HOUR));
  if (t <= n) t.setUTCDate(t.getUTCDate() + 1);
  return t;
}
function until(t){
  const m = Math.max(0, Math.round((t - Date.now())/60000));
  return m >= 60 ? Math.floor(m/60)+'h '+(m%60)+'m' : m+'m';
}
function ghostOpp(round, used){
  used = used || new Set();
  const fresh = RIVALS.ready.filter(x => !used.has(x.token)), pool = fresh.length ? fresh : RIVALS.ready;
  if (pool.length){
    const x = pool[rint(0, pool.length - 1)]; used.add(x.token);
    return {def: x.def, lvl: x.lvl, who: x.owner};
  }
  // nobody else has played yet: a wild collection dog, no owner to show
  return {def: pickOpponent(null), lvl: Math.min(BOND.maxLevel, 1 + round + rint(0,2)), who: null};
}
const rivalLabel = (dogName, who) => who ? `${dogName} from ${who}` : `a wild ${dogName}`;
/* Ghost vs ghost, no animation: the same engine, both sides on the AI. */
function simFight(defA, lvlA, defB, lvlB){
  const keep = {P, E, turn, log, ev, over};
  simulating = true;
  P = build(defA, lvlA); E = build(defB, lvlB); turn = 1; log = []; ev = []; over = false;
  let k = 0;
  while (!over && k < 40){ const ea = ai(E, P, null); resolve(ai(P, E, ea), ea); k++; }
  const v = verdict();
  simulating = false;
  ({P, E, turn, log, ev, over} = keep);
  return v === 'YOU WIN';
}
function squadDefs(){
  return SAVE.data.arena.squad.map(id => ROSTER().find(f => f.id === id)).filter(Boolean);
}
function runGhostArena(){
  const sq = squadDefs(), lines = [], used = new Set();
  let won = 0;
  for (let r = 0; r < 3; r++){
    const me = sq[r % sq.length], o = ghostOpp(r, used);
    const w = simFight(me, SAVE.dog(me.id).lvl, o.def, o.lvl);
    lines.push({r, me: me.name, opp: o.def.name, who: o.who, w});
    if (!w) break;
    won++;
  }
  const xp = Math.round(ARENA_XP[won] / 2);
  sq.forEach(d => SAVE.award(d.id, won > 0, Math.round(xp / sq.length), true, true));
  SAVE.arenaDone({won, xp, live:false, lines});
  return {won, xp, lines};
}
/* Live players get one arena a day; the demo stays unlimited (it never reaches the ladder). */
const arenaLimited = () => LIVE() && !WALLET.demo;
const arenaLocked = () => arenaLimited() && SAVE.arenaRunsToday() >= ARENA_RUNS;
function untilUtcMidnight(){
  const n = new Date(), t = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate() + 1));
  return until(t);
}
function startLiveArena(){
  const sq = squadDefs();
  arenaRun = {round:0, won:0, sq, lines:[], used:new Set()};
  arenaNext();
}
function arenaNext(){
  const r = arenaRun.round, me = arenaRun.sq[r % arenaRun.sq.length], o = ghostOpp(r, arenaRun.used);
  arenaRun.opp = o;
  startFight(me, o.def, false, o.lvl);
  say(`<span class="turn">🏟️ Arena — round ${r+1} of 3 · ${esc(me.name)} against ${esc(rivalLabel(o.def.name, o.who))} (Bond ${o.lvl}).</span>`);
}
function arenaAfterFight(win){
  const r = arenaRun;
  r.lines.push({r:r.round, me:P.def.name, opp:E.def.name, who:r.opp.who, w:win});
  if (win) r.won++;
  const finished = !win || r.round >= 2;         // knockout: a loss ends this tournament
  if (finished){
    const xp = ARENA_XP[r.won];
    r.sq.forEach(d => SAVE.award(d.id, r.won > 0, Math.round(xp / r.sq.length), true, true));
    SAVE.arenaDone({won:r.won, xp, live:true, lines:r.lines});
    r.done = true; r.xp = xp;
  } else r.round++;
}
function arenaLines(lines){
  const names = ['Quarter-final','Semi-final','Final'];
  return lines.map(l => `<p class="q">${l.w?'✅':'❌'} <span><b>${names[l.r]}</b> — ${esc(l.me)} vs ${esc(rivalLabel(l.opp, l.who))}</span></p>`).join('');
}

/* Live duels between two people who have this page open.

   Fairness without a server:
   1. COMMIT  — each player publishes only a hash of (move | salt | turn).
   2. REVEAL  — once both hashes are in, both publish move + salt. A reveal
                that doesn't match its hash is cheating and forfeits.
   3. RESOLVE — the dice for the turn are seeded from BOTH salts, and both
                pages run the identical engine in a fixed order (side A =
                the lower peer label). Same inputs, same dice, same fight —
                on both screens, with nobody able to peek or re-roll. */
let ROOM = null, USER = null, clubMode = false;
const CLUB = {room:null, unsub:null, lobbyUnsub:null, side:null, oppPeer:null, myDog:null, oppDog:null,
              myLvl:1, oppLvl:1, move:null, salt:null, commit:null, revealed:false, resolved:0,
              deadline:0, tick:null, waitSince:0, status:'', names:{}, started:false, ended:false};
const CLUB_TURN_MS = 10000, CLUB_AFK_MS = 30000;

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seedOf(str){ let h=2166136261>>>0; for (const ch of str){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619)>>>0; } return h; }
async function sha(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}
function randSalt(){ return [...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,'0')).join(''); }

/* The engine, with the turn's dice fixed. Both pages call this with the same
   state, the same two moves and the same seed. */
function resolveSeeded(pa, ea, seed){
  const r = Math.random; Math.random = mulberry32(seed);
  try { resolve(pa, ea); } finally { Math.random = r; }
}
function moveOf(f, m){
  if (typeof m === 'string' && m.startsWith('ab')){
    const a = f.actives[+m.slice(2)];

  }
  return ['bite','guard','taunt'].includes(m) ? {type:m} : {type:'guard'};
}
