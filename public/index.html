      <button class="act" data-fc="bite"  ${locked?'disabled':''}><b>🦷 Bite</b><small>${C.bite.min}-${C.bite.max} dmg. Beats a taunt, stopped by a guard.</small></button>
      <button class="act" data-fc="guard" ${locked?'disabled':''}><b>🛡️ Guard</b><small>Blocks a bite and snaps back for 2, +1◆. Loses to a taunt.</small></button>
      <button class="act" data-fc="taunt" ${locked?'disabled':''}><b>🐶 Taunt</b><small>+2◆, 2 chip through a guard. Eats extra from a bite.</small></button>
    </div>
    ${ab ? `<div class="acts abil">${ab}</div>` : ''}
    <p class="mini" style="margin:9px 0 0">You're on the <b>${CLUB.side==='A'?'left':'right'}</b>. Moves are locked as a hash and only revealed once both are in — nobody can see yours first.</p>
  </div>`;
  c.querySelectorAll('[data-fc]').forEach(b => b.onclick = () => clubChoose(b.dataset.fc));

/* ---------------- Fight Club over the server (Season 1 beta) ----------------
   Without a realtime room the game server is the referee. Both players send
   their move for the round; once both are in (or the 20 seconds run out, which
   counts as a guard) the server resolves it with the same engine as this page
   and a random seed. Each page then replays the stored rounds with that seed,
   so both screens show exactly the server's fight. Two missed rounds forfeit.
   No XP — the Club keeps its own record on the server. */
const SC = {me:null, linkId:null, link:null, err:'', note:'', duel:null, shown:0, sent:null, poll:null, clock:null, busyFetch:false};
const clubServer = () => !ROOM && LIVE() && !WALLET.demo;
try {
  const q = new URLSearchParams(location.search), id = q.get('duel');
  if (id && /^[0-9a-f]{8,40}$/.test(id)){
    SC.linkId = id;                                   // the club tab opens once `tab` exists (below)
    q.delete('duel'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash);
  }
} catch(e){}
const scLinkOf = id => location.origin + location.pathname + '?duel=' + id;
const SC_ERR = {no_such_player:'No player with that name. Names are set with ✏️ in the wallet card.',
  too_many_open:'You already have 3 open challenges — cancel one first.',
  not_your_dog:"That Scrappy isn't in your wallet any more — open the kennel once and pick again.",
  duel_not_open:'That challenge is no longer open.', not_invited:'That challenge is meant for another player.',
  own_duel:"That's your own challenge — send the link to someone else.", no_such_duel:'That challenge has expired.'};

async function scCall(path, body){
  const r = await api(path, body ? {method:'POST', body} : undefined);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(SC_ERR[j.error] || 'The Club is not reachable right now (' + (j.error || r.status) + ').');
  return j;
}
async function scRefresh(){
  if (!WALLET.token || !clubServer()) return;
  try { SC.me = await scCall('/club/me'); } catch(e){}
  if (SC.linkId && !SC.link){
    try { SC.link = (await scCall('/club/state?id=' + SC.linkId)).duel; }
    catch(e){ SC.err = e.message; SC.linkId = null; }
  }
  // someone accepted one of my challenges (or I reloaded mid-fight): into the ring
  const act = ((SC.me || {}).duels || []).find(d => d.status === 'active' && d.side);

}

function scWire(){
  app.querySelectorAll('[data-scjoin]').forEach(b => b.onclick = async () => {
    S.unlock(); S.click(); b.disabled = true; SC.err = '';
    try { const j = await scCall('/club/join', {id: b.dataset.scjoin, dogId: SAVE.data.club.dog}); SC.link = null; SC.linkId = null; scEnter(j.duel); }
    catch(e){ SC.err = e.message; SC.link = null; SC.linkId = null; menu(); }
  });
  app.querySelectorAll('[data-scdrop]').forEach(b => b.onclick = () => { S.click(); SC.link = null; SC.linkId = null; menu(); });
  app.querySelectorAll('[data-sccancel]').forEach(b => b.onclick = async () => {
    S.click(); try { await scCall('/club/cancel', {id: b.dataset.sccancel}); } catch(e){ SC.err = e.message; }
    await scRefresh(); menu();
  });
  app.querySelectorAll('[data-sccopy]').forEach(b => b.onclick = async () => {
    S.click(); const url = scLinkOf(b.dataset.sccopy);
    try { await navigator.clipboard.writeText(url); b.textContent = '✅ Copied'; }
    catch(e){ const i = b.closest('.wal').nextElementSibling; if (i) i.select(); b.textContent = 'Copy it below'; }
  });
  const create = async (opponent, open) => {
    SC.err = ''; SC.note = '';
    try {
      const j = await scCall('/club/create', {dogId: SAVE.data.club.dog, opponent: opponent || undefined, open: open || undefined});
      SC.note = opponent ? `🥊 Challenge sent to <b>${esc(j.duel.invite)}</b>. They see it in their Club tab.`
              : open ? '📣 Open challenge posted — it shows in everyone\'s Club tab and in the chat. Stay here, the fight starts when someone accepts.'
                     : '🔗 Invite link ready — copy it and send it to your opponent.';
    } catch(e){ SC.err = e.message; }
    await scRefresh(); menu();
  };
  const bn = document.getElementById('scByName'), nm = document.getElementById('scName');
  if (bn) bn.onclick = () => { S.unlock(); S.click(); const v = (nm.value || '').trim(); if (!v){ nm.focus(); return; } bn.disabled = true; create(v); };
  if (nm) nm.onkeydown = e => { if (e.key === 'Enter') bn.click(); };
  const iv = document.getElementById('scInvite');

  const op = document.getElementById('scOpen');

}

async function scEnter(v){
  if (clubMode) return;
  clubMode = true; arenaRun = null; SC.err = ''; SC.note = '';
  Object.assign(CLUB, {srv: v.id, side: v.side === 'a' ? 'A' : 'B', started: true, ended: false, result: null, status: 'Choose your move.'});
  SC.duel = v; SC.sent = null;
  app.innerHTML = nav() + `<div class="card"><p class="mini" style="margin:0">🥊 Into the ring…</p></div>`;
  const defs = await Promise.all(['a', 'b'].map(async s => {
    const f = v[s], own = s === v.side ? findDog(f.def.id) : null;
    let img = own && own.img;
    if (!img) try { img = (await loadDef({nft_id: 'fc' + f.def.id, uri: f.uri})).img; } catch(e){}
    return Object.assign({}, f.def, {img: img || f.img});
  }));
  P = build(defs[0], v.a.lvl, null, v.a.path); E = build(defs[1], v.b.lvl, null, v.b.path);
  turn = 1; log = []; ev = []; over = false;
  LBL.P = v.a.name; LBL.E = v.b.name;              // names on both sides; the HUD marks yours with YOU
  say(`<span class="turn">🥊 Fight Club — ${esc(v.a.name)} with ${esc(defs[0].name)} (Bond ${v.a.lvl}) vs ${esc(v.b.name)} with ${esc(defs[1].name)} (Bond ${v.b.lvl}).</span>`);
  // back after a reload: catch up on the rounds already fought, without the show
  SC.shown = 0;
  for (const r of v.rounds || []) scApply(r);
  ev = [];
  shell();
  clearInterval(SC.poll); SC.poll = setInterval(scStep, 1000);
  clearInterval(SC.clock); SC.clock = setInterval(scClock, 250);
  scStep();
}
function scApply(r){
  const who = s => s === CLUB.side.toLowerCase() ? 'You' : (s === 'a' ? SC.duel.a.name : SC.duel.b.name);
  for (const s of ['a', 'b']) if (r.auto && r.auto[s]) say(`<span class="turn">⏱️ ${esc(who(s))} ran out of time — guard.</span>`);
  resolveSeeded(moveOf(P, r.a), moveOf(E, r.b), r.seed >>> 0);
  SC.shown++;

async function scStep(){

/* ---- Joey Wallet (browser extension) ----
   Joey injects an XLS-72d provider as window.joey (or window.xrpl.joey). We ask
   the server for a one-time nonce, let Joey sign a "Sign in with XRPL" message
   (or, for a Ledger account, an unsubmittable challenge payment) and hand that
   to the server, which checks it and returns the same session as Xaman. */
function joeyProvider(){ return window.joey || (window.xrpl && window.xrpl.joey) || null; }
async function waitForJoeyProvider(ms){
  const t0 = Date.now();
  while (!joeyProvider() && Date.now() - t0 < ms) await wait(150);
  return joeyProvider();
}
function joeyCall(p, method, params){
  return typeof p[method] === 'function' ? p[method](params) : p.request({method, params});
}
async function joeyConnect(){
  WALLET.error = ''; WALLET.login = {state:'joey', step:'Looking for the Joey extension…'}; menu();
  const step = t => { if (WALLET.login && WALLET.login.state === 'joey'){ WALLET.login.step = t; menu(); return true; } return false; };
  try {
    const p = await waitForJoeyProvider(2500);
    if (!p) throw Object.assign(new Error('Joey Wallet extension not found in this browser. Install it from joeywallet.xyz — or pick Xaman.'), {shown:true});
    if (!step('Approve the connection in Joey…')) return;
    await joeyCall(p, 'connect', {name:'Bark Arena', icon:'https://scrappyxrp.fun/favicon-192.png'});
    const r = await api('/auth/joey/start', {method:'POST'}); const st = await r.json();
    if (!r.ok || !st.nonce) throw Object.assign(new Error('The game server is not reachable right now.'), {shown:true});
    if (!step('Approve the sign-in in Joey…')) return;
    const res = await joeyCall(p, 'signIn', {statement: st.statement, nonce: st.nonce});
    if (!WALLET.login || WALLET.login.state !== 'joey') return;             // cancelled meanwhile
    const body = res && res.signedTx ? {address:res.address, signedTx:res.signedTx}   // Ledger account
      : {address:res.address, publicKey:res.publicKey, message:res.message, signature:res.signature};
    const v = await api('/auth/joey/verify', {method:'POST', body}); const j = await v.json();
    if (!v.ok || j.state !== 'signed') throw Object.assign(new Error('Joey sign-in could not be verified (' + (j.error || v.status) + ').'), {shown:true});
    lsSet('ba_session', {token:j.token, account:j.account});
    WALLET.login = null; walletSignedIn(j.token, j.account);
  } catch(e){
    if (!WALLET.login) return;
    const declined = e && (e.code === 4001 || /reject|denied|declin/i.test(e.message || ''));
    WALLET.login = {state:'choose'};
    WALLET.error = declined ? 'Sign-in was declined in Joey.' : (e && e.shown ? e.message : 'Joey sign-in failed (' + ((e && e.message) || 'unknown error') + ').');

}
/* ---- Joey app (mobile) over WalletConnect ----
   /wc.js bundles @walletconnect/sign-client and a QR generator and is only
   loaded here. The app has no sign-in method over WalletConnect, so it proves
   the wallet by signing a payment of 1 drop to itself — a transaction rippled
   refuses (temREDUNDANT), so the signature can never move funds — carrying the
   server's one-time nonce in a memo. The server checks it like a Ledger sign-in. */
let WC = null;
const isPhone = () => /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

async function wcClient(){

async function joeyMobileConnect(){
  WALLET.error = ''; WALLET.login = {state:'joeym', step:'Preparing the connection…'}; menu();
  const live = () => WALLET.login && WALLET.login.state === 'joeym';
  const set = o => { if (live()){ Object.assign(WALLET.login, o); menu(); } return live(); };
  let wc, session;
  try {
    wc = await wcClient();
    const {uri, approval} = await wc.client.connect({
      requiredNamespaces: {xrpl: {chains: ['xrpl:0'], methods: ['xrpl_signTransaction'], events: []}},
    });
    if (!set(isPhone() ? {step:'Tap “Open Joey” and approve the connection.', link: uri}
                       : {step:'Scan the code with the Joey app.', qr: await wc.qrDataUrl(uri)})) return;
    session = await approval();
    if (!live()) return;
    const acct = ((session.namespaces.xrpl || {}).accounts || [])[0] || '';
    const address = acct.split(':').pop();
    if (!/^r[1-9A-HJ-NP-Za-km-z]{24,34}$/.test(address)) throw Object.assign(new Error('Joey did not share an XRPL account.'), {shown:true});
    const r = await api('/auth/joey/start', {method:'POST'}); const st = await r.json();
    if (!r.ok || !st.nonce) throw Object.assign(new Error('The game server is not reachable right now.'), {shown:true});
    const back = (session.peer.metadata.redirect || {}).native || (session.peer.metadata.redirect || {}).universal || '';
    if (!set({connected:true, qr:null, link: isPhone() ? back : '', step:'Connected as ' + address.slice(0,6) + '…' + address.slice(-4) + '. Now approve the sign-in in the Joey app — it signs a 1-drop payment to yourself that can never be sent.'})) return;
    const tx = {TransactionType:'Payment', Account:address, Destination:address, Amount:'1', Fee:'12', Sequence:0,
      Memos:[{Memo:{MemoType: toHexUtf8('bark-arena/sign-in'), MemoData: toHexUtf8(JSON.stringify({wallet:'joey', challenge: st.nonce}))}}]};
    const res = await wc.client.request({topic: session.topic, chainId: 'xrpl:0',
      request: {method: 'xrpl_signTransaction', params: {tx_json: tx, autofill: false, submit: false}}});
    if (!live()) return;
    const blob = typeof res === 'string' ? res : (res && (res.tx_blob || res.signedTransaction || (res.result && res.result.tx_blob)));
    const signed = res && (res.tx_json || (res.result && res.result.tx_json));
    const body = blob ? {address, txBlob: blob} : signed ? {address, signedTx: JSON.stringify(signed)} : null;
    if (!body) throw Object.assign(new Error('Joey returned no signed transaction.'), {shown:true});
    const v = await api('/auth/joey/verify', {method:'POST', body}); const j = await v.json();
    if (!v.ok || j.state !== 'signed') throw Object.assign(new Error('Joey sign-in could not be verified (' + (j.error || v.status) + ').'), {shown:true});
    lsSet('ba_session', {token:j.token, account:j.account});
    WALLET.login = null; walletSignedIn(j.token, j.account);
  } catch(e){
    if (live()){
      const declined = e && (e.code === 4001 || e.code === 5000 || /reject|denied|declin/i.test(e.message || ''));
      const expired = /expired/i.test((e && e.message) || '');
      WALLET.login = {state:'choose'};
      WALLET.error = declined ? 'Sign-in was declined in the Joey app.' : expired ? 'The connection request expired — try again.'
        : (e && e.shown ? e.message : 'Joey app sign-in failed (' + ((e && e.message) || 'unknown error') + ').');
      menu();
    }
  } finally {
    // the session was only for signing in; the game uses its own session from here on
    if (wc && session) wc.client.disconnect({topic: session.topic, reason: {code: 6000, message: 'Signed in'}}).catch(() => {});
  }
}

const PATTERNED = new Set(['bonepattern','pawprintpattern','xrplgrid','nightsky','moon','goldradial']);
//@engine  (shared with the server: server.js runs these sections for Fight Club — keep them free of DOM/UI)
const nrm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
const BYVAL = {};
DATA.traits.forEach(t => { (BYVAL[nrm(t.value)] = BYVAL[nrm(t.value)] || []).push(t); });
function traitFor(type, value){
  const c = BYVAL[nrm(value)]; if (!c) return null;
  if (c.length === 1) return c[0].id;
  const tt = nrm(type);
  return (c.find(t => tt.includes(nrm(t.layer).slice(0, 4)) || nrm(t.trait_type) === tt) || c[0]).id;
}
function defFromMeta(nft, m){
  const at = m.attributes || [], get = n => (at.find(a => nrm(a.t) === nrm(n)) || {}).v;
  const token = m.token || null;
  const legendary = token && token >= 1 && token <= 20 ? String(token) : null;
  const setName = (get('Set') || '').replace(/\s+II$/i, '').trim();
  const traits = [], unknown = [];
  if (!legendary) for (const a of at){
    if (['rarity','set','setmatch','type','legendary','paws'].includes(nrm(a.t))) continue;
    if (['', 'none', 'keins', 'kein', 'nothing', 'null'].includes(nrm(a.v))) continue;   // empty layers, e.g. "(keins)"
    const id = traitFor(a.t, a.v); id ? traits.push(id) : unknown.push(a.t + ': ' + a.v);
  }

          rarity: legendary ? 'Legendary' : (get('Rarity') || 'Common'),
          set: setName || null, setMatch: +(get('Set Match') || 0), legendary, traits, unknown,
          bg: nrm(get('Background'))};

//@/engine

const SIL = (() => { const b = atob(SIL_B64), m = new Uint8Array(9216);
  for (let i = 0; i < 9216; i++) m[i] = (b.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1; return m; })();

/* Cut a 1152px collection image down to its 96px grid and lift the dog off its
   background: chained flood fill from the border, then (for patterned
   backgrounds) keep only what touches the body or sits on the ground. */
function cutout(bitmap, patterned){
  const N = 96, c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(bitmap, 0, 0, N, N);
  const im = x.getImageData(0, 0, N, N), p = im.data, bg = new Uint8Array(N*N);
  const Q = new Int32Array(N*N*12); let h = 0, t = 0;
  const push = (i, ref) => { Q[t++] = i; Q[t++] = ref; };
  for (let k = 0; k < N; k++){ push(k,k); push((N-1)*N+k,(N-1)*N+k); push(k*N,k*N); push(k*N+N-1,k*N+N-1); }
  while (h < t){
    const i = Q[h++], ref = Q[h++]; if (bg[i]) continue;
    const a = i*4, b = ref*4;
    if (Math.abs(p[a]-p[b]) + Math.abs(p[a+1]-p[b+1]) + Math.abs(p[a+2]-p[b+2]) > 26) continue;
    bg[i] = 1; const X = i % N, Y = (i / N) | 0;
    if (X > 0) push(i-1, i); if (X < N-1) push(i+1, i); if (Y > 0) push(i-N, i); if (Y < N-1) push(i+N, i);
  }
  // 8-connected components of what's left
  const comp = new Int32Array(N*N).fill(-1), sizes = [], touchS = [], low = [];
  for (let s = 0; s < N*N; s++){
    if (bg[s] || comp[s] >= 0) continue;
    const id = sizes.length; let n = 0, ts = false, lo = false; const st = [s]; comp[s] = id;
    while (st.length){
      const i = st.pop(); n++; if (SIL[i]) ts = true; if (((i / N) | 0) >= 72) lo = true;
      const X = i % N, Y = (i / N) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
        const nx = X+dx, ny = Y+dy; if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
        const j = ny*N + nx; if (!bg[j] && comp[j] < 0){ comp[j] = id; st.push(j); }
      }
    }
    sizes.push(n); touchS.push(ts); low.push(lo);
  }
  for (let i = 0; i < N*N; i++){
    let keep = !bg[i] || SIL[i];
    if (keep && !SIL[i] && comp[i] >= 0){
      const k = comp[i];
      keep = patterned ? (touchS[k] || (low[k] && sizes[k] >= 12)) : (touchS[k] || sizes[k] >= 5);
    }
    if (!keep) p[i*4+3] = 0;
  }
  x.putImageData(im, 0, 0);
  return c.toDataURL('image/png');
}
/* When the server is rate limited by IPFS, the browser fetches directly: the
   player's own IP is almost never throttled, and gateways allow CORS. */
const IPFS_GW = ['https://ipfs.io/ipfs/', 'https://gateway.pinata.cloud/ipfs/', 'https://dweb.link/ipfs/', 'https://w3s.link/ipfs/'];
function ipfsUrls(u){
  u = String(u || '').trim();
  let m = u.match(/^ipfs:\/\/(?:ipfs\/)?(.+)$/) || u.match(/^https:\/\/[^/]+\/ipfs\/(.+)$/) || u.match(/^((?:Qm[1-9A-HJ-NP-Za-km-z]{44}|b[a-z2-7]{50,})(?:\/.*)?)$/);
  return m ? IPFS_GW.map(g => g + m[1]) : (/^https:\/\//i.test(u) ? [u] : []);
}
async function directFetch(u){
  const urls = ipfsUrls(u); if (!urls.length) throw new Error('no url');
  const ctl = urls.map(() => new AbortController()), timer = setTimeout(() => ctl.forEach(c => c.abort()), 12000);
  try {
    const [r, win] = await Promise.any(urls.map((url, i) => fetch(url, {signal: ctl[i].signal})
      .then(r => { if (!r.ok) throw new Error('http ' + r.status); return [r, i]; })));
    ctl.forEach((c, i) => { if (i !== win) c.abort(); });
    return r;
  } catch(e){ throw new Error((e.errors && e.errors[0] && e.errors[0].message) || 'unreachable'); }
  finally { clearTimeout(timer); }
}
async function directMeta(uri){
  const r = await directFetch(uri), m = await r.json(), base = r.url;
  let image = m.image || m.image_url || '';
  if (image && !/^(ipfs:|https:)/i.test(image) && !ipfsUrls(image).length){
    image = new URL(image, base).toString();
    if (/\/metadata\//.test(base)) image = image.replace('/metadata/', '/images/');
  }
  return {name: m.name || '', token: +((m.name || '').match(/#\s*(\d+)/) || [])[1] || null, image,
          attributes: Array.isArray(m.attributes) ? m.attributes.map(a => ({t: String(a.trait_type || ''), v: String(a.value ?? '')})) : []};
}
async function imageFor(def, imageUrl){
  if (def.legendary){ const L = DATA.fighters.find(f => f.id === 'L' + def.legendary); if (L) return L.img; }
  let r = await api('/img?u=' + encodeURIComponent(imageUrl)).catch(() => null);
  if (!r || !r.ok) r = await directFetch(imageUrl).catch(e => { throw new Error('image ' + (r ? r.status : e.message)); });
  const bmp = await createImageBitmap(await r.blob());
  return cutout(bmp, PATTERNED.has(def.bg));
}

/* One NFT (nft_id + uri) → a playable fighter: metadata, then the cut-out image.
   The server is tried first; the browser fetches directly if the server can't. */
async function loadDef(n){
  let m;
  try {
    const mr = await api('/meta?uri=' + encodeURIComponent(n.uri));
    m = await mr.json(); if (!mr.ok) throw new Error(m.error || 'meta');
  } catch(se){ m = await directMeta(n.uri).catch(e => { throw new Error(se.message + ', direct: ' + e.message); }); }
  const def = defFromMeta(n, m);
  def.img = await imageFor(def, m.image);
  return def;
}

/* ---- opponents from the real collection ----
   Every Pixel Scrappy's metadata sits in one IPFS folder (…/<number>.json).
   Once the kennel knows that folder, rivals are drawn at random from all of
   them, fetched in the background and kept in a small rotating pool. */
const COLLECTION_SIZE = 5000;
const OPP = {base: lsGet('ba_opp_base'), pool: lsGet('ba_opps') || [], busy: false, taken: new Set(), takenAt: 0};
/* Token number of a fighter: real NFTs carry it, demo Legendaries are L1–L20, demo dogs use it as id. */
const tokenOf = f => f.token || (f.legendary ? +f.legendary : +f.id) || null;
/* Scrappys held by anyone who signed in to the game — never drawn as rivals. */
const isTaken = f => { const t = tokenOf(f); return !!t && OPP.taken.has(t); };
async function oppLoadTaken(){
  if (Date.now() - OPP.takenAt < 5 * 60 * 1000) return;
  try {
    const r = await api('/taken'); const j = await r.json();
    if (r.ok && Array.isArray(j.tokens)){
      OPP.taken = new Set(j.tokens); OPP.takenAt = Date.now();
      OPP.pool = OPP.pool.filter(f => !isTaken(f)); lsSet('ba_opps', OPP.pool);
    }
  } catch(e){}
}
function oppLearnBase(nfts){
  const count = {};
  for (const n of nfts){ const m = String(n.uri || '').match(/^(.*\/)\d+\.json$/); if (m) count[m[1]] = (count[m[1]] || 0) + 1; }
  const best = Object.keys(count).sort((a, b) => count[b] - count[a])[0];
  if (best && best !== OPP.base){ OPP.base = best; OPP.pool = []; lsSet('ba_opp_base', best); lsSet('ba_opps', []); }
}
async function oppTopUp(){
  if (OPP.busy || !OPP.base || !WALLET.token || WALLET.demo) return;
  OPP.busy = true;
  try {
    await oppLoadTaken();
    for (let tries = 0; OPP.pool.length < 24 && tries < 8; tries++){
      const num = rint(21, COLLECTION_SIZE);        // 1–20 are the Legendaries, drawn separately
      if (OPP.taken.has(num) || OPP.pool.some(f => f.token === num)) continue;
      try {
        const def = await loadDef({nft_id: 'opp' + num, uri: OPP.base + num + '.json'});
        OPP.pool.push(def); lsSet('ba_opps', OPP.pool);
      } catch(e){ console.warn('opponent', num, e); }
    }
  } finally { OPP.busy = false; }
}

async function loadKennel(fresh){
  WALLET.loading = true; WALLET.error = ''; WALLET.progress = 'Reading your wallet…'; tab = 'kennel'; menu();
  try {
    const r = await api('/me/kennel' + (fresh ? '?fresh=1' : ''));
    if (r.status === 401){ walletSignOut(); WALLET.error = 'Your session ended — sign in again.'; menu(); return; }
    const j = await r.json(); if (!r.ok) throw new Error(j.error || 'kennel');
    WALLET.name = j.name || null;
    const cacheKey = 'ba_dogs:' + WALLET.account, cache = lsGet(cacheKey) || {};
    const out = [], failed = [];
    let next = 0, done = 0;
    // a few at a time: fast, without tripping the gateways' rate limits
    const worker = async () => { while (next < j.nfts.length){
      const n = j.nfts[next++];
      try {
        let c = cache[n.nft_id];
        if (!c){ c = cache[n.nft_id] = await loadDef(n); lsSet(cacheKey, cache); }
        out.push(c);
      } catch(e){ console.warn('skipped', n.nft_id, e); failed.push(e.message); }
      done++; WALLET.progress = `Fetching your Scrappys… ${done} of ${j.nfts.length}`; menu();
    } };
    await Promise.all([0,1,2,3].map(worker));
    // Never a silent 0: say what the wallet holds and why nothing could be shown.
    if (!j.nfts.length && j.hint) WALLET.error = j.hint;
    else if (failed.length) WALLET.error = `${failed.length} of ${j.nfts.length} Scrappy${j.nfts.length===1?'':'s'} could not be loaded (${failed[0]}). Hit ↻ Refresh to retry.`;
    out.sort((a,b) => (b.legendary?1:0) - (a.legendary?1:0) || (a.token||1e9) - (b.token||1e9));
    OWNED = out; WALLET.owned = out.length;
    SAVE.registerDogs(out.map(f => f.id));
    oppLearnBase(j.nfts);
  } catch(e){ WALLET.error = 'Could not load your kennel (' + e.message + ').'; }
  WALLET.loading = false; if (SC.linkId) tab = 'club'; menu();
  if (SC.linkId) scRefresh();
  oppTopUp(); loadPacks(); claimDefense(); arenaRegister(); loadPrizes(); loadLending();
  if (SAVE.data.tvOff) api('/tv', {method:'POST', body:{off: true}}).catch(() => {});   // also covers Club duels (recorded on the server)
  loadBonus(); bossLoad(true); achSync(); refLoad();
  const src = lsGet('ba_src');
  if (src && src.src && lsGet('ba_src_sent') !== WALLET.account)
    api('/src', {method:'POST', body: src}).then(r => { if (r.ok) lsSet('ba_src_sent', WALLET.account); }).catch(() => {});
}
try {   // invited by a friend: ?ref=<their player name> (first one wins)
  const rf = new URLSearchParams(location.search).get('ref');
  if (rf && /^[A-Za-z0-9 _.\-]{3,16}$/.test(rf) && !lsGet('ba_ref')) lsSet('ba_ref', rf);
} catch(e){}
try {   // where a new player came from (a Short on TikTok/YouTube/Instagram → the website → here); first touch wins
  const sp = new URLSearchParams(location.search).get('src');
  if (sp && /^[a-z0-9_-]{1,24}$/i.test(sp) && !lsGet('ba_src')) lsSet('ba_src', {src: sp.toLowerCase(), at: Date.now()});
} catch(e){}

/* ============================ fx ============================ */
/* One canvas over the stage draws everything that moves fast: particles,
   impact stars, shockwave rings, shield bubbles, bark waves, speed streaks,
   plus a slow ambient layer per backdrop (petals, dust in the floodlights,
   haze and camera flashes in the club). Purely visual — the engine never
   reads any of it, so the server's Fight Club referee is unaffected. */
const RM = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; } })();
let cv, ctx, parts = [], beams = [], marks = [], amb = [], raf = 0, fxTheme = 'meadow', fxResize = null;
function fxInit(c, theme){
  cv = c; ctx = c.getContext('2d'); fxTheme = theme || 'meadow';
  parts = []; beams = []; marks = [];
  for (const k in LUNGE) delete LUNGE[k];          // a new stage: nobody is mid-jump
  const r = () => { if (!cv) return; const b = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio||1);
    cv.width = b.width*d; cv.height = b.height*d; ctx.setTransform(d,0,0,d,0,0); };
  r();
  if (fxResize) removeEventListener('resize', fxResize);
  fxResize = r; addEventListener('resize', r);
  ambSeed();
  cancelAnimationFrame(raf); loop();
}
function ambNew(anywhere){
  const w = cv.clientWidth || 400, h = cv.clientHeight || 300, R = Math.random;
  if (fxTheme === 'meadow') return {x: anywhere ? R()*w : -8, y: R()*h*.62, vx: .25+R()*.35, vy: .08+R()*.12,
    ph: R()*6, s: 2+R()*2, c: ['#ffffff','#ffd1e8','#fff3b0'][rint(0,2)]};
  if (fxTheme === 'arena') return {x: R()*w, y: anywhere ? R()*h*.8 : h*.78, vx: (R()-.5)*.15, vy: -.1-R()*.18,
    ph: R()*6, s: 1.5+R()*1.5, c: '#ffe7a8'};
  return {x: R()*w, y: anywhere ? R()*h*.85 : h*.85, vx: (R()-.5)*.2, vy: -.07-R()*.14,
    ph: R()*6, s: 1.5+R()*2, c: ['#ff8ad1','#c9a2ff','#ffffff'][rint(0,2)]};
}
function ambSeed(){
  amb = []; if (RM) return;
  const n = fxTheme === 'meadow' ? 9 : fxTheme === 'arena' ? 14 : 12;
  for (let i=0;i<n;i++) amb.push(ambNew(true));
}
function loop(){
  if (!ctx) return;
  const w = cv.clientWidth, h = cv.clientHeight;
  ctx.clearRect(0,0,w,h);
  // ambient layer
  for (let i=0;i<amb.length;i++){
    const a = amb[i]; a.ph += .05; a.x += a.vx + Math.sin(a.ph)*.25; a.y += a.vy;
    ctx.globalAlpha = fxTheme === 'meadow' ? .85 : .35 + .35*Math.sin(a.ph*1.7);
    ctx.fillStyle = a.c; ctx.fillRect(a.x|0, a.y|0, a.s, a.s);
    if (a.x > w+10 || a.x < -12 || a.y < -10 || a.y > h) amb[i] = ambNew(false);
  }
  ctx.globalAlpha = 1;
  // camera flashes in the crowd
  if (!RM && fxTheme !== 'meadow' && Math.random() < (fxTheme === 'club' ? .02 : .008))
    marks.push({k:'flash', x: Math.random()*w, y: h - 100 - Math.random()*44, life: 7, max: 7});
  for (const b of beams){
    b.life--;
    ctx.globalAlpha = Math.max(0, b.life/b.max);
    ctx.lineCap = 'round';
    ctx.strokeStyle = b.glow; ctx.lineWidth = b.w || 11;
    ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
    ctx.strokeStyle = b.core; ctx.lineWidth = b.w ? Math.max(2, b.w*.35) : 4;
    ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  beams = beams.filter(b => b.life > 0);
  auraTick();
  for (const m of marks){ m.life--; drawMark(m); }
  marks = marks.filter(m => m.life > 0);
  ctx.globalAlpha = 1;
  for (const p of parts){

const abOf = side => { const f = side === 'l' ? P : E; return f && f.actives && f.actives[0]; };

/* The dog really jumps at its rival: out to the rival on the moves, it stays

const LUNGE = {};
function lungeDist(side, both){
  const el = fighterEl(side), o = fighterEl(side === 'l' ? 'r' : 'l'); if (!el || !o) return 0;
  const a = el.getBoundingClientRect(), b = o.getBoundingClientRect();
  const gap = Math.abs((b.left + b.width/2) - (a.left + a.width/2)) - a.width * .52;

    {transform: f + 'translate(0,0)'},
    {transform: f + 'translate(-16px,4px) scale(.9,1.1)', offset: .25},
    {transform: f + `translate(${d*.55}px,-34px) rotate(-8deg) scale(1.04,.96)`, offset: .6},

function lungeBack(side, now){

function comic(side, txt, cls){ const p = hitPoint(side); domFx(`<div class="comic ${cls || ''}">${esc(txt)}</div>`, p.x + (side === 'l' ? -40 : -20), p.y - 64, 760); }

async function play(){
  busy = true; document.getElementById('ctrl')?.classList.add('busy');

      const b=document.querySelector('.banner'); if(b){b.className='banner';b.textContent=e.txt;void b.offsetWidth;b.classList.add('on');}

    }

      const sides = [['l', e.l], ['r', e.r]];
      MV.l = e.l; MV.r = e.r;

      for (const [s, m] of sides){

  }

  }

    const v = verdict();

    koFx(v === 'YOU WIN' ? 'l' : v === 'YOU LOSE' ? 'r' : null);

    const win = v==='YOU WIN';

function vfStart(a, b, el, eo, mb){

  if (!LIVE() || !WALLET.token || WALLET.demo || clubMode || tvMode || (!isRanked && !arenaRun)) return;
  const body = {kind: arenaRun ? 'arena' : 'ranked', dog: a.id, opp: vfOpp(b, arenaRun && arenaRun.opp), lvl: el, oppLvl: eo,
    bonus: mb ? mb.key : null, path: SAVE.dog(a.id).path || null, run: arenaRun ? arenaRun.id : null, stage: arenaRun ? arenaRun.round : null};
  const pathE = arenaRun && arenaRun.opp ? arenaRun.opp.path || null : null;

    if (cloudTimer) await cloudPush();                 // the server reads the bond levels from the cloud save
    const r = await api('/fight/start', {method: 'POST', body}), j = await r.json();
    if (!j.fid) return;
    // the server builds both dogs itself; if it saw other bond levels (an old cloud save), the fight uses its levels
    if (j.lvl && (j.lvl.P !== P.lvl || j.lvl.E !== E.lvl) && turn === 1){

async function vfRound(a, b){
  if (VF.wait){ VF.busy = true; await VF.wait; VF.busy = false; }
  if (!VF.on) return null;
  VF.busy = true;
  try {
    const r = await api('/fight/round', {method: 'POST', body: {fid: VF.fid, a, b}}), j = await r.json();
    if (r.ok && Number.isInteger(j.seed)){ VF.hp = j.hp; if (j.over){ VF.on = false; VF.boss = j.boss || null; if (j.boss && BOSS.d){ BOSS.d.hp = j.boss.hp; BOSS.d.mine = (BOSS.d.mine || 0) + j.boss.hit; } } return j.seed; }

/* ---- Bark Arena TV recording: the dice the engine rolled this round, rounded to 1e-6 and used as rounded,

const REC = {cur: null};
function recRolls(fn){
  const orig = Math.random, out = [];
  Math.random = () => { const q = Math.floor(orig() * 1e6); out.push(q); return q / 1e6; };
  try { fn(); } finally { Math.random = orig; }

}
function rollsReplay(arr, fn){
  const orig = Math.random; let i = 0;
  Math.random = () => (i < arr.length ? arr[i++] : Math.floor(orig() * 1e6)) / 1e6;
  try { fn(); } finally { Math.random = orig; }
}

function achScan(ctx){
  if (!achLive()) return;
  const d = SAVE.data, out = [];
  if (ctx && ctx.win){ out.push('first'); if (ctx.rarer) out.push('upset'); if (ctx.legendary) out.push('legend'); }
  if (d.best >= 5) out.push('streak5');
  if (d.best >= 10) out.push('streak10');
  if ((d.arena.best || 0) >= 3) out.push('champ');
  const lv = Math.max(1, ...Object.values(d.dogs).map(g => g.lvl || 1));
  if (lv >= 5) out.push('bond5');
  if (lv >= 10) out.push('bond10');
  if (d.fights >= 50) out.push('fights50');
  if (d.fights >= 250) out.push('fights250');
  if ((d.club.w || 0) >= 1) out.push('club');
  if (d.pack) out.push('pack');
  if (VF.boss && VF.boss.hit) out.push('boss');
  if ((OWNED || []).filter(f => !f.borrowed).length >= 3) out.push('kennel3');
  achUnlock(out);

/* ============================ daily recap ============================ */
/* Pops up once, the moment the last ranked fight and today's arena are both
   done. It can be reopened from the TODAY panel until midnight UTC. */
function recapHtml(){
  const D = SAVE.data, T = D.today, runs = T.arenas || [];
  const best = Math.max(0, ...runs.map(r => r.won)), arenaXp = runs.reduce((n, r) => n + r.xp, 0);
  const res = w => w === 3 ? '🏆 Champion' : w ? `out after ${w} win${w===1?'':'s'}` : 'out in the quarter-final';
  const missing = Math.max(0, ARENA_RUNS - runs.length);
  const arenaTxt = (runs.map((r, i) => `#${i+1} ${res(r.won)}`).join(' · ') || 'no finished tournament')
    + (missing ? ` · ${missing} not finished (left early or played before today's update)` : '');
  const lv = T.levels.map(l => { const f = findDog(l.id); return `<p class="q">⬆️ <span><b>${esc(f ? f.name : 'A Scrappy')}</b> reached Bond ${l.lvl}</span></p>`; }).join('');
  const qDone = (D.quests||[]).filter(q => q.got).length, qAll = (D.quests||[]).length;
  let pack = '';
  if (D.pack){
    const rows = standings(SAVE.weekOf()).slice().sort((x,y) => y.avgW - x.avgW);
    const i = rows.findIndex(p => p.id === D.pack);
    if (i >= 0) pack = `<p class="q">${rows[i].emoji} <span><b>${esc(rows[i].name)}</b> — #${i+1} of ${rows.length} this week (${rows[i].avgW.toFixed(1)} wins per member)</span></p>`;

    <h2>DAY COMPLETE</h2>
    <p class="mini" style="text-align:center;margin:0">Every ranked fight used and all three tournaments fought. Nice work.</p>
    <div class="grid">
      <div class="stat"><b>${T.wins}–${T.losses}</b><span class="mini">ranked fights W–L</span></div>
      <div class="stat"><b>+${T.xp + T.questXp}</b><span class="mini">XP today${T.questXp ? ' (' + T.questXp + ' from quests)' : ''}</span></div>
      <div class="stat"><b>${runs.filter(r => r.won === 3).length}× 🏆</b><span class="mini">champion · ${runs.length} tournament${runs.length===1?'':'s'} finished · best ${best}/3</span></div>
      <div class="stat"><b>🔥 ${D.streak}</b><span class="mini">streak now · week's best ${D.wk.streak}</span></div>
    </div>
    <p class="q">🏟️ <span><b>Arena:</b> ${arenaTxt} · +${arenaXp} XP</span></p>
    <p class="q">📋 <span><b>Quests:</b> ${qDone} of ${qAll} done</span></p>
    <p class="q">🎓 <span><b>Trainer level ${SAVE.trainerLvl()}</b> · ${SAVE.trainerInto()} / 250 XP</span></p>

    <div class="row" style="margin-top:12px"><button id="recapClose">Close</button></div>

async function weekLadder(wk){
  if (LIVE() && !WALLET.demo){
    const r = await api('/ladder?week=' + wk); const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'ladder');
    return j;
  }
  // demo: the same simulated rivals the ladder tab shows, plus your real last week
  const r = seeded('ladder' + wk), L = SAVE.data.lastWk || {xp:0, wins:0, streak:0};
  const names = Array.from({length:10}, (_, i) => 'Demo player ' + (i + 1));
  const rows = names.map(n => ({who:n, xp:Math.round(300+r()*2200), wins:Math.round(8+r()*70), streak:2+Math.floor(r()*11)}));
  rows.push({who:'YOU', xp:L.xp, wins:L.wins, streak:L.streak, you:true});
  const board = k => rows.slice().sort((a,b) => b[k]-a[k]);
  const out = {week:wk, players:rows.length, mine:{}};
  for (const k of ['xp','wins','streak']){
    const b = board(k); out[k] = b.slice(0,10).map(x => ({who:x.who, v:x[k], you:!!x.you, team:!!x.team}));
    const i = b.findIndex(x => x.you); out.mine[k] = L[k] > 0 ? {rank:i+1, v:L[k]} : null;
  }
  return out;
}

/* ---- chat: one small room for every signed-in player ---- */
const CHAT = {open:false, msgs:[], seq:0, seen:+(lsGet('ba_chat_seen') || 0), err:'', muted:false, busy:false, on:false};
const CHAT_ERR = {no_links:'Links are not allowed in the chat (scrappyxrp.fun and xrp.cafe are fine).',
  no_secrets:'That looks like a wallet secret. Never share it — with anyone.', slow_down:'Easy — one message every few seconds.',
  muted:'You are muted in the chat.', empty:'Type something first.'};
const chatAllowed = () => LIVE() && !!WALLET.token && !WALLET.demo;
function chatTime(t){ const d = new Date(t); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function chatMine(m){ return !m.sys && WALLET.account && (m.who === WALLET.name || m.who === WALLET.account.slice(0,5) + '…' + WALLET.account.slice(-4)); }
function chatDraw(){
  let fab = document.getElementById('chatFab'), box = document.getElementById('chatBox');
  document.body.classList.toggle('chat-on', CHAT.on);              // room under the page for the button
  if (!CHAT.on){ if (fab) fab.remove(); if (box) box.remove(); return; }
  if (!fab){
    fab = document.createElement('button'); fab.id = 'chatFab'; fab.setAttribute('aria-label', 'Chat');
    fab.onclick = () => { S.click(); CHAT.open = !CHAT.open; if (CHAT.open) chatPoll(); chatDraw(); };
    document.body.appendChild(fab);
  }
  const unread = CHAT.msgs.filter(m => m.id > CHAT.seen && !m.sys && !chatMine(m)).length;
  fab.innerHTML = CHAT.open ? '✕' : '💬' + (unread ? `<i>${unread > 9 ? '9+' : unread}</i>` : '');
  if (!CHAT.open){ if (box) box.remove(); return; }
  if (!box){
    box = document.createElement('div'); box.id = 'chatBox'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Bark Arena chat');
    box.innerHTML = `<header><b>💬 BARK CHAT</b><button aria-label="Close">×</button></header><div id="chatList" aria-live="polite"></div>
      <div id="chatErr"></div><form><input maxlength="200" placeholder="Say something nice…" autocomplete="off"><button type="submit">Send</button></form>`;
    box.querySelector('header button').onclick = () => { CHAT.open = false; chatDraw(); };
    box.querySelector('form').onsubmit = e => { e.preventDefault(); chatSend(); };
    document.body.appendChild(box);
  }
  const list = box.querySelector('#chatList'), atEnd = list.scrollHeight - list.scrollTop - list.clientHeight < 40;
  list.innerHTML = CHAT.msgs.length ? CHAT.msgs.map(m => m.sys
      ? `<p class="sys">${esc(m.text)}<span class="t">${chatTime(m.at)}</span></p>`
      : `<p class="${chatMine(m) ? 'me' : ''}"><span class="who">${esc(m.who)}</span>${m.team ? ' <span class="tag">TEAM</span>' : ''}<span class="t">${chatTime(m.at)}</span><br>${esc(m.text)}</p>`).join('')
    : '<p class="sys">No messages yet — say hi! 🐾</p>';
  if (atEnd || !CHAT.drawn) list.scrollTop = list.scrollHeight;
  CHAT.drawn = true;
  box.querySelector('#chatErr').textContent = CHAT.muted ? CHAT_ERR.muted : CHAT.err;
  if (CHAT.seq > CHAT.seen){ CHAT.seen = CHAT.seq; lsSet('ba_chat_seen', CHAT.seen); fab.innerHTML = '✕'; }
}
async function chatPoll(){
  if (!CHAT.on || CHAT.busy) return;
  CHAT.busy = true;
  try {
    const since = CHAT.msgs.length ? CHAT.msgs[CHAT.msgs.length - 1].id : 0;
    const r = await api('/chat?since=' + since), j = await r.json();
    if (r.ok){
      if (j.seq < since) CHAT.msgs = [];                       // the room was reset
      CHAT.msgs = CHAT.msgs.concat(j.msgs || []).slice(-80); CHAT.seq = j.seq; CHAT.muted = !!j.muted;
      if (!since && !CHAT.seen) CHAT.seen = Math.max(0, j.seq - 3);   // first visit: a few unread, not 80
    }
  } catch(e){}
  CHAT.busy = false; chatDraw();
}
async function chatSend(){
  const box = document.getElementById('chatBox'); if (!box) return;
  const inp = box.querySelector('input'), text = inp.value.trim(); if (!text) return;
  CHAT.err = '';
  try {
    const r = await api('/chat', {method:'POST', body:{text}}), j = await r.json().catch(() => ({}));
    if (!r.ok){ CHAT.err = CHAT_ERR[j.error] || 'Could not send (' + (j.error || r.status) + ').'; chatDraw(); return; }
    inp.value = ''; S.click();
  } catch(e){ CHAT.err = 'The server is not reachable right now.'; chatDraw(); return; }
  await chatPoll(); inp.focus();
}
/* shown on the menu screens for signed-in players; hidden in the ring */
function chatSync(show){
  const on = show && chatAllowed();
  if (on && !CHAT.on){ CHAT.on = true; chatPoll(); }
  if (!on){ CHAT.on = false; }
  chatDraw();
}
setInterval(() => { if (CHAT.on && !document.hidden && (CHAT.open || Date.now() - (CHAT.last || 0) > 25000)){ CHAT.last = Date.now(); chatPoll(); } }, 4000);

       <div class="ce3">Follow for daily fights 🐾</div><div class="ce5">Play free · link in bio</div>`
    : `<div class="ce1">Every dog is an NFT<br>on the XRP Ledger</div>
       <div class="ce2"><img src="${a.img}" alt=""><img src="${b.img}" alt=""></div>
       <div class="ce3">Mint your fighter 🐾</div><div class="ce4">scrappyxrp.fun/barkarena</div><div class="ce5">Subscribe for daily fights · link in description</div>`;
  if (viewer) end.insertAdjacentHTML('beforeend', `<div class="cebtn"><button type="button" id="clipAgain">↻ Watch again</button>
    <a href="https://scrappyxrp.fun/barkarena/?src=clip">🐾 Play Bark Arena</a></div>`);
  document.body.appendChild(end);
  const again = document.getElementById('clipAgain');
  if (again) again.onclick = () => location.reload(); S.fanfare(true);
  await wait((TT ? 2400 : 3400) / WAIT_K);
  CLIP.state = 'done';
}

if (/^\/tv\/?$/.test(location.pathname)) tvBoot();
else if (/^\/clip\/?$/.test(location.pathname)) clipBoot();
else {
  walletBoot();
  // ?demo=1 from the website ("Try the free demo"): straight into the demo dogs, unless already signed in
  try { if (new URLSearchParams(location.search).get('demo') === '1' && !WALLET.token) WALLET.demo = true; } catch(e){}
  menu();
}
</script>
