<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bark Arena — Pixel Scrappy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sky1:#96d8f8; --sky2:#d6f0fb; --hill:#9cd28c; --grass:#7cc56c; --grassD:#68b25a;
  --ink:#1b2030; --ink2:#4d5a72; --panel:#fff; --panelB:#cfe0ea; --accent:#3a5c8e;
  --hp:#4fbe62; --hpMid:#f0b93e; --hpLow:#e2574f; --en:#f7ce54; --shadow:rgba(20,35,55,.16);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky1:#1d2c44; --sky2:#31506e; --hill:#2f6b3d; --grass:#3d7a45; --grassD:#2f6337;
  --ink:#eaf1f8; --ink2:#a8bbd0; --panel:#1b2535; --panelB:#31435c; --accent:#8fb8ea;
  --shadow:rgba(0,0,0,.45);}}
:root[data-theme="dark"]{--sky1:#1d2c44;--sky2:#31506e;--hill:#2f6b3d;--grass:#3d7a45;--grassD:#2f6337;
  --ink:#eaf1f8;--ink2:#a8bbd0;--panel:#1b2535;--panelB:#31435c;--accent:#8fb8ea;--shadow:rgba(0,0,0,.45);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--panel);color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:hidden}
img{image-rendering:pixelated;-ms-interpolation-mode:nearest-neighbor}
.wrap{max-width:900px;margin:0 auto;padding:14px 12px 36px}
h1{font-family:'Press Start 2P',monospace;font-size:clamp(12px,3.2vw,18px);text-align:center;margin:4px 0 12px;letter-spacing:1px}
.card{background:var(--panel);border:2px solid var(--panelB);border-radius:10px;box-shadow:0 3px 0 var(--shadow);padding:13px;margin-bottom:12px}

/* ---------- stage ---------- */
.stage{position:relative;height:340px;border:2px solid var(--panelB);border-radius:10px;overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 58%);margin-bottom:12px;box-shadow:0 3px 0 var(--shadow)}
.stage.shake{animation:stageShake .28s}
@keyframes stageShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}45%{transform:translate(5px,-3px)}70%{transform:translate(-3px,-2px)}}
.sun{position:absolute;left:22px;top:18px;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle,#fff6cc 38%,#ffe082 60%,#ffd54a 100%);box-shadow:0 0 22px 6px rgba(255,214,90,.45)}
.hills{position:absolute;left:-5%;right:-5%;bottom:88px;height:70px;
  background:radial-gradient(60px 46px at 18% 100%,var(--hill) 99%,transparent 100%),
             radial-gradient(90px 60px at 52% 100%,var(--hill) 99%,transparent 100%),
             radial-gradient(70px 50px at 84% 100%,var(--hill) 99%,transparent 100%)}
.cloud{position:absolute;height:14px;background:#fff;border-radius:9px;opacity:.9}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:22px;height:22px;left:12px;top:-10px}
.cloud::after{width:15px;height:15px;left:34px;top:-6px}
.c1{width:60px;top:26px;animation:drift 46s linear infinite}
.c2{width:44px;top:58px;animation:drift 66s linear infinite;animation-delay:-20s;opacity:.75}
.c3{width:52px;top:14px;animation:drift 82s linear infinite;animation-delay:-52s;opacity:.65}
@keyframes drift{from{left:-90px}to{left:102%}}
.ground{position:absolute;left:0;right:0;bottom:0;height:92px;
  background:linear-gradient(180deg,var(--grass) 0%,var(--grass) 34%,var(--grassD) 100%)}
.ground::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:rgba(255,255,255,.22)}
.fence{position:absolute;left:0;right:0;bottom:88px;height:22px;opacity:.85;
  background:repeating-linear-gradient(90deg,#efe8d8 0 5px,transparent 5px 26px)}
.fence::before,.fence::after{content:"";position:absolute;left:0;right:0;height:4px;background:#efe8d8}
.fence::before{top:5px}.fence::after{top:13px}
.flower{position:absolute;width:5px;height:5px;border-radius:50%;box-shadow:0 4px 0 -1px rgba(60,130,70,.9)}

.fighter{position:absolute;bottom:56px;width:192px;text-align:center;transition:filter .12s;line-height:0}
/* Every sprite is the full 96x96 frame with the paws on row 88, drawn at exactly 2x:
   same pixel size for every dog, same ground line, whatever it wears on its head. */
.fighter img{width:192px;height:192px;margin-bottom:-14px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.14));animation:idle 2.6s ease-in-out infinite}
.fighter.left{left:3%}
.fighter.right{right:3%}
.fighter.right img{transform:scaleX(-1)}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.fighter.right img{animation:idleR 2.6s ease-in-out infinite}
@keyframes idleR{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-5px)}}

.fighter.lunge.left img{animation:lungeL .42s ease-out}
@keyframes lungeL{0%{transform:translateX(0)}35%{transform:translateX(56px) translateY(-10px) rotate(-7deg)}100%{transform:translateX(0)}}
.fighter.lunge.right img{animation:lungeR .42s ease-out}
@keyframes lungeR{0%{transform:scaleX(-1)}35%{transform:scaleX(-1) translateX(56px) translateY(-10px) rotate(-7deg)}100%{transform:scaleX(-1)}}
.fighter.guard img{animation:guardA .5s ease-out}
@keyframes guardA{0%,100%{transform:var(--flip,none)}40%{transform:var(--flip,none) scale(.9) translateY(6px)}}
.fighter.right.guard img{--flip:scaleX(-1)}
.fighter.taunt img{animation:tauntA .55s ease-in-out}
@keyframes tauntA{0%,100%{transform:var(--flip,none) rotate(0)}25%{transform:var(--flip,none) rotate(-9deg)}60%{transform:var(--flip,none) rotate(9deg)}}
.fighter.right.taunt img{--flip:scaleX(-1)}
.fighter.hurt img{filter:brightness(4) saturate(0) drop-shadow(0 0 6px #fff)}
.fighter.hurt{animation:knock .3s}
@keyframes knock{0%,100%{transform:translateX(0)}30%{transform:translateX(-11px)}65%{transform:translateX(7px)}}
.fighter.faint img{filter:grayscale(1) brightness(.72);transform:rotate(-14deg) translateY(12px);animation:none;transition:all .6s}
.fighter.right.faint img{transform:scaleX(-1) rotate(14deg) translateY(12px)}
.fighter.cheer img{animation:cheer .6s ease-in-out infinite}
@keyframes cheer{0%,100%{transform:var(--flip,none) translateY(0)}50%{transform:var(--flip,none) translateY(-16px)}}
.fighter.right.cheer img{--flip:scaleX(-1)}

canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.float{position:absolute;font-family:'Press Start 2P',monospace;font-size:15px;pointer-events:none;
  text-shadow:2px 2px 0 rgba(0,0,0,.45);animation:rise 1.05s ease-out forwards;white-space:nowrap}
@keyframes rise{0%{opacity:0;transform:translateY(6px) scale(.7)}18%{opacity:1;transform:translateY(-6px) scale(1.15)}100%{opacity:0;transform:translateY(-52px) scale(1)}}
.dmgN{color:#ff5a4d}.healN{color:#54d06a}.missN{color:#e8eef6}.enN{color:#ffd95e}
.banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:'Press Start 2P',monospace;
  font-size:clamp(11px,2.8vw,16px);color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,.5);pointer-events:none;opacity:0}
.snd{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:9px;cursor:pointer;
  border:2px solid rgba(0,0,0,.25);background:rgba(255,255,255,.65);font-size:15px;line-height:1;padding:0}
.snd:hover{background:rgba(255,255,255,.9)}
.banner.on{animation:bann 1.1s ease-out}
@keyframes bann{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.1)}}

/* ---------- living backdrops: meadow (ranked), stadium at dusk (arena), night ring (Fight Club) ---------- */
.stage>.tint{position:absolute;inset:0;pointer-events:none;opacity:var(--dusk,0);transition:opacity 1.4s ease;
  background:linear-gradient(180deg,rgba(255,120,60,.42),rgba(255,170,90,.18) 55%,rgba(255,170,90,0) 80%)}
.th-arena>.tint{background:linear-gradient(180deg,rgba(20,10,60,.6),rgba(20,10,60,.15) 60%,transparent 85%)}
.th-club>.tint{background:radial-gradient(ellipse at 50% 100%,rgba(255,47,184,.35),transparent 70%)}
.stage.frenzy::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 70px 14px rgba(255,40,40,.5);animation:frenzyPulse 1.1s ease-in-out infinite}
@keyframes frenzyPulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* meadow */
.rays{position:absolute;left:-6px;top:-10px;width:100px;height:100px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,236,150,.38) 0 9deg,rgba(255,236,150,0) 9deg 30deg);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);
  animation:spin 30s linear infinite}
.bird{position:absolute;top:46px;width:16px;height:8px;animation:fly 26s linear infinite}
.bird.b2{top:30px;animation-duration:34s;animation-delay:-17s;transform:scale(.75)}
.bird::before,.bird::after{content:"";position:absolute;top:3px;width:8px;height:2px;background:#33445a;border-radius:2px}
.bird::before{left:0;transform-origin:100% 50%;animation:flapL .32s ease-in-out infinite alternate}
.bird::after{left:8px;transform-origin:0 50%;animation:flapR .32s ease-in-out infinite alternate}
@keyframes flapL{from{transform:rotate(28deg)}to{transform:rotate(-22deg)}}
@keyframes flapR{from{transform:rotate(-28deg)}to{transform:rotate(22deg)}}
@keyframes fly{0%{left:-30px;margin-top:0}25%{margin-top:-8px}50%{margin-top:4px}75%{margin-top:-6px}100%{left:104%;margin-top:0}}
.tuft{position:absolute;top:-10px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
  border-bottom:12px solid var(--grassD);transform-origin:50% 100%;animation:sway 2.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:scale(var(--s,1)) rotate(-8deg)}50%{transform:scale(var(--s,1)) rotate(8deg)}}
.flower{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.bfly{position:absolute;bottom:120px;width:10px;height:8px;animation:flutter 16s ease-in-out infinite}
.bfly.f2{animation-duration:21s;animation-delay:-9s}
.bfly::before,.bfly::after{content:"";position:absolute;top:0;width:5px;height:7px;border-radius:50% 50% 40% 40%;background:#ff8ad1;animation:wing .18s ease-in-out infinite alternate}
.bfly.f2::before,.bfly.f2::after{background:#ffd54a}
.bfly::before{left:0;transform-origin:100% 50%}.bfly::after{left:5px;transform-origin:0 50%}
@keyframes wing{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
@keyframes flutter{0%{left:6%;bottom:118px}20%{left:30%;bottom:150px}40%{left:52%;bottom:112px}60%{left:78%;bottom:160px}80%{left:44%;bottom:135px}100%{left:6%;bottom:118px}}

/* stadium (arena) */
.th-arena{background:linear-gradient(180deg,#2e2152 0%,#8d4a78 40%,#e3875c 72%,#f6b56a 100%)}
.th-arena .ground{background:linear-gradient(180deg,#d9b27c 0%,#c49766 45%,#a87a52 100%)}
.th-arena .ground::before{background:rgba(255,255,255,.3)}
.th-arena .ring{position:absolute;left:10%;right:10%;top:16px;height:46px;border:3px solid rgba(255,255,255,.35);border-radius:50%}
.th-arena .fence{background:repeating-linear-gradient(90deg,#5b3a2a 0 5px,transparent 5px 26px);opacity:.9}
.th-arena .fence::before,.th-arena .fence::after{background:#5b3a2a}
.flood{position:absolute;top:12px;width:34px;height:14px;border-radius:4px;background:#fffbe0;
  box-shadow:0 0 26px 12px rgba(255,240,180,.55);animation:floodFlick 7s infinite}
.flood::after{content:"";position:absolute;left:50%;top:10px;width:240px;height:260px;margin-left:-120px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,244,200,.22),rgba(255,244,200,0));clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}
.flood.f1{left:7%}.flood.f2{right:7%;animation-delay:-3.5s}
@keyframes floodFlick{0%,46%,50%,100%{opacity:1}48%{opacity:.7}}
.pennants{position:absolute;left:0;top:84px;width:100%;height:34px;overflow:visible}
.pen{transform-box:fill-box;transform-origin:50% 0;animation:penSwing 2.4s ease-in-out infinite}
@keyframes penSwing{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.crowd{position:absolute;left:-3%;right:-3%;bottom:98px;height:46px;--cr:#2b1d3a;
  background:radial-gradient(circle at 11px 11px,var(--cr) 6px,transparent 6.5px),
             radial-gradient(ellipse 10px 15px at 11px 34px,var(--cr) 97%,transparent 100%);
  background-size:22px 46px;background-repeat:repeat-x;animation:crowdBob 1.8s ease-in-out infinite}
.crowd.back{bottom:112px;opacity:.6;background-position:11px 0;animation-delay:-.9s;transform:scale(.9)}
.crowd.cheer{animation:crowdJump .2s ease-in-out 6 alternate}
@keyframes crowdBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes crowdJump{from{transform:translateY(0)}to{transform:translateY(-9px)}}

/* night ring (Fight Club) */
.th-club{background:radial-gradient(ellipse at 50% 115%,#4a1f6e 0%,#1a1236 52%,#08070f 100%)}
.th-club .ground{background:linear-gradient(180deg,#30285a 0%,#211b40 50%,#151129 100%)}
.th-club .ground::before{background:rgba(255,95,210,.35)}
.th-club .mat{position:absolute;left:50%;top:18px;width:150px;height:44px;margin-left:-75px;border-radius:50%;
  border:3px solid rgba(255,95,210,.45);box-shadow:0 0 18px rgba(255,95,210,.35),inset 0 0 18px rgba(255,95,210,.25)}
.th-club .crowd{--cr:#0b0a18}
.spot{position:absolute;top:-24px;width:150px;height:380px;pointer-events:none;transform-origin:50% 0;
  background:linear-gradient(180deg,rgba(255,250,225,.34),rgba(255,250,225,0) 88%);
  clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);animation:sweep 5.5s ease-in-out infinite alternate}
.spot.s1{left:6%}.spot.s2{right:6%;animation-delay:-2.75s;animation-direction:alternate-reverse}
@keyframes sweep{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
.neon{position:absolute;left:50%;top:76px;transform:translateX(-50%);font-family:'Press Start 2P',monospace;font-size:12px;
  white-space:nowrap;color:#ffd1f3;text-shadow:0 0 3px #ff5fd2,0 0 10px #ff2fb8,0 0 22px #ff2fb8;animation:neonFlick 6s infinite}
@keyframes neonFlick{0%,17%,21%,24%,61%,64%,100%{opacity:1}19%,23%,62%{opacity:.3}}
.ropes{position:absolute;left:1%;right:1%;bottom:90px;height:56px;
  background:linear-gradient(#ff4f6d,#ff4f6d) 0 4px/100% 3px no-repeat,
             linear-gradient(#f4f4ff,#f4f4ff) 0 22px/100% 3px no-repeat,
             linear-gradient(#4f7dff,#4f7dff) 0 40px/100% 3px no-repeat;opacity:.85}
.ropes::before,.ropes::after{content:"";position:absolute;bottom:-6px;width:8px;height:62px;border-radius:3px;background:#c9c6dc}
.ropes::before{left:0}.ropes::after{right:0}

/* ---------- fighters: shadow, sharper moves ---------- */
.fighter img{position:relative}
.fighter .shd{position:absolute;left:50%;bottom:-2px;width:112px;height:14px;margin-left:-56px;border-radius:50%;
  background:rgba(0,0,0,.24);animation:shd 2.6s ease-in-out infinite}
@keyframes shd{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.86);opacity:.65}}
.fighter.lunge.left img{animation:lungeL .46s cubic-bezier(.3,.7,.3,1)}
@keyframes lungeL{0%{transform:translateX(0)}18%{transform:translateX(-12px) scale(.93,1.07)}42%{transform:translateX(72px) translateY(-12px) rotate(-8deg) scale(1.08,.94)}100%{transform:translateX(0)}}
.fighter.lunge.right img{animation:lungeR .46s cubic-bezier(.3,.7,.3,1)}
@keyframes lungeR{0%{transform:scaleX(-1)}18%{transform:scaleX(-1) translateX(-12px) scale(.93,1.07)}42%{transform:scaleX(-1) translateX(72px) translateY(-12px) rotate(-8deg) scale(1.08,.94)}100%{transform:scaleX(-1)}}
.fighter.left.hurt{animation:knockL .32s}.fighter.right.hurt{animation:knockR .32s}
@keyframes knockL{0%,100%{transform:translateX(0)}30%{transform:translateX(-15px)}65%{transform:translateX(6px)}}
@keyframes knockR{0%,100%{transform:translateX(0)}30%{transform:translateX(15px)}65%{transform:translateX(-6px)}}
.fighter.dodge img{animation:dodgeA .42s ease-out}
.fighter.right.dodge img{--flip:scaleX(-1)}
@keyframes dodgeA{0%,100%{transform:var(--flip,none)}40%{transform:var(--flip,none) translateX(-30px) translateY(-14px) rotate(-10deg)}}
.fighter.charge img{animation:chargeA .52s ease-in-out}
.fighter.right.charge img{--flip:scaleX(-1)}
@keyframes chargeA{0%,100%{transform:var(--flip,none)}50%{transform:var(--flip,none) scale(1.06) translateY(-4px);filter:drop-shadow(0 0 12px #c9a2ff) brightness(1.35)}}
.fighter.cheer .shd{animation:shdJump .6s ease-in-out infinite}
@keyframes shdJump{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.7);opacity:.5}}

/* ---------- hit and move effects ---------- */
.sayb{position:absolute;padding:6px 8px;background:#fff;color:#0e1726;border:2px solid #0e1726;border-radius:10px;
  font:10px 'Press Start 2P',monospace;white-space:nowrap;pointer-events:none;animation:sayPop .95s ease-out forwards}
.sayb::after{content:"";position:absolute;left:14px;bottom:-8px;border:6px solid transparent;border-top-color:#0e1726;border-bottom:0}
.sayb.r::after{left:auto;right:14px}
@keyframes sayPop{0%{opacity:0;transform:scale(.5) translateY(6px)}15%{opacity:1;transform:scale(1.12)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.wflash{position:absolute;inset:0;background:#fff;pointer-events:none;animation:wf .24s ease-out forwards}
@keyframes wf{from{opacity:.7}to{opacity:0}}
.stage.shake2{animation:stageShake2 .42s}
@keyframes stageShake2{0%,100%{transform:translate(0,0)}15%{transform:translate(-10px,5px)}30%{transform:translate(9px,-6px)}50%{transform:translate(-6px,4px)}70%{transform:translate(4px,-2px)}85%{transform:translate(-2px,1px)}}
.dizzy{position:absolute;left:50%;top:26%;width:0;height:0;pointer-events:none}
.dizzy b{position:absolute;left:-9px;top:-9px;width:18px;height:18px;background:#ffd54a;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  filter:drop-shadow(0 0 3px #fff);animation:orbit 1.3s linear infinite}
.dizzy b:nth-child(2){animation-delay:-.433s}.dizzy b:nth-child(3){animation-delay:-.866s}
@keyframes orbit{from{transform:rotate(0) translateX(34px) rotate(0)}to{transform:rotate(360deg) translateX(34px) rotate(-360deg)}}

@media(max-width:560px){.pennants{top:84px;height:24px}.flood{top:6px;width:24px}.fighter .shd{width:84px;margin-left:-42px;height:11px}.neon{font-size:9px;top:66px}
  .spot{width:110px}.th-club .mat{width:110px;margin-left:-55px}}
@media(prefers-reduced-motion:reduce){
  .stage .rays,.stage .cloud,.stage .bird,.stage .bird::before,.stage .bird::after,.stage .tuft,.stage .flower,.stage .bfly,
  .stage .pen,.stage .crowd,.stage .flood,.stage .spot,.stage .neon,.fighter img,.fighter .shd,.stage.frenzy::after,.dizzy b{animation:none!important}
  .stage .bird,.stage .bfly{display:none}
}

/* ---------- bite, signature moves, Mythic/Legendary auras ---------- */
.chomp{position:absolute;width:96px;height:76px;margin:-38px 0 0 -48px;pointer-events:none;overflow:visible;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.3));animation:chompOut .66s ease-out forwards}
.chomp.big{transform:scale(1.15)}
.chomp .up{animation:jawUp .26s cubic-bezier(.6,0,.9,.4) forwards}
.chomp .lo{animation:jawLo .26s cubic-bezier(.6,0,.9,.4) forwards}
@keyframes jawUp{0%{transform:translateY(-24px) rotate(-5deg)}80%{transform:translateY(3px)}100%{transform:translateY(0)}}
@keyframes jawLo{0%{transform:translateY(24px) rotate(5deg)}80%{transform:translateY(-3px)}100%{transform:translateY(0)}}
@keyframes chompOut{0%{opacity:0}8%{opacity:1}40%{transform:scale(1)}48%{transform:translate(2px,-1px) scale(1.04)}56%{transform:translate(-2px,1px)}70%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
.chomp.big{animation-name:chompOutBig}
@keyframes chompOutBig{0%{opacity:0;transform:scale(1.15)}8%{opacity:1}48%{transform:translate(3px,-2px) scale(1.2)}56%{transform:translate(-3px,2px) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:scale(1.28)}}
.bitemark{position:absolute;width:60px;height:40px;margin:-20px 0 0 -30px;pointer-events:none;animation:bmFade 1s ease-out forwards}
.bitemark.big{transform:scale(1.3)}
@keyframes bmFade{0%,30%{opacity:0}45%{opacity:.85}75%{opacity:.6}100%{opacity:0}}
.comic{position:absolute;font:13px 'Press Start 2P',monospace;color:#fff;white-space:nowrap;pointer-events:none;

.hud{position:absolute;top:8px;width:42%;padding:0 8px}
.hud.l{left:8px}.hud.r{right:8px}

.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

  repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 14px,transparent 14px 28px),

.tabs{display:flex;gap:6px}

.h3{font-family:'Press Start 2P',monospace;font-size:9px;margin:0 0 9px;color:var(--ink2);letter-spacing:.5px}

  maxLevel: 10,
  need: l => 60 + (l - 1) * 45,                 // xp to reach the next level
  perks: {
    2: {id:'energy',  txt:'+1 starting energy'},
    4: {id:'hp2',     txt:'+2 max health'},
    6: {id:'wind',    txt:'Second Wind — heal 3 once, when you drop below a quarter'},
    8: {id:'hp2b',    txt:'+2 max health'},
    10:{id:'cheap',   txt:'Abilities cost 1 less'}
  },
  // bond paths: at 4 and 8 the trainer picks one of two perks for each dog ('a' = the classic one, the default)
  alt: {
    4: {id:'snap',  txt:'Iron Guard — a guard snaps back for 3 instead of 2'},
    8: {id:'swift', txt:'Quick Start — +1 starting energy'}
  }
};
/* A piece carries eight traits, one per layer. If all eight fired, a fight would
   be a spreadsheet. Only the three rarest become the kit, and at most one of
   those may be an active ability — so rarity of the individual traits decides
   how a piece plays, not just its rarity tier. */
const KIT_SLOTS = 3, KIT_ACTIVES = 1;
function kitFrom(ids){
  const all = ids.map(i => T[i]).filter(Boolean)
                 .sort((a,b) => (a.pieces||9999) - (b.pieces||9999));
  const kit = [];
  let actives = 0;
  for (const t of all){
    if (kit.length >= KIT_SLOTS) break;
    if (t.kind === 'active'){
      if (actives >= KIT_ACTIVES) continue;     // rarer active already took the slot
      actives++;
    }
    kit.push(t);
  }
  return kit;
}
const perksAt = (l, path) => Object.entries(BOND.perks).filter(([k]) => +k <= l)
  .map(([k, v]) => path && path[k] === 'b' && BOND.alt[k] ? BOND.alt[k] : v);
const hasPerk = (l, id, path) => perksAt(l, path).some(p => p.id === id);
//@/engine

const SAVE = (() => {
  let KEY = 'ba_save_v1';
  const fresh = () => ({v:1, dogs:{}, trainerXp:0, streak:0, best:0, day:'', quests:[], fights:0,
    tickets:5, pack:null, pending:null, week:'', wk:{wins:0, xp:0, streak:0}, lastWk:{wins:0, xp:0, streak:0},
    arena:{squad:[], signed:'', best:0, runs:0, last:null}, club:{w:0,l:0,d:0,dog:null}, today:null});
  /* What happened today, for the daily recap. */
  const freshToday = day => ({day, ranked:0, wins:0, losses:0, xp:0, questXp:0, levels:[], arenas:[], shown:false});
  let d;
  function load(from){
    try { d = from || JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch(e){ d = fresh(); }
    if (!d || d.v !== 1) d = fresh();
    if (!d.arena) d.arena = {squad:[], signed:'', best:0, runs:0, last:null};
    if (!d.club) d.club = {w:0,l:0,d:0,dog:null};
    if (d.wk && d.streak > d.best) d.streak = d.best;   // casual wins used to inflate the live streak
  }
  load();
  // `auto` saves (day and week roll-overs) are not progress: they must not make a
  // stale device look newer than the server when syncing
  function save(auto){
    if (!auto) d.updatedAt = Date.now();               // newest progress wins when syncing with the server
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){}
    if (typeof cloudQueue === 'function') cloudQueue();
  }
  function dog(id){ if (!d.dogs[id]) d.dogs[id] = {xp:0, lvl:1, w:0, l:0}; return d.dogs[id]; }
  function today(){ return new Date().toISOString().slice(0,10); }
  function weekOf(d){
    const t = new Date(d || Date.now());
    const day = (t.getUTCDay() + 6) % 7;                 // Monday = 0
    t.setUTCDate(t.getUTCDate() - day);
    return t.toISOString().slice(0,10);
  }
  const TICKET_BASE = 5, TICKET_MAX_DAY = 10, BANK_MAX = 15;
  const QUESTS = [
    {id:'w2', txt:'Win 2 fights',                   goal:2, xp:60},
    {id:'big',txt:'Land a hit of 8 or more',        goal:1, xp:40},
    {id:'abil',txt:'Use 3 trait abilities',         goal:3, xp:40},
    {id:'f3', txt:'Fight 3 times',                  goal:3, xp:30}
  ];
  function rollQuests(){
    const pick = QUESTS.slice().sort(()=>Math.random()-.5).slice(0,3);
    d.quests = pick.map(q => ({...q, n:0, got:false}));
  }
  /* One streak for the whole game: consecutive wins in fights that count
     (ranked fights and live arena fights). Casual fights and ghosts don't touch it. */
  function streakAfter(win){
    if (win){ d.streak++; d.best = Math.max(d.best, d.streak); d.wk.streak = Math.max(d.wk.streak, d.streak); }
    else d.streak = 0;
  }
  function dailyGrant(){
    const owned = Object.keys(d.dogs).length || 1;
    return Math.min(TICKET_MAX_DAY, TICKET_BASE + Math.max(0, owned - 1));
  }
  function checkDay(){
    const t = today(), w = weekOf();
    let newWeek = false;
    if (d.week !== w){
      newWeek = true;
      // only the week that just ended counts as "last week"; a skipped week means nothing to carry
      d.lastWk = (d.week === weekOf(Date.now() - 7*864e5) && d.wk) || {wins:0,xp:0,streak:0};
      d.wk = {wins:0, losses:0, xp:0, streak:0};
      if (d.pending){ d.pack = d.pending === '-' ? null : d.pending; d.pending = null; }   // moves (and leaving) land Monday
      d.week = w;
    }
    if (d.day !== t){
      const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
      const missed = d.day && d.day !== y;
      if (missed) d.streak = 0;                          // missed a day → streak goes
      // unused tickets bank into the next day, but never into a new week: Monday starts at the plain daily grant.
      // A brand-new save (no day yet) keeps its 5 starting tickets on top of the first grant.
      const first = !d.day;
      d.tickets = first ? Math.min(BANK_MAX, TICKET_BASE + dailyGrant())
                : newWeek ? dailyGrant() : Math.min(BANK_MAX, (d.tickets||0) + dailyGrant());
      d.grantDay = {day: t, n: dailyGrant()};
      d.day = t; rollQuests(); save(true);
    }
    if (!d.today || d.today.day !== t){ d.today = freshToday(t); save(true); }
  }
  /* The day's grant is set before the wallet is read, so a holder's dogs may not be known yet (a new player,
     a new device): once the kennel is loaded, the grant is topped up to what the dogs really allow. */
  function registerDogs(ids){
    const t = today(), before = dailyGrant();
    if (!d.grantDay || d.grantDay.day !== t) d.grantDay = {day: t, n: before};
    for (const id of ids) dog(id);
    const extra = dailyGrant() - d.grantDay.n;
    if (extra > 0 && d.day === t){ d.tickets = Math.min(BANK_MAX, (d.tickets||0) + extra); d.grantDay.n += extra; save(true); return extra; }
    return 0;
  }
  checkDay();
  return {
    get data(){ return d; },
    registerDogs,
    useAccount(a){ KEY = a ? 'ba_save_v1:' + a : 'ba_save_v1'; load(); checkDay(); },
    // take a save from the server as it is (keeps its own updatedAt)
    adopt(data){ load(data); try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} checkDay(); },
    dog, save, checkDay, weekOf, dailyGrant,
    grant(){ return dailyGrant(); },
    spend(){ if ((d.tickets||0) <= 0) return false; d.tickets--; save(); return true; },
    // First pack is immediate; after that a move is queued to the next Monday,
    // so nobody hops into whichever pack is about to collect a bonus.
    today,
    toggleSquad(id){
      const q = d.arena.squad, i = q.indexOf(id);
      if (i >= 0) q.splice(i,1); else if (q.length < 3) q.push(id);
      save();
      if (typeof arenaRegister === 'function') arenaRegister();
    },
    signUp(on){ d.arena.signed = on ? today() : ''; save(); },
    // bond XP a dog earned defending in other players' arenas (not trainer XP, not the ladder)
    bondXp(id, xp){
      const g = dog(id), levels = [];
      g.xp += xp;
      while (g.lvl < BOND.maxLevel && g.xp >= BOND.need(g.lvl)){ g.xp -= BOND.need(g.lvl); g.lvl++; levels.push(g.lvl); }
      if (g.lvl >= BOND.maxLevel) g.xp = Math.min(g.xp, BOND.need(g.lvl));
      save(); return levels;
    },
    // a borrowed dog shows the bond it has in its owner's kennel
    setBond(id, lvl, xp){ const g = dog(id); g.lvl = Math.max(1, Math.min(BOND.maxLevel, lvl|0 || 1)); g.xp = Math.max(0, xp|0); save(true); },
    // trainer XP from lending (25 % of what a borrower earned with your dog)
    trainerAdd(n){ d.trainerXp += Math.max(0, n|0); save(); },
    signedToday(){ return d.arena.signed === today(); },
    // one arena per UTC day; it counts as used the moment it starts, so quitting mid-bracket can't reroll it
    // tournaments started today; one counts the moment it starts, so quitting mid-bracket can't reroll it
    arenaRunsToday(){ return d.arena.day === today() ? (d.arena.dayRuns ?? 1) : 0; },   // ?? 1: used under the old one-a-day rule
    arenaUse(){ const n = this.arenaRunsToday(); d.arena.day = today(); d.arena.dayRuns = n + 1; save(); },
    clubResult(r){ d.club[r] = (d.club[r]||0) + 1; save(); },
    clubDog(id){ d.club.dog = id; save(); },
    arenaDone(r){ d.arena.runs++; d.arena.best = Math.max(d.arena.best, r.won); d.arena.last = r;
      // each arena fight won counts once for the wins board; only fights you fought yourself touch the streak
      d.wk.wins += r.won; d.wk.losses = (d.wk.losses||0) + r.lines.filter(l => !l.w).length;
      if (r.live) r.lines.forEach(l => streakAfter(l.w));
      if (typeof postStats === 'function') postStats(d.wk);
      if (d.today) (d.today.arenas = d.today.arenas || []).push({won:r.won, xp:r.xp, live:r.live});
      save(); },
    // the day is done: every ranked fight used and today's arena fought
    // done for the day: no tickets left and all three tournaments used — counted when they start,
    // so one left mid-bracket (or played before this rule) still counts
    arenaDoneToday(){ return Math.max(this.arenaRunsToday(), (d.today && d.today.arenas || []).length); },
    dayComplete(){ return !!d.today && (d.tickets||0) <= 0 && this.arenaDoneToday() >= ARENA_RUNS && !(typeof arenaRun !== 'undefined' && arenaRun && !arenaRun.done); },
    recapShown(){ if (d.today){ d.today.shown = true; save(); } },
    weekRecapSeen(wk){ d.recapWeek = wk; save(); },
    // one pack a week: joining with no pack is instant and locks the week; after that
    // a switch or leaving is only queued for Monday ('-' = leave on Monday)
    packLocked(){ return !!d.pack || d.packLock === weekOf(); },
    joinPack(id){
      if (!this.packLocked()){ d.pack = id; d.pending = null; d.packLock = weekOf(); }
      else d.pending = d.pack === id ? null : id;
      save();
    },
    cancelMove(){ d.pending = null; save(); },
    leavePack(){ if (d.pack) d.pending = '-'; save(); },
    setPack(pack, pending, locked){ d.pack = pack || null; d.pending = pending || null; if (locked) d.packLock = weekOf(); save(); },
    trainerLvl(){ return 1 + Math.floor(d.trainerXp / 250); },
    trainerInto(){ return d.trainerXp % 250; },
    bump(qid, n){
      let paid = 0;
      (d.quests||[]).forEach(q => {
        if (q.id !== qid || q.got) return;
        q.n = Math.min(q.goal, q.n + (n||1));
        if (q.n >= q.goal){ q.got = true; d.trainerXp += q.xp; paid += q.xp; }
      });
      if (paid && d.today) d.today.questXp += paid;
      if (paid) save();
      return paid;
    },
    award(id, win, xp, ranked, fromArena){
      const g = dog(id), out = {xp, levels:[], before:g.lvl};
      const T = d.today;
      if (T && ranked){
        T.xp += xp;
        if (!fromArena){ T.ranked++; win ? T.wins++ : T.losses++; }
      }
      if (!ranked) { out.xp = 0; return out; }            // casual: no XP, and the streak is left alone
      g.xp += xp; d.trainerXp += Math.round(xp/2); d.wk.xp += xp;
      if (typeof lendGain === 'function') lendGain(id, xp);          // a borrowed dog: its owner's share
      // Arena XP is shared across the squad; its wins and streak are booked per fight in arenaDone.
      if (!fromArena){ d.fights++; win ? d.wk.wins++ : (d.wk.losses = (d.wk.losses||0) + 1); win ? g.w++ : g.l++; }
      while (g.lvl < BOND.maxLevel && g.xp >= BOND.need(g.lvl)){
        g.xp -= BOND.need(g.lvl); g.lvl++;
        out.levels.push(g.lvl);
        if (T) T.levels.push({id, lvl:g.lvl});
      }
      if (!fromArena) streakAfter(win);
      save();
      if (typeof postStats === 'function') postStats(d.wk);
      return out;
    },
    reset(){ d = fresh(); rollQuests(); d.day = today(); save(); }
  };
})();


/* ============================ packs & ladder ============================ */
const PACKS = [
  {id:'ledger', name:'Ledger Hounds', emoji:'⛓️'},
  {id:'moon',   name:'Moon Diggers',  emoji:'🌙'},
  {id:'bone',   name:'Bone Collectors',emoji:'🦴'},
  {id:'static', name:'Static Pack',   emoji:'⚡'}
];
const PACK_MAX = 10;
const BONUS = {
  fang:  {name:'Fang',   emoji:'🦷', txt:'+1 bite damage',            board:'wins'},
  hide:  {name:'Hide',   emoji:'🛡️', txt:'bites against you hit 1 softer', board:'xp'},
  spirit:{name:'Spirit', emoji:'✨', txt:'+1 starting energy',        board:'streak'}
};

/* Deterministic demo rivals — the same all week, different next week.
   In the live version these rows come from the Worker, not from here. */
function seeded(str){ let h=2166136261; for(const c of str) h=Math.imul(h^c.charCodeAt(0),16777619); 
  return () => (h = Math.imul(h ^ (h>>>15), 2246822507) ^ Math.imul(h ^ (h>>>13), 3266489909), ((h>>>0)%1000)/1000); }

/* Signed in, the standings are real: the server sums every member's week.
   PACKDATA holds this week and the eight before it (the bonus history). */
let PACKDATA = null;
const packsLive = () => LIVE() && !!WALLET.token && !WALLET.demo;
function standings(weekKey){
  if (packsLive()){
    const src = (PACKDATA && PACKDATA.weeks[weekKey]) || [];
    const you = SAVE.data.pack;
    return PACKS.map(p => {
      const r = src.find(x => x.id === p.id) || {members:0, wins:0, losses:0, xp:0, streak:0};
      const n = r.members || 0;
      return {...p, members:n, wins:r.wins, losses:r.losses || 0, xp:r.xp, streak:r.streak, you: p.id === you,
              avgW: n ? r.wins/n : 0, avgX: n ? r.xp/n : 0};
    });
  }
  const r = seeded('bark'+weekKey);
  const rows = PACKS.map(p => {
    const members = 4 + Math.floor(r()*6);
    return {...p, members,
      wins:   Math.round(40 + r()*70),
      xp:     Math.round(1400 + r()*2600),
      streak: 3 + Math.floor(r()*9)};
  });
  const you = SAVE.data.pack;
  if (you){                                     // fold the player into their pack
    const w = SAVE.data.lastWk || {wins:0,xp:0,streak:0};
    const p = rows.find(x => x.id === you);
    if (p){ p.members = Math.min(PACK_MAX, p.members+1); p.wins += w.wins; p.xp += w.xp; p.streak = Math.max(p.streak, w.streak); p.you = true; }
  }
  rows.forEach(p => { p.avgW = p.wins/p.members; p.avgX = p.xp/p.members; if (p.losses == null) p.losses = Math.round(p.wins * .8); });
  return rows;
}

/* One bonus per pack: a pack topping two boards keeps the first and the
   runner-up inherits the second. Without this the leader snowballs.

   On top of that, holding a bonus gets harder every week: defending needs a
   margin over the runner-up (10%, then 20%), and after three weeks straight
   the holder is barred from that board entirely. A pack can dominate for two
   or three weeks if it is genuinely ahead — never forever. */
const DEFEND = [0, 0.10, 0.20];      // margin needed at hold 1, 2; index 3+ = barred
const MAX_HOLD = 3;
let _awCache = {};

function awardsAt(weekKey, back){
  if (_awCache[weekKey]) return _awCache[weekKey];
  back = back == null ? 8 : back;
  const prevKey = new Date(Date.parse(weekKey) - 7*864e5).toISOString().slice(0,10);
  const prev = back > 0 ? awardsAt(prevKey, back - 1) : {win:{}, hold:{}};

  const rows = standings(weekKey), taken = {}, win = {}, hold = {};
  const boards = [
    ['fang',   p => p.avgW],
    ['hide',   p => p.avgX],
    ['spirit', p => p.streak]
  ];
  for (const [key, val] of boards){
    const inc = prev.win[key], held = inc ? (prev.hold[key] || 1) : 0;
    let pool = rows.filter(p => !taken[p.id]);
    if (inc && held >= MAX_HOLD) pool = pool.filter(p => p.id !== inc);   // barred after 3
    pool = pool.sort((a,b) => val(b) - val(a));
    let w = pool[0];
    if (w && inc && w.id === inc && held >= 1 && held < MAX_HOLD){
      const need = DEFEND[Math.min(held, DEFEND.length - 1)];
      const second = pool[1];
      if (second && val(w) < val(second) * (1 + need)) w = second;        // not clear enough
    }
    if (w && !(val(w) > 0)) w = null;                   // an empty board crowns nobody
    if (w){ taken[w.id] = true; win[key] = w.id; hold[key] = (inc === w.id) ? held + 1 : 1; }
  }
  const out = {win, hold};
  _awCache[weekKey] = out;
  return out;
}
const awards = wk => awardsAt(wk).win;
const holdOf = (wk, key) => awardsAt(wk).hold[key] || 0;

async function loadPacks(){
  if (!packsLive()) return;
  try {
    const r = await api('/packs'); const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'packs');
    applyPacks(j);
  } catch(e){ console.warn('packs', e); }
}
let packMigrated = false;
function applyPacks(j){
  PACKDATA = j; _awCache = {};
  // A pack joined before packs went live exists only in this browser: hand it to the server once.
  if (j.me && !j.me.pack && !j.me.pending && SAVE.data.pack && !packMigrated){
    packMigrated = true; packAction('join', SAVE.data.pack); return;
  }
  if (j.me) SAVE.setPack(j.me.pack, j.me.pending, j.me.locked);     // the server's word on membership
  if (tab === 'packs') menu();
}
async function packAction(action, id){
  if (!packsLive()){
    action === 'join' ? SAVE.joinPack(id) : action === 'leave' ? SAVE.leavePack() : SAVE.cancelMove();
    menu(); return;
  }
  try {
    const r = await api('/pack', {method:'POST', body:{action, id}}); const j = await r.json();
    if (!r.ok) throw new Error(j.error === 'pack_full' ? 'That pack is full.' : (j.error || 'pack'));
    applyPacks(j);
    achScan();
  } catch(e){ alert(e.message); }
  menu();
}

function myBonus(){
  const me = SAVE.data.pack; if (!me) return null;
  const lastWeek = SAVE.weekOf(Date.now() - 7*864e5);
  const a = awards(lastWeek);
  const key = Object.keys(a).find(k => a[k] === me);
  return key ? {key, ...BONUS[key]} : null;
}

/* ============================ engine ============================ */
//@engine  (shared with the server: server.js runs these sections for Fight Club — keep them free of DOM/UI)
const LEG  = DATA.legendaries || {};
const SETS = DATA.sets || {};

/* The kit a piece fights with: a legendary's hand-built signature kit, or the
   three rarest of a generative piece's traits. */
function kitOf(def){
  if (def.legendary && LEG[def.legendary]) return LEG[def.legendary].kit.map(t => ({...t}));
  return kitFrom(def.traits || []);
}
/* Theme sets add a fourth slot on top of the kit. */
function setBonus(def){
  const s = def.set && SETS[def.set]; if (!s) return null;
  const tier = def.setMatch >= 8 && s['8'] ? '8' : (def.setMatch >= 4 && s['4'] ? '4' : (def.setMatch >= 3 && s['3'] ? '3' : null));
  if (!tier) return null;
  return { name: def.set, tier, text: s.text[tier],
           passives: s[tier].map(p => ({...p, kind:'passive', id:'set-'+p.effect, value:'Set: '+def.set})) };
}

function build(def, lvl, bonus, path){
  lvl = lvl || 1;
  path = path && typeof path === 'object' ? path : null;
  let hp = C.base_hp + (C.rarity_hp_bonus[def.rarity]||0);
  if (hasPerk(lvl,'hp2',path)) hp += 2;
  if (hasPerk(lvl,'hp2b',path)) hp += 2;
  let en = C.start_energy;
  if (hasPerk(lvl,'energy',path)) en += 1;
  if (hasPerk(lvl,'swift',path)) en += 1;
  const cheap = hasPerk(lvl,'cheap',path);
  const ts = kitOf(def).map(t => cheap && t.kind==='active' ? {...t, cost: Math.max(1, t.cost-1)} : t);
  const sb = setBonus(def);
  const passives = ts.filter(t => t.kind==='passive').concat(sb ? sb.passives : []);
  for (const t of passives){
    if (t.effect === 'vitality')     hp += t.amount;
    if (t.effect === 'start_energy') en += t.amount;
  }
  if (bonus && bonus.key === 'spirit') en += 1;
  return {def, lvl, hp, maxHp:hp, energy:en, set: sb,
          fang: !!(bonus && bonus.key==='fang'), hide: !!(bonus && bonus.key==='hide'),
          actives: ts.filter(t => t.kind==='active'), passives,
          wind: hasPerk(lvl,'wind',path), snap: hasPerk(lvl,'snap',path), phoenix: passives.some(p => p.effect==='phoenix'),
          hexed:false, hexTurns:0, counter:false, shield:0, hold:false,
          run:0, extra:0, boon:0, seen:{bite:0, guard:0, taunt:0}, hist:[], idle:0};
}
const has = (f,e) => f.passives.find(p => p.effect === e);
const amt = (f,e) => f.passives.reduce((n,p) => n + (p.effect===e ? (p.amount||0) : 0), 0);
// two 10% dodges are 19%, not 20% — combine, don't add
const chc = (f,e) => 1 - f.passives.reduce((n,p) => n * (p.effect===e ? 1-(p.chance||0) : 1), 1);
const immuneHex   = f => !!(has(f,'pure'));
const immuneDrain = f => !!(has(f,'pure') || has(f,'unbreakable'));
const sideOf = f => f === P ? 'l' : 'r';
const frenzy = () => Math.max(0, turn - (C.frenzy_from || 99) + 1);
function say(h){ log.push(h); }
function push(o){ ev.push(o); }

/* Every point of damage in the game goes through here, so shields, dodges,
   absorb, phoenix and second wind all behave the same whatever caused the hit. */
function damage(f, n, txt, kind, opt){
  opt = opt || {};
  if (f.hold){ say(`${txt} <b>${n}</b> — he doesn't move. <b>Held.</b>`); push({t:'float',who:sideOf(f),cls:'missN',txt:'HELD'}); return 0; }
  if (!opt.sure){
    const dg = chc(f,'dodge');
    if (dg > 0 && Math.random() < dg){ say(`${txt} <b>${n}</b> — <b>dodged</b>.`); push({t:'float',who:sideOf(f),cls:'missN',txt:'DODGE'}); return 0; }
  }
  if (f.shield > 0){
    const soak = Math.min(f.shield, n); f.shield -= soak; n -= soak;
    push({t:'float',who:sideOf(f),cls:'missN',txt:'-'+soak+' SHIELD'});
    if (n <= 0){ say(`${txt} — the shield takes all of it.`); return 0; }
  }
  if (has(f,'absorb') && Math.random() < .20){
    f.hp = Math.min(f.maxHp, f.hp + n);
    say(`${txt} <b>${n}</b> — the void <b>swallows it</b> and he heals.`);
    push({t:'float',who:sideOf(f),cls:'healN',txt:'+'+n}); return 0;
  }
  f.hp = Math.max(0, f.hp - n);
  say(`${txt} <b>${n}</b>.`);
  push({t:'hit',who:sideOf(f),n,kind:kind||'', hp:{l:P.hp,r:E.hp}});
  if (f.hp <= 0 && f.phoenix){
    f.phoenix = false; f.hp = 1; f.extra += 2;
    say(`&nbsp;&nbsp;↳ <b>Phoenix</b> — burned down, back at 1, and hotter.`);
    push({t:'float',who:sideOf(f),cls:'healN',txt:'PHOENIX'});
  }
  if (f.wind && f.hp > 0 && f.hp < f.maxHp*0.25){
    f.wind = false; f.hp = Math.min(f.maxHp, f.hp + 3);
    say(`&nbsp;&nbsp;↳ <b>Second Wind</b> — back up, +3.`);
    push({t:'float',who:sideOf(f),cls:'healN',txt:'SECOND WIND'});
  }
  return n;
}
function heal(f,n,txt){ if(n<=0)return; f.hp=Math.min(f.maxHp,f.hp+n); say(txt); push({t:'float',who:sideOf(f),cls:'healN',txt:'+'+n,hp:{l:P.hp,r:E.hp}}); }
function steal(f, g, n, who){
  if (immuneDrain(g)){ say(`${who} reaches for energy — it won't budge.`); return 0; }
  n = Math.min(n, g.energy); g.energy -= n; f.energy = Math.min(9, f.energy + n);
  if (n) push({t:'float',who:sideOf(f),cls:'enN',txt:'+'+n+'◆'});
  return n;
}

/* One bite, start to finish. Used by the Bite move and by Double Team. */
function bite(f, g, ga, who, base){
  if (Math.random() < C.bite.miss_chance){ say(`${who} bites — and <b>misses</b>.`); push({t:'float',who:sideOf(g),cls:'missN',txt:'MISS'}); f.run = 0; return; }
  if (g.counter){ damage(f,6,`${who} bites into the counter and takes`,'counter'); g.counter=false; f.run=0; return; }
  if (has(g,'reflect') && Math.random() < chc(g,'reflect')){ damage(f, amt(g,'reflect'), `${who} bites — <b>caught</b>, and takes`, 'counter'); f.run=0; return; }
  if (ga.type==='guard' && !g.hexFail){
    // guard beats bite: the bite is blocked AND the guard snaps back, as a taunt chips through a guard
    say(`${who} bites — <b>blocked</b>.`); push({t:'float',who:sideOf(g),cls:'missN',txt:'BLOCK'}); f.run=0;
    damage(f, (C.guard.snap_vs_bite ?? 2) + (g.snap ? 1 : 0), `&nbsp;&nbsp;↳ the guard snaps back for`, 'counter');
    return;
  }

  let dmg = base != null ? base : rint(C.bite.min, C.bite.max);
  if (ga.type==='taunt') dmg += C.bite.bonus_vs_taunt;
  for (const p of f.passives)
    if (p.effect==='underdog' && f.hp < f.maxHp*(p.threshold||.5)) dmg += p.amount;
  dmg += amt(f,'power') + f.extra + frenzy();
  if (has(f,'rage'))     dmg += Math.floor((f.maxHp - f.hp) / 5);
  if (has(f,'momentum')) dmg += f.run;
  if (f.boon){ dmg += f.boon; f.boon = 0; }
  let crit = false;
  const cc = chc(f,'crit');
  if (cc > 0 && !has(g,'unbreakable') && Math.random() < cc){ dmg *= 2; crit = true; }
  if (f.fang) dmg += 1;
  if (g.hide) dmg -= 1;
  dmg = Math.max(1, dmg - amt(g,'armor'));

  const hits = has(f,'twin') ? [Math.max(1, Math.round(dmg*.55)), Math.max(1, Math.round(dmg*.55))] : [dmg];
  let landed = 0;
  hits.forEach((h,i) => {
    const t = hits.length > 1 ? `${who}${i ? ' — and the other one —' : ''} bites${crit?' — <b>CRIT</b>':''} for`
                              : `${who} bites${crit?' — <b>CRIT</b>':''} for`;
    landed += damage(g, h, t, crit ? 'big' : 'bite');
  });
  if (crit) push({t:'float',who:sideOf(g),cls:'dmgN',txt:'CRIT!'});
  if (!landed){ f.run = 0; return; }
  f.run++;
  if (f===P && landed>=8 && !simulating && !clubMode) SAVE.bump('big');
  const th = amt(g,'thorns');
  if (th && f.hp>0) damage(f, th, `&nbsp;&nbsp;↳ the spikes bite back for`, 'counter');
  const ls = amt(f,'lifesteal');
  if (ls && f.hp>0) heal(f, ls, `&nbsp;&nbsp;↳ drinks it in — heals ${ls}.`);
  if (has(f,'plunder') && g.energy > 0 && !immuneDrain(g)){ steal(f, g, 1, who); say(`&nbsp;&nbsp;↳ plunders 1 energy.`); }
}

/* Ability damage lands through here so Refract can bounce any of it. */
function blast(f, g, n, who, ab, opt){
  if (has(g,'refract') && Math.random() < .35){
    say(`${who} uses <b>${esc(ab.value)}</b> — <b>refracted</b> straight back!`);
    push({t:'float',who:sideOf(g),cls:'missN',txt:'REFRACT'});
    return damage(f, n, `&nbsp;&nbsp;↳ it hits its own caster for`, 'big', opt);
  }
  return damage(g, n + frenzy(), `${who} uses <b>${esc(ab.value)}</b> for`, 'big', opt);
}

/* The opponent (v30). It reads your habits on three levels and learns:
   1. What you play next — from this fight (which move follows your last one
      or two) and from earlier fights (AIM, your style, kept in your save).
   2. Whether you play around it — it keeps score of three answers to that
      prediction: the plain counter, and the answers to someone who expects
      the counter (one and two steps further). The one that has been working
      wins. So "bait a pattern, then counter its counter" stops paying off.
   3. How hard to try — skill rises with your dog's bond level: a bond-10 dog
      meets an opponent that follows its reads more often, uses its ability
      at the right time and plays the score in the last rounds.
   It only ever looks at moves already played, never at the one you're
   choosing now (the Insight trait's 30 % peek aside). */
const COUNTER = {bite:'guard', guard:'taunt', taunt:'bite'};   // the move that beats the key
const MOVES = ['bite', 'guard', 'taunt'];
const rot = (m, s) => { for (let i = 0; i < s; i++) m = COUNTER[m]; return m; };
const wins = (a, b) => COUNTER[b] === a;
let AIM = null;                 // the player's style across fights (the page loads/saves it); null = no memory
let hist = {bite:0, guard:0, taunt:0}, plannedE = null, insightShown = false;
const aiSkill = foe => Math.min(1, .3 + .075 * ((foe.lvl || 1) - 1));   // bond 1 → .30, bond 10 → .975
function aimNew(){ return {v:1, n:0, t:{}, lv:[0,0,0]}; }
/* What the foe plays next, as weights per move. */
function predictFoe(f, sk){
  const h = f.hist || [], score = {bite:0, guard:0, taunt:0};
  const ctxMatch = k => {                      // what followed the same last-k moves before?
    if (h.length <= k) return;
    const ctx = h.slice(-k).join();
    for (let i = k; i < h.length; i++)
      if (h[i] in score && h.slice(i-k, i).join() === ctx) score[h[i]] += (k === 2 ? 3 : 2) * (1 + i / h.length);
  };
  ctxMatch(2); ctxMatch(1);
  for (const m of h) if (m in score) score[m] += .5;   // plain habit, weakly
  // the long memory: what this player tends to play after the same move (or to open with)
  if (AIM && sk != null){
    const row = AIM.t[h.length ? h[h.length-1] : '^'];
    if (row){
      const tot = MOVES.reduce((n, m) => n + (row[m] || 0), 0);
      if (tot >= 3) for (const m of MOVES) score[m] += 4 * sk * (row[m] || 0) / tot;
    }
  }
  const tot = score.bite + score.guard + score.taunt; if (!tot) return null;
  const move = MOVES.slice().sort((a,b) => score[b] - score[a])[0];
  return {move, conf: score[move] / tot};
}
/* After each round: learn from the move the foe actually played. */
function aiLearn(f, foe){
  const last = (f.hist || [])[f.hist.length - 1];
  if (f.read && last in COUNTER){
    f.lv = f.lv || [0, 0, 0];
    for (let s = 0; s < 3; s++){
      const m = rot(f.read, s + 1);
      f.lv[s] = f.lv[s] * .7 + (wins(m, last) ? 1 : wins(last, m) ? -1 : 0);
    }
  }
  f.read = null;
  if (AIM && foe === P && !simulating && f.lv) AIM.lv = f.lv.map(x => Math.round(x * 100) / 100);
  if (AIM && foe === P && !simulating && last){
    const prev = f.hist.length > 1 ? f.hist[f.hist.length-2] : '^';
    if (last in COUNTER){
      const row = AIM.t[prev] = AIM.t[prev] || {};
      for (const m of MOVES) row[m] = (row[m] || 0) * .97;            // recent habits count more
      row[last] = (row[last] || 0) + 1;
      AIM.n++;
    }
  }
}
function aiPickAbility(f, foe, pr, sk){
  const aff = f.actives.filter(a => a.cost <= f.energy);
  if (!aff.length) return null;
  const guardP = pr && pr.move === 'guard' ? pr.conf : .3, biteP = pr && pr.move === 'bite' ? pr.conf : .35;
  let best = null, bestV = 0;
  for (const a of aff){
    let v = .5;
    switch (a.effect){
      case 'damage': v = a.ignores_guard ? 1 : 1 - guardP * 1.6; break;
      case 'double': v = 1 - guardP * 1.6; break;
      case 'heal': case 'transmute': v = (f.maxHp - f.hp) >= (a.amount || 4) ? 1.1 : .1; break;
      case 'shield': case 'hold': case 'counter': v = .3 + biteP * 1.2 + (foe.energy >= 5 ? .3 : 0); break;
      case 'dip': v = (f.maxHp - f.hp) >= 6 ? 1 : .2; break;
      case 'splash': v = f.energy >= 5 ? 1 : .1; break;
      case 'drain': case 'crash': v = foe.energy >= 3 ? .9 : .3; break;
      case 'hex': case 'horizon': v = foe.energy >= 4 || foe.actives.some(x => x.cost <= foe.energy) ? .9 : .5; break;
      case 'energize': v = f.energy <= 3 ? .8 : .2; break;
    }
    if (v > bestV){ bestV = v; best = a; }
  }
  // the old opponent cast at random 35 % of the time; a skilled one casts when it pays
  return best && Math.random() < .25 + (.35 + .25 * sk) * Math.min(1, bestV) ? best : null;
}
function ai(f, foe, seen){
  if (!f.lv && AIM && foe === P && !simulating) f.lv = AIM.lv.map(x => x * .5);   // how this player played around it last time
  aiLearn(f, foe);
  const sk = aiSkill(foe);
  if (seen && has(f,'insight') && Math.random() < .30 && seen.type in COUNTER) return {type: COUNTER[seen.type]};
  const mem = !!AIM && foe === P && !simulating;            // the long memory is about the player only
  const pr = f.hist.length >= 2 || (mem && AIM.n >= 6) ? predictFoe(f, mem ? sk : null) : null;
  // which answer to the read has been working: counter it, or counter the counter-player
  let lvl = 0;
  if (f.lv) for (let s = 1; s < 3; s++) if (f.lv[s] > f.lv[lvl] + .2) lvl = s;
  if (pr && pr.conf > .5 - .12 * sk && Math.random() < Math.min(.55 + .35 * sk, pr.conf + .25 * sk)){
    f.read = pr.move;
    const m = rot(pr.move, lvl + 1);
    // a counter that is a bite may as well be the better hit, if one is ready
    if (m !== 'guard'){ const ab = aiPickAbility(f, foe, pr, sk); if (ab && Math.random() < sk * .5) return {type:'ability', a:ab}; }
    return {type: m};
  }
  if (pr) f.read = pr.move;
  const ab = aiPickAbility(f, foe, pr, sk);
  if (ab) return {type:'ability', a:ab};
  // the last rounds: play the score (the bell goes to the healthier dog, by % health)
  if (turn >= C.max_turns - 2 && Math.random() < sk){
    const lead = f.hp / f.maxHp - foe.hp / foe.maxHp;
    if (lead > .15) return {type: Math.random() < .6 ? 'guard' : 'taunt'};
    if (lead < -.05) return {type:'bite'};
  }
  // Two turns without landing anything and it stops being patient.
  if (f.idle >= 2 && Math.random() < .6) return {type:'bite'};
  // Otherwise a mix. Smelling blood it leans on bite, but never so hard that guarding is a sure thing.
  const w = {bite: foe.hp < 8 ? .6 : .45, guard: .33, taunt: .22};
  // a skilled one also reads the board: a loaded foe ability gets a guard, an empty tank a taunt
  if (foe.actives.some(a => a.cost <= foe.energy && (a.effect === 'damage' || a.effect === 'double') && !a.ignores_guard)) w.guard += .35 * sk;
  if (f.actives.some(a => a.cost > f.energy && a.cost <= f.energy + 2)) w.taunt += .25 * sk;
  if (foe.energy <= 1) w.guard -= .15 * sk;
  let r = Math.random() * (w.bite + w.guard + w.taunt);
  for (const m of MOVES){ if ((r -= w[m]) < 0) return {type: m}; }
  return {type:'bite'};
}

function resolve(pa, ea){
  ev = [];
  if (pa.type in E.seen) E.seen[pa.type]++;
  if (ea.type in P.seen) P.seen[ea.type]++;
  E.hist.push(pa.type); P.hist.push(ea.type);        // the order of moves, for reading patterns
  const hp0 = {P: P.hp, E: E.hp};
  const acts = [[P,E,pa,LBL.P],[E,P,ea,LBL.E]];
  say(`<span class="turn">— Turn ${turn}${frenzy() ? ' · FRENZY +'+frenzy() : ''} —</span>`);
  push({t:'banner',txt: frenzy() ? 'FRENZY +'+frenzy() : 'ROUND '+turn});

  for (const [f,g] of acts){
    f.hexFail = false; f.hold = false;
    if (immuneHex(f)){ f.hexed = false; f.hexTurns = 0; continue; }
    if (f.hexTurns > 0){ f.hexFail = true; f.hexTurns--; continue; }
    if (f.hexed){ f.hexFail = Math.random() < .65; f.hexed = false; }
    const hx = chc(g,'hexaura');
    if (!f.hexFail && hx > 0 && Math.random() < hx) f.hexFail = true;
  }

  push({t:'moves', l:pa.type==='ability'?'ability':pa.type, r:ea.type==='ability'?'ability':ea.type});

  // defensive abilities resolve before anything lands
  for (const [f,,a,who] of acts){
    if (f.hexFail || a.type!=='ability') continue;
    const ab = a.a;
    if (ab.effect==='counter'){ f.energy-=ab.cost; f.counter=true; say(`${who} sets a <b>Fetch Counter</b>.`); a.done = true; }
    else if (ab.effect==='shield'){ f.energy-=ab.cost; f.shield += ab.amount; say(`${who} raises <b>${esc(ab.value)}</b> — ${ab.amount} shield.`); push({t:'shield',who:sideOf(f)}); a.done = true; }
    else if (ab.effect==='hold'){ f.energy-=ab.cost; f.hold = true; say(`${who} <b>holds</b>. Nothing gets through this turn.`); push({t:'shield',who:sideOf(f)}); a.done = true; }
  }

  for (const [f,,a,who] of acts){
    if (f.hexFail){ say(`${who} is <b>hexed</b> — the move fizzles.`); push({t:'float',who:sideOf(f),cls:'missN',txt:'HEXED'}); continue; }
    if (a.type==='guard'){ f.energy+=C.guard.energy; say(`${who} guards.`); push({t:'shield',who:sideOf(f)}); }
    else if (a.type==='taunt'){ f.energy+=C.taunt.energy; say(`${who} taunts.`); push({t:'float',who:sideOf(f),cls:'enN',txt:'+'+C.taunt.energy+'◆'}); }
  }

  for (const [f,g,a,who] of acts){
    if (f.hexFail || f.hp<=0) continue;
    const ga = (f===P ? ea : pa);
    const guarded = ga.type==='guard' && !g.hexFail;
    if (a.type==='bite') bite(f, g, ga, who);
    else if (a.type==='taunt' && guarded)
      damage(g, C.taunt.chip_vs_guard, `${who}'s taunt slips past the guard for`,'bite');
    else if (a.type==='ability' && !a.done){
      const ab = a.a;
      if (f===P && !simulating && !clubMode) SAVE.bump('abil');
      f.energy -= ab.cost;
      const fx = t => push({t, from:sideOf(f), to:sideOf(g)});
      switch (ab.effect){
        case 'damage': {
          fx(/laser/.test(ab.id) ? 'laser' : 'bolt');
          if (guarded && ab.fails_on_guard){ say(`${who} draws for <b>${esc(ab.value)}</b> — the guard is up. Nothing.`); push({t:'float',who:sideOf(g),cls:'missN',txt:'PARRIED'}); break; }
          if (guarded && !ab.ignores_guard){ say(`${who} uses <b>${esc(ab.value)}</b> — blocked.`); push({t:'float',who:sideOf(g),cls:'missN',txt:'BLOCK'}); break; }
          const d = blast(f, g, rint(ab.min,ab.max), who, ab, {sure: ab.sure});
          if (f===P && d>=8 && !simulating && !clubMode) SAVE.bump('big');
          if (ab.heal && f.hp>0) heal(f, ab.heal, `&nbsp;&nbsp;↳ the beam feeds him ${ab.heal}.`);
          if (ab.refund){ f.energy = Math.min(9, f.energy + ab.refund); push({t:'float',who:sideOf(f),cls:'enN',txt:'+'+ab.refund+'◆'}); }
          break; }
        case 'dip':    fx('bolt'); blast(f, g, 2 + Math.floor((f.maxHp - f.hp)/3), who, ab); break;
        case 'splash': { const n = Math.floor(f.energy * 1.5); f.energy = 0; fx('bolt');
                         if (n > 0) blast(f, g, n, who, ab); else say(`${who} splashes with an empty wallet.`); break; }
        case 'crash':  fx('bolt'); blast(f, g, ab.amount, who, ab); steal(f, g, 3, who); break;
        case 'rays':   fx('laser'); for (let i=0;i<ab.amount;i++) damage(g, 1, i ? '&nbsp;&nbsp;↳ another ray for' : `${who} splits the light — ray for`, 'bite'); break;
        case 'double': { const hits = [rint(4,7), rint(4,7)]; say(`${who} goes in <b>twice</b>.`);
                         hits.forEach(h => bite(f, g, ga, who, h)); break; }
        case 'heal':     heal(f, ab.amount, `${who} uses <b>${esc(ab.value)}</b> and heals ${ab.amount}.`); break;
        case 'energize': f.energy = Math.min(9, f.energy + ab.amount); say(`${who} pulls an <b>${esc(ab.value)}</b>: +${ab.amount} energy.`); push({t:'float',who:sideOf(f),cls:'enN',txt:'+'+ab.amount+'◆'}); break;
        case 'transmute':{ const n = steal(f, g, ab.amount, who); heal(f, n*3, `${who} <b>transmutes</b> ${n} energy into ${n*3} health.`); break; }
        case 'hex':    if (immuneHex(g)) say(`${who} casts <b>Hex</b> — it slides right off.`);
                       else { g.hexed = true; say(`${who} casts <b>Hex</b>.`); push({t:'float',who:sideOf(g),cls:'missN',txt:'HEX'}); } break;
        case 'horizon':if (immuneHex(g)) say(`${who} opens an <b>Event Horizon</b> — nothing to pull in.`);
                       else { g.hexTurns = 2; say(`${who} opens an <b>Event Horizon</b>. The next two moves are gone.`); push({t:'float',who:sideOf(g),cls:'missN',txt:'VOID'}); } break;
        case 'drain':  { const n = steal(f, g, ab.amount, who); if (n) say(`${who} glitches <b>${n}</b> energy away.`); break; }
      }
    }
  }

  for (const [f,g,,who] of acts){
    const b = amt(f,'burn');
    if (b && g.hp>0 && f.hp>0){ push({t:'burn',who:sideOf(g)}); damage(g, b, `${who} burns for`, 'burn', {sure:true}); }
    const rg = amt(f,'regen');
    if (rg && f.hp>0 && f.hp<f.maxHp) heal(f, rg, `${who} recovers ${rg}.`);
    if (has(f,'unstable') && f.hp>0){
      const r = rint(0,2);
      if (r===0){ f.energy = Math.min(9, f.energy+1); push({t:'float',who:sideOf(f),cls:'enN',txt:'+1◆'}); }
      else if (r===1) heal(f, 2, `${who} glitches back 2.`);
      else { f.boon = 2; push({t:'float',who:sideOf(f),cls:'enN',txt:'NEXT +2'}); }
    }
    const down = has(g,'downturn') ? 1 : 0;
    f.energy = Math.max(0, Math.min(9, f.energy + C.energy_per_turn + amt(f,'energy') - down));
    f.counter = false;
  }

  // did anybody actually get hurt this turn?
  P.idle = E.hp < hp0.E ? 0 : P.idle + 1;
  E.idle = P.hp < hp0.P ? 0 : E.idle + 1;
  if (P.hp<=0 || E.hp<=0 || turn>=C.max_turns) over = true;
  turn++;
  plannedE = null; insightShown = false;
}
function verdict(){
  if (P.hp<=0 && E.hp<=0) return 'DRAW';
  if (E.hp<=0) return 'YOU WIN';
  if (P.hp<=0) return 'YOU LOSE';
  const a=P.hp/P.maxHp, b=E.hp/E.maxHp;
  return a===b ? 'DRAW' : (a>b ? 'YOU WIN' : 'YOU LOSE');

}

/* ============================ sound ============================ */
const S = (() => {
  let ac = null, master = null, on = true;
  try { const v = localStorage.getItem('ba_sound'); if (v === '0') on = false; } catch(e){}
  function ctx(){
    if (!ac){
      const A = window.AudioContext || window.webkitAudioContext;
      if (!A) return null;
      ac = new A();
      master = ac.createGain(); master.gain.value = .3; master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function env(g, t, a, d, peak){
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(f1, f2, dur, type, peak, delay){
    const c = ctx(); if (!c || !on) return;
    const t = c.currentTime + (delay||0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f1, t);
    if (f2 && f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(30,f2), t + dur);
    env(g, t, .006, dur, peak || .25);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .06);
  }
  function noise(dur, type, freq, peak, delay, q){
    const c = ctx(); if (!c || !on) return;
    const t = c.currentTime + (delay||0);
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = type || 'bandpass';
    f.frequency.setValueAtTime(freq || 1200, t); f.Q.value = q || 1;
    const g = c.createGain(); env(g, t, .004, dur, peak || .3);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + dur + .05);
  }
  return {
    get on(){ return on; },
    toggle(){ on = !on; try{ localStorage.setItem('ba_sound', on?'1':'0'); }catch(e){} if(on){ ctx(); this.click(); } return on; },
    unlock(){ ctx(); },

    hit(big){

      if (big) tone(90, 40, .3, 'triangle', .3, .02);
    },
    counter(){ tone(300, 900, .12, 'square', .26); noise(.12,'bandpass',1800,.22); },
    laser(){

      tone(1100, 90, .34, 'square', .16, .01);
      noise(.3, 'highpass', 1400, .18, .03);
    },
    bolt(){

      if (big){ noise(.07, 'bandpass', 1500, .3, .09, 2); noise(.06, 'bandpass', 1100, .26, .16, 2); }
    },

    crowd(big){

/* Legendaries are 20 of 5,000. Drawing opponents evenly from the demo roster
   would make them most of what you meet, so they're weighted down. */
function pickOpponent(exceptId){
  const taken = typeof OPP !== 'undefined' && !WALLET.demo ? isTaken : () => false;
  const all = DATA.fighters.filter(f => f.id !== exceptId);
  const pool = all.filter(f => !taken(f)).length ? all.filter(f => !taken(f)) : all;   // never run dry
  const legs = pool.filter(f => f.legendary);
  // Real collection rivals when we have them; the five demo dogs only until the pool has loaded.
  // Each one met leaves the pool and a fresh one is fetched, so faces keep changing.
  const real = (typeof OPP !== 'undefined' && !WALLET.demo) ? OPP.pool.filter(f => f.id !== exceptId && !f.legendary && !taken(f)) : [];
  const legendary = legs.length && Math.random() < .12;       // Legendaries: about one fight in eight
  if (real.length && !legendary){
    const f = real[rint(0, real.length - 1)];
    OPP.pool = OPP.pool.filter(x => x !== f); lsSet('ba_opps', OPP.pool); oppTopUp();
    return f;
  }
  if (legendary) return legs[rint(0, legs.length - 1)];
  const rest = pool.filter(f => !f.legendary);
  const src = rest.length ? rest : legs;
  return src[rint(0, src.length - 1)];
}

/* The arena is a knockout tournament of three fights (quarter-final, semi,
   final): a loss ends that tournament. Everyone gets three tournaments a day.
   Sign up and you fight it yourself. Don't, and your squad still enters —
   as ghosts that play your dogs for you. Live pays full XP, ghosts half. */
const ARENA_HOUR = 19;                       // UTC
const ARENA_XP = [0, 35, 60, 100];           // by rounds won: out in round 1 … champion
const ARENA_RUNS = 3;                        // tournaments per day
/* Arena rivals are real: Scrappys other signed-in players hold, at the bond
   level their owner trained them to, shown as "#123 from <name or wallet>".
   Only when nobody else has played yet (or in the demo) does a wild,
   ownerless collection dog step in. */
const RIVALS = {list:null, ready:[], total:0, at:0, loading:null};
function ensureRivals(){
  if (!LIVE() || !WALLET.token || WALLET.demo) return Promise.resolve([]);
  if (RIVALS.loading) return RIVALS.loading;
  const fresh = RIVALS.list && Date.now() - RIVALS.at < 5 * 60 * 1000;
  RIVALS.loading = (async () => {
    try {
      if (!fresh){
        const r = await api('/arena/rivals'); const j = await r.json();
        if (r.ok){ RIVALS.list = j.rivals || []; RIVALS.total = j.total || 0; RIVALS.at = Date.now(); RIVALS.ready = []; }
      }
      for (const x of (RIVALS.list || []).slice(0, 9)){
        if (RIVALS.ready.some(y => y.token === x.token)) continue;
        try { const def = await loadDef({nft_id: 'riv' + x.token, uri: x.uri}); RIVALS.ready.push({...x, def}); } catch(e){}
      }
    } catch(e){}
    RIVALS.loading = null;
    return RIVALS.ready;
  })();
  return RIVALS.loading;
}

function nextArena(){
  const n = new Date(), t = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate(), ARENA_HOUR));
  if (t <= n) t.setUTCDate(t.getUTCDate() + 1);
  return t;
}
function until(t){
  const m = Math.max(0, Math.round((t - Date.now())/60000));
  return m >= 60 ? Math.floor(m/60)+'h '+(m%60)+'m' : m+'m';
}
function ghostOpp(round, used){
  used = used || new Set();
  // registered squads first, then other players' dogs; repeats only once everyone has been met
  const fresh = RIVALS.ready.filter(x => !used.has(x.token)), sq = fresh.filter(x => x.squad);
  const pool = sq.length ? sq : fresh.length ? fresh : RIVALS.ready;
  if (pool.length){
    const x = pool[rint(0, pool.length - 1)]; used.add(x.token);
    return {def: x.def, lvl: x.lvl, path: x.path || null, who: x.owner, rid: x.id, squad: !!x.squad};
  }
  // nobody else has played yet: a wild collection dog, no owner to show
  return {def: pickOpponent(null), lvl: Math.min(BOND.maxLevel, 1 + round + rint(0,2)), who: null};
}
/* Today's squad is registered on the server: while it is, other players meet
   these dogs in their arenas and each defence earns them bond XP (18 for a win,
   6 for a loss, up to 120 a dog a day), collected on the owner's next visit. */
let arenaRegKey = '';
function arenaRegister(){
  if (!LIVE() || !WALLET.token || WALLET.demo || !OWNED) return;
  const ids = SAVE.data.arena.squad.filter(id => OWNED.some(f => f.id === id));

async function claimDefense(){
  if (!LIVE() || !WALLET.token || WALLET.demo || !OWNED) return;
  try {
    const r = await api('/arena/defense'); const j = await r.json();
    const items = (j.items || []);
    if (!r.ok || !items.length) return;
    let xp = 0, wins = 0, ups = [];
    for (const e of items){
      const f = OWNED.find(x => x.id === e.id); if (!f) continue;       // sold since: nothing to credit
      xp += e.xp; if (e.won) wins++;
      for (const l of SAVE.bondXp(e.id, e.xp)) ups.push(`${f.name} reached Bond ${l}`);
    }
    await api('/arena/defense/claim', {method:'POST', body:{upTo: Math.max(...items.map(e => e.at))}});
    if (xp) WALLET.defenseNote = `While you were away your arena squad defended ${items.length} time${items.length===1?'':'s'} (${wins} win${wins===1?'':'s'}): +${xp} bond XP.` + (ups.length ? ' ' + ups.join(' · ') + '!' : '');
    menu();
  } catch(e){}
}

async function prizeClaim(key){
  const [week, place] = key.split('|'), p = PRIZE.list.find(x => x.week + '|' + x.place === key);
  PRIZE.claim = {key, msg:'Looking up your offer on the ledger…'}; menu();
  const got = () => { PRIZE.claim = null; PRIZE.list = PRIZE.list.filter(x => x !== p);
    PRIZE.done = `Pixel Scrappy #${p.token} is in your wallet now. Welcome to the kennel!`; loadKennel(true); };
  try {
    const r = await api('/prizes/claim', {method:'POST', body:{week, place}}), j = await r.json();
    if (j.state === 'claimed'){ got(); return; }
    if (!r.ok || !j.uuid) throw new Error(j.error === 'offer_not_found' ? "The offer isn't on the ledger yet — try again in a minute."
      : j.error === 'xaman_not_configured' ? 'Accept the offer in your wallet, then tap Accept again.' : 'Could not prepare the request — try again.');
    PRIZE.claim = {key, qr:j.qr, link:j.deeplink, msg:'Scan with Xaman and sign — free, no XRP paid.'}; menu();
    const t0 = Date.now();
    while (PRIZE.claim && PRIZE.claim.key === key && Date.now() - t0 < 10 * 60 * 1000){
      await wait(2500);
      const s = await (await api('/prizes/status?uuid=' + j.uuid)).json().catch(() => ({}));
      if (s.state === 'signed'){ got(); return; }
      if (s.state && s.state !== 'pending') throw new Error(s.state === 'rejected' ? 'Declined in Xaman.' : s.state === 'expired' ? 'The request expired.' : 'It did not go through (' + (s.result || s.state) + ').');
    }
  } catch(e){ PRIZE.claim = {key, msg: e.message}; menu(); setTimeout(() => { if (PRIZE.claim && PRIZE.claim.key === key && !PRIZE.claim.qr){ PRIZE.claim = null; menu(); } }, 6000); }
}
/* Lending: a holder lends a Scrappy to a player without one — the NFT stays
   put, the server just records it. The borrower's kennel shows the dog (at the
   bond level it has in its owner's kennel); what the borrower earns with it is
   reported to the server: the bond XP goes to the dog, 25 % of the trainer XP to
   the owner, both collected on the owner's next visit. */
const LEND = {out:[], in:[], note:'', err:'', open:false, seeking:false, seekers:[], listings:[], market:[]};
async function loadLending(){
  if (!LIVE() || !WALLET.token || WALLET.demo) return;
  let j;
  try { const r = await api('/lend'); j = await r.json(); if (!r.ok) return; } catch(e){ return; }
  LEND.out = j.out || []; LEND.in = j.in || []; LEND.seeking = !!j.seeking; LEND.seekers = j.seekers || []; LEND.starter = j.starter || null;
  LEND.listings = j.listings || []; LEND.market = j.market || [];
  // borrowed dogs join the kennel, at their real bond level
  for (const l of LEND.in){
    if ((OWNED || []).some(f => f.id === l.dog.id)) continue;
    try {
      const def = await loadDef({nft_id: l.dog.id, uri: l.dog.uri});
      def.borrowed = {loan: l.id, from: l.ownerName, end: l.end, starter: !!l.starter};
      SAVE.setBond(l.dog.id, l.lvl, l.xp);
      OWNED = (OWNED || []).concat(def);
      if (!OPP.base){ oppLearnBase([{uri: l.dog.uri}]); oppTopUp(); }      // a starter trainer's rivals: the same collection
    } catch(e){}
  }
  // loans that ended: the dog leaves the kennel again
  OWNED = (OWNED || []).filter(f => !f.borrowed || LEND.in.some(l => l.id === f.borrowed.loan));
  // what my lent dogs earned while away
  const rw = j.rewards || [];
  if (rw.length){
    let bond = 0, trainer = 0; const ups = [];
    for (const e of rw){
      const f = (OWNED || []).find(x => x.id === e.id && !x.borrowed);
      if (f){ bond += e.bond; for (const l of SAVE.bondXp(e.id, e.bond)) ups.push(`${f.name} reached Bond ${l}`); }
      trainer += e.trainer;
    }
    if (trainer) SAVE.trainerAdd(trainer);
    await api('/lend/claim', {method:'POST', body:{upTo: Math.max(...rw.map(e => e.at))}}).catch(() => {});
    if (bond || trainer) LEND.note = `Your lent Scrappys fought ${rw.length} time${rw.length===1?'':'s'}: +${bond} bond XP for them, +${trainer} trainer XP for you (your 25 % share).` + (ups.length ? ' ' + ups.join(' · ') + '!' : '');
  }
  if (tab === 'kennel' && !WALLET.loading) menu();
}

   2. REVEAL  — once both hashes are in, both publish move + salt. A reveal

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

async function sha(s){

function resolveSeeded(pa, ea, seed){

    oppDog:null, move:null, salt:null, commit:null, revealed:false, resolved:0, started:false, ended:false, status:'Connecting…'});
  lobbySet({st:'fighting', dog:CLUB.myDog, lvl:CLUB.myLvl});
  app.innerHTML = `<div class="card"><p class="mini" style="margin:0">🥊 Connecting to the ring…</p></div>`;
  try { CLUB.room = await ROOM.join(roomName); }
  catch(e){ clubAbort('Could not open the ring (' + (e && e.code || 'error') + ').'); return; }
  await CLUB.room.presence({fc:{dog:CLUB.myDog, lvl:CLUB.myLvl, ready:true, t:0}});
  CLUB.unsub = CLUB.room.onPeers(ch => clubTick(ch), err => clubAbort('The ring closed (' + err.code + ').'));
  CLUB.waitSince = Date.now();
  clubTimer();
}

function clubOpp(){ return CLUB.room ? CLUB.room.peers().find(p => !p.sameTab && p.presence && p.presence.fc) : null; }
function clubMe(){ return CLUB.room ? CLUB.room.peers().find(p => p.sameTab) : null; }

async function clubTick(ch){
  if (!CLUB.room || CLUB.ended) return;
  if (ch && ch.left && CLUB.started && ch.left.some(p => !p.sameTab)){ clubEnd(true, 'Your opponent left the ring — you win by forfeit.'); return; }
  const op = clubOpp(), me = clubMe(); if (!op || !me) return;
  const o = op.presence.fc;

  // both in: build the fight in a fixed order so both pages match
  if (!CLUB.started && o.ready){
    CLUB.side = me.peer < op.peer ? 'A' : 'B';
    CLUB.oppDog = o.dog; CLUB.oppLvl = +o.lvl || 1;
    const a = CLUB.side==='A' ? [CLUB.myDog, CLUB.myLvl] : [CLUB.oppDog, CLUB.oppLvl];
    const b = CLUB.side==='A' ? [CLUB.oppDog, CLUB.oppLvl] : [CLUB.myDog, CLUB.myLvl];
    const da = clubDogDef(a[0]), db = clubDogDef(b[0]);
    if (!da || !db){ clubAbort('Unknown fighter on one side.'); return; }
    CLUB.started = true;
    P = build(da, a[1], null); E = build(db, b[1], null);
    turn = 1; log = []; ev = []; over = false;
    LBL.P = CLUB.side==='A' ? 'You' : 'Your opponent';
    LBL.E = CLUB.side==='A' ? 'Your opponent' : 'You';
    say(`<span class="turn">🥊 Fight Club — live. ${esc(da.name)} (Bond ${a[1]}) vs ${esc(db.name)} (Bond ${b[1]}).</span>`);
    shell(); clubNewTurn();
    return;
  }
  if (!CLUB.started || busy) return;

  // opponent committed this turn and so have we → reveal
  if (CLUB.commit && !CLUB.revealed && o.t === turn && o.commit){
    CLUB.revealed = true;
    await CLUB.room.presence({fc:{dog:CLUB.myDog, lvl:CLUB.myLvl, ready:true, t:turn, commit:CLUB.commit,
                                  rv:{t:turn, m:CLUB.move, s:CLUB.salt}, last:null}});
    CLUB.status = 'Both locked in — revealing…'; renderControls();
  }
  // both revealed → verify and resolve
  // Everything about this turn is captured BEFORE awaiting the hash, and the
  // turn is locked, so a second update arriving mid-check can't resolve it twice.
  const t = turn;
  const fromRv = !!(o.rv && o.rv.t === t);
  const orv = fromRv ? o.rv : (o.last && o.last.t === t ? o.last : null);
  if (CLUB.revealed && orv && CLUB.resolved < t && CLUB.checking !== t){
    CLUB.checking = t;
    const theirCommit = fromRv ? o.commit : o.last.commit;
    const check = await sha(orv.m + '|' + orv.s + '|' + t);
    if (CLUB.ended || turn !== t || CLUB.resolved >= t) return;
    if (check !== theirCommit){ clubEnd(true, "Your opponent's move didn't match what they locked in — you win by forfeit."); return; }
    CLUB.resolved = t;
    const sA = CLUB.side==='A' ? CLUB.salt : orv.s, sB = CLUB.side==='A' ? orv.s : CLUB.salt;
    const mA = CLUB.side==='A' ? CLUB.move : orv.m, mB = CLUB.side==='A' ? orv.m : CLUB.move;
    const pa = moveOf(P, mA), ea = moveOf(E, mB);
    resolveSeeded(pa, ea, seedOf(sA + ':' + sB + ':' + t));
    play();
  }
}

function clubNewTurn(){
  CLUB.move = null; CLUB.salt = null; CLUB.commit = null; CLUB.revealed = false;
  CLUB.deadline = Date.now() + CLUB_TURN_MS; CLUB.waitSince = Date.now();
  CLUB.status = 'Choose your move.';
  renderControls();
  clubTick();
}
async function clubChoose(m){
  if (CLUB.commit || CLUB.choosing || over || !CLUB.started) return;
  CLUB.choosing = true;
  S.unlock(); S.click();
  CLUB.move = m; CLUB.salt = randSalt();
  CLUB.commit = await sha(m + '|' + CLUB.salt + '|' + turn);
  CLUB.choosing = false;
  const prev = CLUB.resolved ? null : null;
  await CLUB.room.presence({fc:{dog:CLUB.myDog, lvl:CLUB.myLvl, ready:true, t:turn, commit:CLUB.commit, rv:null,
    last: CLUB.lastRv || null}});
  CLUB.status = 'Locked in. Waiting for your opponent…'; CLUB.waitSince = Date.now();
  renderControls(); clubTick();
}
function clubTimer(){
  clearInterval(CLUB.tick);
  CLUB.tick = setInterval(() => {
    if (!clubMode || CLUB.ended) { clearInterval(CLUB.tick); return; }
    if (!CLUB.started){
      if (Date.now() - CLUB.waitSince > CLUB_AFK_MS) clubAbort('Your opponent never showed up in the ring.');
      return;
    }
    if (busy || over) return;
    if (!CLUB.commit && Date.now() > CLUB.deadline) { clubChoose('guard'); return; }   // out of time: you guard
    if (CLUB.commit && Date.now() - CLUB.waitSince > CLUB_AFK_MS){ clubEnd(true, 'Your opponent stopped answering — you win by forfeit.'); return; }
    const t = document.getElementById('fcClock');
    if (t && !CLUB.commit) t.textContent = Math.max(0, Math.ceil((CLUB.deadline - Date.now())/1000)) + 's';
  }, 250);
}
/* called by play() when a turn's animation has finished */
function clubAfterTurn(){
  if (CLUB.srv){ scAfterTurn(); return; }
  CLUB.lastRv = {t: turn - 1, m: CLUB.move, s: CLUB.salt, commit: CLUB.commit};
  if (over){
    const v = verdict();
    const won = CLUB.side === 'A' ? v === 'YOU WIN' : v === 'YOU LOSE';
    clubEnd(won, v === 'DRAW' ? 'A draw.' : null, v === 'DRAW');
    return;
  }
  CLUB.room && CLUB.room.presence({fc:{dog:CLUB.myDog, lvl:CLUB.myLvl, ready:true, t:turn, commit:null, rv:null, last:CLUB.lastRv}});
  clubNewTurn();
}
function clubEnd(won, why, draw){
  if (CLUB.ended) return;
  CLUB.ended = true; over = true; clearInterval(CLUB.tick);
  SAVE.clubResult(draw ? 'd' : (won ? 'w' : 'l'));
  CLUB.result = {won, why, draw};
  won && !draw ? S.win() : (draw ? S.heal() : S.lose());
  renderControls();
}
function clubAbort(why){
  CLUB.ended = true; clearInterval(CLUB.tick);
  clubLeave();
  tab = 'club'; menu();
  const b = document.getElementById('clubLobby'); if (b) b.insertAdjacentHTML('afterbegin', `<p class="mini" style="margin:0 0 10px"><b>${esc(why)}</b></p>`);
}
function clubLeave(){
  try { CLUB.unsub && CLUB.unsub(); } catch(e){}
  try { CLUB.room && CLUB.room.leave(); } catch(e){}
  CLUB.room = null; CLUB.unsub = null; clubMode = false;
  LBL.P = 'Your Scrappy'; LBL.E = 'The opponent';
  const d = SAVE.data.club || {};
  lobbySet(d.dog ? {st:'looking', dog:d.dog, lvl:SAVE.dog(d.dog).lvl} : null);
}

function renderClubControls(c){

      <b>${esc(a.value)} · ${a.cost}◆</b><small>${esc(a.text)}</small></button>`).join('');
